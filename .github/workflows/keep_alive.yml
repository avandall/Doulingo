name: Keep Render App Alive

on:
  schedule:
    # Chạy mỗi 13 phút một lần (Render free sleep sau 15 phút không có traffic)
    - cron: '*/13 * * * *'
  workflow_dispatch: # Cho phép bấm nút chạy thủ công từ GitHub Actions tab

jobs:
  ping-service:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Web App
        run: |
          echo "Sending keep-alive ping to Render at $(date)..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://haku-hakus.onrender.com/)
          echo "Response HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 500 ]; then
            echo "Render app is active and responding (Status: $HTTP_STATUS)!"
          else
            echo "Warning: Received HTTP $HTTP_STATUS from Render app."
          fi
