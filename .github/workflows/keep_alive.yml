name: Keep Render App Alive

on:
  schedule:
    # Chạy mỗi 8 phút (khắc phục độ trễ jitter của GitHub Actions, đảm bảo luôn < 15 phút của Render)
    - cron: '*/8 * * * *'
  workflow_dispatch: # Cho phép bấm nút chạy thủ công từ GitHub Actions tab

jobs:
  ping-service:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Web App with Smart Retry
        run: |
          URL="https://haku-hakus.onrender.com/api/health"
          FALLBACK_URL="https://haku-hakus.onrender.com/health"
          MAX_RETRIES=3
          TIMEOUT=120
          SUCCESS=false

          echo "🚀 Starting keep-alive ping to Render at $(date)..."

          for i in $(seq 1 $MAX_RETRIES); do
            echo "--- Attempt $i of $MAX_RETRIES (Timeout: ${TIMEOUT}s) ---"
            
            # Gửi request với User-Agent chuẩn và đo HTTP status + thời gian phản hồi
            HTTP_RESPONSE=$(curl -s -w "\n%{http_code}\n%{time_total}" \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36 KeepAlive/2.0" \
              -H "Cache-Control: no-cache" \
              --max-time $TIMEOUT \
              "$URL") || true

            HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d' | sed '$d')
            HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n 2 | head -n 1)
            TIME_TOTAL=$(echo "$HTTP_RESPONSE" | tail -n 1)

            echo "Response Body: $HTTP_BODY"
            echo "HTTP Status Code: $HTTP_STATUS (Took ${TIME_TOTAL}s)"

            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
              echo "✅ Render app is ACTIVE and healthy!"
              SUCCESS=true
              break
            else
              echo "⚠️ Attempt $i failed with status $HTTP_STATUS. Waiting 10s before retry..."
              sleep 10
              # Thử fallback URL nếu lần đầu bị lỗi
              URL="$FALLBACK_URL"
            fi
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "❌ All $MAX_RETRIES attempts failed to reach Render app."
            exit 1
          fi

