services:
  - type: web
    name: duolingo-speak
    env: python
    buildCommand: "pip install -r requirements.txt || pip install fastapi uvicorn pydantic gtts requests python-dotenv"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
