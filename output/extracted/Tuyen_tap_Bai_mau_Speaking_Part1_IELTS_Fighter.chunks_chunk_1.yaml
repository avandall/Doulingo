- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Does the weather affect people’s lives in your country?
  user_model_answer: I believe that the weather always affects us in every aspect. If it is a gloomy day, I'm pretty sure everyone will easily get bored or tired of whatever they are doing. In contrast, the sunny days make us feel alive and upbeat.
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Is there anything in your hometown that is being polluted?
  user_model_answer: Yes, and I would say pretty much everything is polluted there. For starter, air quality has deteriorated at an alarming rate. One literally cannot go out without wearing a medical face mask. The same goes for the streets, as people tend to litter indiscriminately.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. What causes pollution?
  user_model_answer: It's hard to tell, but I would put the blame on the people who disrespect their surroundings by constantly littering and ignoring how the environment is degrading day by day. As pollution is linked to all types of social and economic issues, we must all be aware of the destruction we're causing on our own.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Have you ever done anything to help protect the environment?
  user_model_answer: Not in a direct way, to be honest. Although I'm well aware of my responsibilities to the environment, it's really difficult to contribute anything when you're just a student. So I would say, by not littering indiscriminately on the streets and not using so many plastic bags, I have done a little bit to help.
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. What do you do in the morning?
  user_model_answer: Well, obviously, personal hygiene activities are at the top of my list. Compared to other members of my family, I suppose I have some sort of weird morning rituals. For example, there are days when I just keep fussing over what to wear despite the fact that I have a wardrobe full of clothes.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Is breakfast important?
  user_model_answer: It is a scientific fact that breakfast is the most important meal of the day. It provides us with energy to begin our working day. For some others, breakfast can be the family mealtime, since adults are always up to their ears at work.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. What is your morning routine?
  user_model_answer: I've got a lot of those, to be honest. I usually start a day sipping a nice cup of latte and then make my own breakfast. Other than that, before I'm off to work, I often spend at least 15 minutes in front of my mirror, you know, to make sure that I look presentable.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Do you like to get up early in the morning?
  user_model_answer: That would be a solid no. I'm quite a night owl, you know, who spends most nights binge watching movies. Besides, whenever exams are around the corner, I
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Do you keep plants at home?
  user_model_answer: I do not have the habit of keeping plants in my house as I know I do not have the time and energy to do it. Not to mention, I’ve never been good at indoor gardening either. That being said, I have some artificial hanging plants in my bedroom, which is merely for decorative purpose.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. What plant did you grow when you were young?
  user_model_answer: When I was small, I used to be in charge of repotting a cactus for my science class. It didn’t require much watering, so my job was rather easy.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Do you know anything about growing a plant?
  user_model_answer: Absolutely no. I can’t even take care of a houseplant, let alone growing one. The only knowledge I’ve got about growing a plant is that it requires daily watering and sufficient sunlight. Without either of which, the plant will probably die in a short amount of time.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Do Vietnamese people send plants as a gift?
  user_model_answer: Well, from my own experience, I haven’t seen many people in my country give plants to others. Besides the fact that some types of plant can be hard to preserve, placing plants around a house is believed to be a difficult task since this is often associated with fengshui. This means that you have to get the suitable plant for the owner, or else bad omens might follow him, as some believe.
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Did you save money when you were young?
  user_model_answer: Yes, ever since I was a child, my parents have taught me about the value of money. Back then, my only source of income was the lucky money I received during Tet festivals. I established my own piggy bank and fed it with every dollar I got. So far, the pig is quite big, you know.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Have you ever given money to other children?
  user_model_answer: Yes, but not in a direct way. A few years ago, my school started a fund-raising campaign to support the underprivileged students in the North of Vietnam. I remember donating a majority of my allowance and some of my discarded clothes to the fund.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Do you think parents should teach children to save money?
  user_model_answer: Yes, I’m convinced that parents should instill some financial literacy in their kids. They should be aware of how to spend, save, or even donate money in an appropriate way. Money management is definitely one of the must-learn skills for everybody who wishes to live independently.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Do parents give pocket money in Vietnam?
  user_model_answer: Of course they do. I would say that Vietnamese parents are quite relaxed when it comes to giving their children pocket money. I even know some moms, who are trying to teach their kids some responsibilities, use allowance as rewards for them every time they perfectly finish a household chore.
