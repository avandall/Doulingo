  ai_line: 1. Do people like comedy?
  user_model_answer: Yes, most people enjoy comedy because it makes them feel happy and relaxed. After a long day, laughing helps reduce stress. I believe comedy shows and movies are popular worldwide. Some even use humor to deal with serious topics.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Why do people of all ages like cartoons?
  user_model_answer: Cartoons are simple and fun to watch. Children like them for colors and stories, and adults like the memories they bring. Some cartoons even have smart jokes for adults. So, everyone finds something to enjoy.
- band_level: 7.5
