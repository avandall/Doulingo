- band_level: 7.5
  turn_type: standalone
  ai_line: 1. What are the differences between indoor sports and outdoor sports?
  user_model_answer: Indoor sports are played inside a building, like badminton or table tennis, while outdoor sports like cricket or football are played outside. Outdoor games need more space and depend on weather. I feel outdoor sports give more fresh air and sunshine. But indoor games are good during bad weather.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Which outdoor sports are popular in India?
  user_model_answer: I think sports like cricket, football, and running are quite popular in India. Many people also enjoy Kabaddi in parks. The younger generation plays cricket, and elders prefer something slow and relaxing. Sports events like marathons are also common.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Which sports are popular among elderly people?
  user_model_answer: Elderly people usually like slow and low-impact sports like badminton, yoga, or slow running. These help with flexibility and keep the body active without much pressure. In my opinion, running in parks is the most common. It also allows them to meet friends.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Which outdoor sports are popular with children?
  user_model_answer: Children love to play games like cricket, football, and cycling. These are fun and help them stay fit. I remember when I was young, I played cricket every evening with my friends. It also helps them learn teamwork.
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. How does weather affect outdoor sports?
  user_model_answer: Weather plays a big role in outdoor sports. If it's raining or too hot, people can't play outside. Sometimes, games get canceled due to bad weather. That’s why indoor options are always helpful.
- band_level: 7.5
  turn_type: standalone
