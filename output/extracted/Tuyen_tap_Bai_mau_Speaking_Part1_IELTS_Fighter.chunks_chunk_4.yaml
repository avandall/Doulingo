  ai_line: 4. Do you think your city is clean or not?
  user_model_answer: I don’t think so. There’s a decline in the air quality since the city is always filled with emissions from the expanding fleets of cars and motorcycles and also construction projects surrounding the city. Also the lack of green spaces is another major problem that our city has to face. Hundreds of decades-old trees in Hanoi have been chopped down to expand roads and lay the metro line network, with authorities consistently prioritizing urbanization over protecting the environment.
