sample_dialogues:
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Do you think it’s important to plan ahead?
  user_model_answer: I think planning ahead is important because it helps us avoid unnecessary stress and mistakes. When I plan things, I feel more in control and I use my time better. Of course, we can’t plan everything in life, but having at least a basic idea makes things smoother.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Do you think children should plan their future careers?
  user_model_answer: Hmm, I believe children can think about their interests, but planning careers too early might be unrealistic. Most kids don’t really know what they want, and their interests change as they grow. Instead of a fixed plan, I prefer giving them exposure to different fields so they can choose later.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Is making study plans popular among young people?
  user_model_answer: Yes, it’s quite popular, especially before exams or competitive tests. Many students make timetables or set goals to stay organized. Some do it because it actually helps, while others do it because teachers or parents push them. I used to make study plans in school as well, and they kept me focused.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Do you think choosing a college major is closely related to a person’s future career?
