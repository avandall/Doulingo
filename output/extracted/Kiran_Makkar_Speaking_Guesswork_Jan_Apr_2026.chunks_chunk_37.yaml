- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Do you prefer to read eBooks or printed books?
  user_model_answer: I prefer printed books over e-books because I find it difficult to read on a small mobile device or a tablet. Moreover, I think reading eBooks on brightly lit screens is harmful to the eyes.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. What kinds of novels are suitable for a film adaptation?
  user_model_answer: I think all kinds of novels, be it suspense, drama, or thriller, are suitable for film adaptation. Anything that can be written as a story could be visualized as well.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. How does technology help people tell stories?
  user_model_answer: I think there are two ways in which technology helps in telling stories. Firstly, with the help of technology, people can animate their stories and help the audience to visualize the characters. Secondly, technology helps to reach a wider audience.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Why are mystery novels so popular nowadays?
  user_model_answer: Mystery novels are popular simply because of the curiosity factor. People are always interested in things involving suspense and in stories where the outcome is not certain. Such novels keep people guessing till the end, and thus they like it more as compared to any other novel in which they would know the ending beforehand.
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. Is there any difference between the popular novels now and those in the past?
  user_model_answer: I think in the past, novels were often more classic, formal, and focused on social or moral themes. Today, many popular novels are fast-paced, with simple language and a focus on entertainment, mystery, and fantasy. Modern novels reflect current issues and trends so today's readers can relate to them.
- band_level: 7.5
  turn_type: standalone
