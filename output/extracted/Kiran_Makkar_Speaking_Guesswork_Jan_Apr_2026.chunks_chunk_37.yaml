  ai_line: 1. Why should children be kind to their classmates?
  user_model_answer: I think children should be kind to their classmates because it helps them build trust and strong friendships. It makes everyone feel included, and it is important for learning and growing together. 2.Can children choose their deskmates? In the primary classes, it should be decided by the teachers, because the teacher will know better which students could be more helpful for each other if made to sit together. In senior classes, children can figure out for themselves who to sit with.
