  ai_line: 65. Writing 1 Do you write a lot?
  user_model_answer: I don’t write a lot these days. However, I am trying to start a habit of maintaining a journal. 2 What do you like to write? Why? Nowadays, I don’t write anything, but in the past, I used to write my views about different political issues. Writing was just a means for me to express myself. 3 Do you think the things you write would change? I am not sure. I think I write only when I am very passionate about something. So, if in the future I am passionate about something, I would write about that. 4 Do you prefer typing or handwriting when you are writing? I prefer typing as compared to handwriting because I generally do it on websites. Also, my typing speed is a lot faster as compared to handwriting.
- band_level: 7.5
  turn_type: standalone
  ai_line: 66. Weather 1 What's the weather like where you live?
  user_model_answer: I live in Punjab. It is like a semi-arid region and the weather is mainly hot and dry, except in the monsoons when it rains a lot, and it becomes hot and humid. 2 Do you prefer cold or hot weather? I prefer cold weather because I think I work more effectively in cold weather. In hot weather, I feel lazy and lethargic somehow. 3 Do you prefer dry or wet weather? I love the rain. Perhaps it’s because I live in a dry region, and it receives very less rainfall. 4 Are you in the habit of checking the weather forecast? When/How often? I normally don’t check the weather forecast except during the monsoons. During the monsoon season, the rainfall becomes very unpredictable and so before I leave the house, I check the weather forecast and if it is going to rain, I carry an umbrella. 5 What do you think are the effects of climate change in recent years? www.youtube.com/makkarielts www.instagram.com/makkarielts www.makkarielts.com/books 278 Jan-Apr 2025 Speaking Guesswork (FINAL
    VERSION) www.makkarielts.com/books I think there have been a lot of changes. However, the biggest has been the change of seasons. The summers have become a lot hotter and extended. I remember it used to be cold during Diwali, a festival we celebrate in October/November, but now it is warm. 6 Would you like to visit other cities that have different climates from where you live? Yes, I love to visit cities with cold climate because Punjab has very hot and warm weather and we don’t get to enjoy cold climate. That is why I love going to hill stations. I also live visiting coastal cities because I enjoy beaches.
