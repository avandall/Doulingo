- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Have you ever tried foreign food?
  user_model_answer: As a foodie, of course I have tasted different kinds of food, and imported food and beverages are no exception. My top two favorites are Italian pizza and Taiwanese bubble milk tea, which are considered the most popular among Vietnamese youngsters.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Do you like to try new food?
  user_model_answer: I’m all about experiencing new things, but new foods are off limit. I mean, there are a number of foods that can literally haunt me for life. For example, Mam Tom, which is a type of stinky and pungent shrimp paste used in many Vietnamese dishes, is a kind of food that really puts me off.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. What kinds of new foods have you tried recently?
  user_model_answer: Recently I’ve been thinking about healthy eating, so I’ve tried my best to find a snack that is both scrumptious and low-carb. And finally I found Sua Chua Nep Cam, which is a mixture of brown glutinous rice and unsweetened yogurt. I have eaten this on a daily basis, and now I’ve lost 2kg.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Do you like any food from other countries near Vietnam?
  user_model_answer: Of course I do. I have a profound passion for Chinese cuisine as I have spent some time in this country. I can spend hours drooling over Beijing roasted duck and Guangzhou homemade noodles. Whenever I’ve got the munchies, I just daydream about feasting on these incredible dishes.
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. What kinds of music do you like to listen to?
  user_model_answer: My music taste varies widely from West to East and from the 90s to modern EDM. But if Korean pop is considered as a kind of music, then yeah, that’s my favorite of all time. More than half of my playlists are Korean songs and I always keep myself updated with the news related to Korean showbiz.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. How much time do you spend listening to music every day?
  user_model_answer: As I’ve mentioned I prefer working in silence. To put it simply, no music is allowed during my working hours. After a long day at school, I probably want to pump myself up for like half an hour with music to help me stay energetic so I can get back to work later.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Do you like any foreign celebrities?
  user_model_answer: Absolutely. The person that I have had a soft spot for is Miley Cyrus. I guess most people at the same age as me grew up with Disney Channel and among its successful series, Hannah Montanah starring Miley Cyrus would always be on top of my list. Although now she’s grown up, I’m still a big fan of her amazing voice and highly inspiring songs.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Would you like to become a widely-known celebrity? Why?
  user_model_answer: Well though I’ve never thought about it, I’m pretty sure that rising to stardom would never be one of my life goals. I appreciate all the efforts that celebrities, no matter which field they’re working on, are making every single day. However, I
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Do you like shopping for shoes?
  user_model_answer: Of course. Shopping for clothes and accessories is obviously every girl's favorite activity whenever we have free time and shoes are no exception. I often buy shoes when they are on sale to save my money.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. How often do you buy shoes?
  user_model_answer: I'm not quite sure about this. I suppose I just purchase a pair of shoes when my old ones have worn out. Or like I mentioned earlier, whenever shoes are on discount.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. What kinds of shoes do you usually buy?
  user_model_answer: I have a soft spot for ankle boots and sneakers. Ankle boots are stylish and sneakers are very sporty, which match my outfits very much.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. What kinds of shoes do you usually wear?
  user_model_answer: As I go to school everyday, I don't think boots would be comfortable for me. So sneakers and flat shoes are my top choices. Other than that, I only wear boots or high heels when attending some fancy events.
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Do you use email?
  user_model_answer: Of course, I use it almost everyday and almost exclusively for work because you know, it is very popular around the globe for corporate communication and it really comes in handy compared to written letters.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Do you prefer use email or text messaging Well, I personally prefer texting because what’s quicker than sending a text right?
  user_model_answer: Texting doesn’t require formal greeting. Besides, texting comes pre-built on mobile phones and, unlike email, is available even without a wifi connection, which makes texting a more accessible medium.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Do you think it’s important to reply to emails immediately (or quickly) after you receive them?
  user_model_answer: Well, i think it’s absolutely crucial to instantly respond to emails because if someone takes a long time to write you back, you’ll probably start to think that they are being discourteous and disrespectful of your time. By sending a quick acknowledgement email, you are being polite, well-mannered, and respectful.
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. At work or in your studies, do you often write things?
  user_model_answer: Yes, I write a lot of emails as part of my job. I work for a company that has offices in several countries, so we use email to communicate.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Do you often send emails?
  user_model_answer: Normally it seems like a daily routine for me to write emails to my clients about how to use the system; but if they complain to me about the poor user experience, I sometimes really find myself getting stuck in explaining to comfort them.
- band_level: 7.0
  turn_type: standalone
  ai_line: 3. How often do you send e-mails?
  user_model_answer: I probably write between 5 and 10 work emails every day, and I send emails to friends or family a few times a week.
