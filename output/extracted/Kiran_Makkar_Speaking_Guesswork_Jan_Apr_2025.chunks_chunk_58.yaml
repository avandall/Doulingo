- band_level: 7.5
  turn_type: standalone
  ai_line: 20. Watch. Do you think it is important to wear a watch? Why?
  user_model_answer: No, I don’t think it is important to wear a watch these days as we can check time in the mobile phones. Why do some people wear expensive watches? I think expensive watches are a fashion accessory more than anything else. I have never bought one, but I think they are just a means to show off one’s wealth. Have you ever got a watch as a gift? Yes, my grandpa gave me a watch when I was a child. It was the first time he gave me something. It made me really happy. Do you wear a watch? No, I don’t. I normally use my mobile phone to check the time.
- band_level: 7.5
  turn_type: standalone
  ai_line: 21. Taking photos Do you want to improve your photography skills?
  user_model_answer: Yes I would love to learn more about photography. I think it is a skill that everyone should learn these days because clicking pictures has become an important part of our life. What is your favorite family photo? My favourite family photo is the one that was taken during my brother’s wedding. In this photograph all my family members are there, and everyone is smiling and looking happy. Do you like taking selfies? I am not a big fan of selfies. I take selfies with my friends when no one else is there to click our picture. Do you like taking photos? Yes I love taking pictures and people tell me that I have got good photography skills. www.youtube.com/makkarielts www.instagram.com/makkarielts www.makkarielts.com/books 259 Jan-Apr 2025 Speaking Guesswork (FINAL VERSION) www.makkarielts.com/books
- band_level: 7.5
  turn_type: standalone
  ai_line: 22. Cars. Do you think car colors are important?
  user_model_answer: Yes, in respect of cleaning. Some colours just look very dirty if not cleaned regularly. Moreover, a different colour can make the car stand out, which can be helpful in finding it in a crowded parking. What do you usually do when there is a traffic jam? I normally just listen to music on my mobile phone. Do you prefer to be a driver or a passenger? A passenger of course. I feel it gives me time to do other things. What types of cars do you like? I am not a car person. I prefer any car with comfortable seats and enough leg room and space for luggage. Did you enjoy traveling by car when you were a kid? No, I used to get car sick very easily. Especially, if the journey was long, I used to vomit at least once.
- band_level: 7.5
  turn_type: standalone
  ai_line: 24. Websites What kinds of websites are popular in your country?
  user_model_answer: There are many websites which are popular. Firstly, the search engine Google is the most popular website. Apart from that social media websites and apps like Facebook and Instagram are also popular. In terms of entertainment, it is websites like YouTube and movie streaming sites like Netflix, which are really popular.Finally, I think news and information websites like Wikipedia are also popular. Are there any changes to the websites you often visit? No, I don’t think so. Its kind of the same. There is one difference though. When I was a child I used to find free websites as I couldn’t afford to pay, now I have subscriptions to websites like Netflix and Amazon prime. What is your favorite website? My favourite website is of course google. I believe it has answers to any questions or doubts I have. What kinds of websites do you often visit? The two websites I visit most often today are Youtube and Google.
- band_level: 7.5
  turn_type: standalone
  ai_line: 25. Street market Are there many street markets in India?
  user_model_answer: Yes, street markets are very common in India as most people can’t costly branded items. When was the last time you went to a street market? I think it was last week. I had to buy headphones as I had lost my headphones. Do you prefer to go shopping in the shopping mall or on the street market? It depends upon what I am buying. For clothes and shoes, I prefer malls but for electronic items I normally visit street markets. www.youtube.com/makkarielts www.instagram.com/makkarielts www.makkarielts.com/books 261 Jan-Apr 2025 Speaking Guesswork (FINAL VERSION) www.makkarielts.com/books What do people usually buy on the street market? In India, you can buy almost everything on the street market from clothes, shoes, bags, groceries to even electronic appliances.
- band_level: 7.5
  turn_type: standalone
  ai_line: 26. Mobile phone How has your mobile phone changed your life?
  user_model_answer: I think it has nearly transformed my life both in a good way and bad way. On the positive side, I always have something to do because of my mobile phone and on the negative side, I am always distracted because of messages, email alerts and calls Will you buy a new one in the future? I change my mobile phone every three four years, when the battery of the old phone fails or it slows down considerably. Do you often use your mobile phone for texting or calls? Yes, I use it nearly every hour for both.I prefer texting but I do call as well. What was your first mobile phone? My first mobile phone was a Nokia 3310. It was a basic phone. I just used it for calling or texting.
- band_level: 7.5
  turn_type: standalone
  ai_line: 27. Time management. Do you like to be busy?
  user_model_answer: Yes, I love being busy. I am an over thinker. So, I think wrong thoughts when I am free so I prefer to be busy. When do you find it hard to allocate time? I find it hard to allocate time when something unexpected happens like my parents get busy and I have to take over their responsibilities or I fall sick. Normally, I am able to manage it well. Is it easy to manage time for you? www.youtube.com/makkarielts www.instagram.com/makkarielts www.makkarielts.com/books 262 Jan-Apr 2025 Speaking Guesswork (FINAL VERSION) www.makkarielts.com/books Normally, yes. But like I said, in case of something pops up out of the blue, it does get difficult and I do need to reschedule or cancel appointments. How do you plan your time in a day? I don’t plan on daily basis. I just have things to do and I start doing them in order of priority.
- band_level: 7.5
  turn_type: standalone
  ai_line: 28. Sports programs Have you ever watched a sports game in a stadium?
  user_model_answer: No, never. I want to someday. I was a big sports fan when I was young, but not so much anymore. However, if my friends make a plan, I would go surely accompany them. Do you prefer to watch sports games alone or with a group of friends? Neither. I don’t prefer watching games anymore. Earlier I used to prefer watching them with my friends. Now, its just hard to find time for watching sports game. I watch highlights sometimes, however. What kinds of games do you expect to watch in the future? I think sports matches would become shorter and shorter. Its very hard to find five six hours to watch a sports match, so in the future, there would be be abridged version of sports matches like it has happened in cricket with T20. Who do you like to watch sports games with? Earlier it used to be friends. Now I don’t watch sports games much. I only watch special events like olympics or world cups an I do that alone mostly. Do you like to watch live sports games? No, like I said before,
    I am not a big sports fan now. Do you like watching sports programs on TV? Yes, If I do watch them, I do watch them on TV.
