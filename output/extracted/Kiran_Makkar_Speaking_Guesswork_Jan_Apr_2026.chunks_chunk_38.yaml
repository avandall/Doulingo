- band_level: 7.5
  turn_type: standalone
  ai_line: 1. What kind of customer service do you think is good?
  user_model_answer: I think that creating a good customer experience depends on multiple factors. The companies should ensure that the staff providing the service are prompt, attentive, and most importantly, are very patient and polite with the client.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. What are the differences between shopping online and in-store?
  user_model_answer: There are numerous differences between online shopping versus shopping from brick-and-mortar stores. First of all, online shopping is more convenient as it saves a lot of time and energy. Also, it can be done 24X7, whereas, the stores are generally open for 10-12 hours only. The only benefit of retail stores is that an individual can make a better judgment of the look and feel of the product, which is not possible online.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. What problems do customers often have while shopping?
  user_model_answer: Generally, the customers are not able to easily find products/goods that match their needs or taste. For example, sometimes if a person likes a particular piece of clothing, he/she might not be able to find the right size for it. Other than that, sometimes they might have to deal with rude and impolite staff.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. What do you think customers should do when there are problems with products bought online?
  user_model_answer: The customers should immediately lodge a complaint with the website from which they have bought the product. Also, they should go through the refund and return policy for the product and then take the necessary action.
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. Can customer complaints help improve product quality?
  user_model_answer: Yes, customer complaints can help improve product quality. They give companies feedback about what is wrong or not working properly. Companies can then fix these problems and make better products in the future.
- band_level: 7.5
  turn_type: standalone
  ai_line: 6. What do you think of people complaining when they buy poor-quality goods at a low price?
