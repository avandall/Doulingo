- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Would people be willing to get up early to watch and enjoy the sunrise?
  user_model_answer: Well, I think some people are willing to wake up early for a sunrise because it feels peaceful and refreshing. For example, when I visited Shimla, I woke up at 5 am to watch the sunrise from the hills and it was worth it. On the other hand, many people, especially youngsters, prefer sleeping late instead of waking up early.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. When would people watch the sky?
  user_model_answer: Well, I believe people usually watch the sky in the evening when the sun sets or at night when stars are visible. Sometimes even during the day, like when clouds look beautiful before rain. Personally, I like to sit on my terrace at night and just look at the stars.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Do many people pay attention to the shapes of stars?
  user_model_answer: To be honest, not many people notice the shapes of stars, because life is busy and they don’t spend much time looking up. But some people, especially children or those interested in astronomy, like to recognise shapes such as the Big Dipper or Orion. I remember once in school my teacher showed us star constellations during a night camp.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. What do people usually see in the sky in the daytime?
  user_model_answer: Well, in the daytime people usually see the sun, clouds, and sometimes airplanes or birds. If the weather is clear, the sky looks bright blue. On hot summer afternoons, the strong sun is the main thing everyone notices.
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. What are the differences between things people see in the sky in the daytime and at night?
  user_model_answer: I think the day sky and night sky are completely different. During the day, the sun, clouds, and birds are visible. But at night, we see the moon, stars, and sometimes satellites. So in simple words, the day sky is bright and active, while the night sky is calm and shining.
- band_level: 7.5
  turn_type: standalone
