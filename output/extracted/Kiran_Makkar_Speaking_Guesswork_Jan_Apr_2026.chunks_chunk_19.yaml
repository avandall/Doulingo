- band_level: 7.5
  turn_type: standalone
  ai_line: 1. What sports do young people like?
  user_model_answer: I think young people usually like fast and energetic sports like football, basketball, or cricket. These games are social and give them a chance to play with friends. For example, in my area most kids gather in the evening to play cricket.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. What kind of people do extreme sports?
  user_model_answer: Well, I believe people who enjoy challenges and have adventurous personalities go for extreme sports. They are usually not afraid of risks and like to test their limits. For example, my cousin once tried bungee jumping on his trip to Goa.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Why are some people willing to try dangerous extreme sports?
  user_model_answer: According to me, people try dangerous sports because they want thrill and excitement. They feel proud after completing something risky. On the other hand, some people avoid it completely because they value safety more than adventure.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Should people take more into account the risks that extreme sports may bring?
  user_model_answer: Yes, I think so. Extreme sports can cause serious injuries if precautions are ignored. Wearing proper gear and listening to instructors is very important. Still, some people believe the fun is worth the risk, but I personally feel safety should come first.
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. Why do people keep inventing new and slightly dangerous sports?
  user_model_answer: In my opinion, people invent new sports because they get bored of old ones and want something exciting. Another reason is competition, as people like to show they can try something unique. For example, sports like parkour or snowboarding became popular only in recent years.
