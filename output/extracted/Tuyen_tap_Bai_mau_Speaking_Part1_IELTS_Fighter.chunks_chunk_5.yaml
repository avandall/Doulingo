sample_dialogues:
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Do you like watch films?
  user_model_answer: Absolutely! They are an excellent way to unwind (relax; free your mind). Moreover, my friends are reallt into films, so it’s a fun, relaxing way to spend time together. Afterwards, we discuss and debate the film that we have just watched. Apart from just relaxing and enjoying the film, I like to delve deeper (get to the deeper meaning) to discover the subliminal messages Yes I do, in fact I’m actually a movie buff. I find pleasure in watching different types of movies and to be honest I have numerous personal favorites of each type
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. What kinds of movies do you like best?
  user_model_answer: 'A1: Well, I would say I’m still a kid at heart, so I really enjoy watching kids’ movies. Although they seem simple and innocent, there are often many life lessons packed into these films. Moreover, I’m really into drama and historical movies. When I watch these, I feel that I can more deeply understand human emotions and re-live historical moments, like the Vietnam-America War or World War II.'
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. How often do you go to a cinema to watch a movie?
  user_model_answer: Because of the existence of internet, I rarely spend time watching movies in theatres. I love to watch movies in the comfort of my home, aside from the fact that it’s convenient, I almost don’t need to spend money. Going to a cinema is really costly, not only you spend money on tickets but you also have to pay for your snacks and fuel of your car.
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. Do people in your country like to go to a cinema to watch a film?
  user_model_answer: I would say so. Since people like to go out with their families on the weekends, this is often an activity that they would choose. Moreover, teenagers enjoy this activity as a way to get out of the house. Furthermore, it’s often a popular date option for many people!
