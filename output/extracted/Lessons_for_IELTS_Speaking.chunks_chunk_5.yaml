  ai_line: 17. Look at the script. What grammar structures do the speakers use when talking about past activities?
  user_model_answer: '**Past simple verbs:** - Families *spent* more time talking together. - *Did* + subject + base form verb? when asking a question about the past - What type of activities *did* people *do* in their free time? **Used to + base form verb** when talking about a past habit or state that no longer happens: - I think in the olden days, people *used to spend* their free time...'
