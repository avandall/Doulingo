sample_dialogues:
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. What types of buildings are popular in your country?
  user_model_answer: Well, in my country, modern high-rise apartments and shopping malls are very popular in big cities. People prefer them because they save space and offer facilities like parking and security. But in rural areas, single-storey houses are still common because land is cheaper and families live together.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Is it worth spending a lot of money on the exterior appearance of a building?
  user_model_answer: According to me, it depends on the purpose of the building. If it's a hotel or a commercial space, the exterior matters because it attracts customers. But for a normal house, I feel comfort is more important than decoration. Some people still like to invest in fancy exteriors just to show status, but I'm not too fond of that idea.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Is it more important for a building to look good on the outside or on the inside?
  user_model_answer: I personally believe the inside matters more. People spend most of their time indoors, so the space should be comfortable and practical. A building can look simple from the outside but still feel warm, neat, and useful on the inside. I’ve seen many houses like that, and they feel much nicer to live in.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Why do people like to visit historical sites?
