- band_level: 7.0
  turn_type: standalone
  ai_line: 1. Do you think you want to take up this job?
  user_model_answer: Yes, I would definitely like to take up this job. It requires great commitment but it is also well paid.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Which occupation should be given a better pay?
  user_model_answer: Teachers, doctors, nurses, entertainers, people in the civil services, people in the defense, those working in fire brigades, should all be given better pay.
- band_level: 7.0
  turn_type: standalone
  ai_line: 3. Is being rich a good thing?
  user_model_answer: Yes, being rich is a good thing. Rich people can help others. They can also satisfy/fulfill all their needs.
- band_level: 7.0
  turn_type: standalone
  ai_line: 4. Do you think people should save for the future?
  user_model_answer: Yes, people should save for the future. The future is uncertain. There should always be some saving for the rainy days.
