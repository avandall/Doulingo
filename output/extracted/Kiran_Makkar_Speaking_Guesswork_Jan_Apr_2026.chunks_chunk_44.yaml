  ai_line: 1. Do you still keep in touch with your friends from childhood? Why or why not?
  user_model_answer: Yes, I’m still in touch with a few close friends from childhood. We grew up together, so the bond is strong. Even if we don’t meet often, we talk on WhatsApp or social media. Childhood friends are like family to me.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. How important is childhood friendship to children?
  user_model_answer: I think it’s very important because it helps children learn to share, trust, and understand emotions. These early friendships build their social skills and confidence. Also, such friendships often stay in our memories forever.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. What do you think of communicating via social media?
  user_model_answer: It’s useful because it keeps people connected, especially if they live far apart. But sometimes, it feels less personal than talking face-to-face. Still, it’s helpful, especially for quick messages or updates.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Do you think online communication through social media will replace face-to-face communication?
  user_model_answer: No, I don’t think so. Online chatting is convenient, but face-to-face talks build stronger connections. Emotions and expressions can’t be fully understood through a screen. We need both in life.
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. What’s the difference between having younger friends and older friends?
  user_model_answer: Younger friends bring energy and fun, while older ones give advice and maturity. I enjoy both kinds. They offer different perspectives, which helps me grow as a person.
