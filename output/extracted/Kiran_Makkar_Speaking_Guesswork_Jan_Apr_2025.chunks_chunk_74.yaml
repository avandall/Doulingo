- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Do you prefer sending or receiving messages?
  user_model_answer: I don’t have any specific preference, I send messages whenever it is necessary. Similary, I don’t mind if others send me messages.
- band_level: 7.0
  turn_type: standalone
  ai_line: 3. Have you ever received a confusing text message?
