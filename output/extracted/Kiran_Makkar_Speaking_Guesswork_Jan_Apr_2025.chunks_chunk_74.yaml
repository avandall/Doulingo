  ai_line: 1. Are you very interested in fashion and clothes?
  user_model_answer: Yes, I am very interested in fashion and clothes. I like to know what is the latest trend. However, I may not necessarily follow it.
- band_level: 7.0
  turn_type: standalone
  ai_line: 2. Do you have lot of nice clothes?
  user_model_answer: Yes, I think I have a lot of nice clothes. I do most of the shopping for myself and I like all the clothes I have.
- band_level: 7.0
  turn_type: standalone
  ai_line: 3. What kind(s) of clothes do you usually wear?
  user_model_answer: I usually like to wear comfortable clothes, in my favourite colors.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Would you say clothes are expensive in your country?
  user_model_answer: India has people from all strata of society and everyone has a different earning and buying capacity. So, there are clothes available that are not too costly and then there are the very expensive designer clothes that are also available.
- band_level: 7.0
  turn_type: standalone
  ai_line: 5. Do you like to wear fashionable clothes?
  user_model_answer: Yes, sometimes. However, I do understand that not all types of clothes suit everyone. So, I wear clothes that suit me.
- band_level: 7.0
  turn_type: standalone
  ai_line: 6. Is there anything that you used to wear in past that you don’t wear now?
  user_model_answer: As a child, I used to wear a lot of dresses, which I don’t wear now. I do wear western formal clothes, but not dresses.
- band_level: 7.0
  turn_type: standalone
  ai_line: 7. How often do you go for shopping for clothes?
  user_model_answer: I go shopping for clothes when I need something. I am not a shopaholic and I don’t buy clothes on impulse.
- band_level: 7.5
  turn_type: standalone
  ai_line: 8. Do you like shopping for clothes?
  user_model_answer: No, I don’t really like shopping for clothes these days. There are too many choices and it becomes very difficult to choose the right clothes.
- band_level: 7.0
  turn_type: standalone
  ai_line: 9. How often do you buy clothes online?
  user_model_answer: I buy clothes online very rarely, only when for some reason I am not able to go to an actual store.
- band_level: 7.0
  turn_type: standalone
  ai_line: 10. Do you plan to buy any designer (or, name brand) clothes?
  user_model_answer: No, I don’t plan to, but if I get a good deal on a good designer brand, then I might consider buying designer clothes.
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Do you like texting?
