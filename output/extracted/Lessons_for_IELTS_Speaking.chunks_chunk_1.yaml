sample_dialogues:
- band_level: 7.5
  turn_type: standalone
  ai_line: 12. With your partner, ask and answer the following questions about your school. There are some ideas given to help you with the answers. | Questions | Answers | |-----------|---------| | a. What subjects are compulsory in your school? | In my school, we have to..., but we can choose... |
  user_model_answer: '| b. What are your favourite subjects? | I really like... because it''s... and... | | c. What subjects do you dislike? | I dislike... because it''s... | | d. Tell me about discipline in your school. | Our school is... You have to... | | e. What exams do you take? | At the end of... | | f. How much homework do you have? | Lots! I have to... |'
- band_level: 7.0
  turn_type: standalone
  ai_line: '6. Listen and you will notice the important words in each sentence below are stressed: they are said louder and stronger than the other words. Underline the stressed words in each sentence. The first one has been done for you. a. Tell me about your favourite food. b. Do you like to cook?'
  user_model_answer: c. Do you prefer to eat out or eat at home? d. What do you usually eat for breakfast? e. Do you like fast food?
