  ai_line: 1. How do you usually keep in touch with members of your family?
  user_model_answer: I mostly keep in touch with my family by phone, and I've started using the Internet to make video calls. I also try to visit members of my family in person as often as I be, keep, etc. in touch
- band_level: 7.5
  turn_type: standalone
  ai_line: '2. Do you prefer to speak to people by phone or by writing emails? subject or area: giữ liên lạc với'
  user_model_answer: It depends on the situation. I use email and text messages to communicate with... friends, but my parents prefer it if I phone them. in person = if you do something in person, you go
- band_level: 7.5
