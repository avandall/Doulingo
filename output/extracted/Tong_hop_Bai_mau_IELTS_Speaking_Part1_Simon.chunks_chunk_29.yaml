  ai_line: 3. Do you ever write letters by hand? (Why / Why not?) somewhere and do it yourself,
  user_model_answer: No, I don't write letters by hand because it's so much easier to send an email that instead of doing it by letter, will arrive immediately. asking somebody else to do it,
