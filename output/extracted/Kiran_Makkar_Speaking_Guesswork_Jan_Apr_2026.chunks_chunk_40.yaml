- band_level: 7.5
  turn_type: standalone
  ai_line: 1. What are the advantages and disadvantages of being a famous child?
  user_model_answer: I think the biggest advantage is that the child gets a lot of attention and opportunities at a young age. But the downside is, they lose their normal childhood. They are always under pressure and sometimes miss out on school or playtime with friends.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. What can today's children do to become famous?
  user_model_answer: Nowadays, kids can become famous through social media, talent shows, or even YouTube. If they have a special skill like dancing, singing, or acting, they can post videos and get noticed. But not everyone wants that kind of life.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. What can children do with their fame?
  user_model_answer: If they use their fame in a good way, they can inspire others and even support social causes. Some young stars help in raising money for charities or speak up about important issues. But it’s also easy to get lost in attention and forget to stay grounded.
- band_level: 7.5
  turn_type: standalone
