  ai_line: 7. What different types of newspaper are there in India?
  user_model_answer: There are broadsheets and tabloids. There are newspapers in English, Hindi, Punjabi and other regional languages.
- band_level: 7.5
  turn_type: standalone
  ai_line: 8. Do you care about the news?
  user_model_answer: Yes, I care about the news. I think news is very important. We should be aware of what is happening around us and in the whole world.
- band_level: 7.5
  turn_type: standalone
  ai_line: 10. What kinds of news do Indian people read in newspapers?
  user_model_answer: Indian people like to read fall types of news. They read local news, National news, International news, Sports news and many other news.
- band_level: 7.0
  turn_type: standalone
  ai_line: 11. Do you prefer to read about domestic (or local) news or international news? (Why?)
  user_model_answer: I like to read domestic news as well as international news.
- band_level: 7.5
