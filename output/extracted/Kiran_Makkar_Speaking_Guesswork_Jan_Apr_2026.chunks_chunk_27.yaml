  ai_line: 5. Why do some people prefer to travel in their own country?
  user_model_answer: In my opinion, people prefer local travel because it feels easier and more affordable. They know the language, food, and culture, so there is less stress. For example, my parents mostly travel within India as they feel comfortable and safe here.
- band_level: 7.5
