  ai_line: 1. Are your friends mostly your age or different ages?
  user_model_answer: Most of my friends are about the same age as me because we met at school or university. I've got one or two friends who are older or younger that I met through work.
- band_level: 7.0
  turn_type: standalone
  ai_line: 2. Do you usually see your friends during the week or at weekends?
  user_model_answer: I tend to meet up with my friends at weekends because everyone's too busy during meet up
