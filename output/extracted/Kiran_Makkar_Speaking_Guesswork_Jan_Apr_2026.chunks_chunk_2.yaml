- band_level: 7.5
  turn_type: standalone
  ai_line: 1. What is the right age for a child to learn drawing?
  user_model_answer: I think there is no fixed age for learning drawing, but many children start around the age of two or three. At that age they begin to hold crayons and make shapes. In my family, my nephew started drawing circles at two years old, so I feel early exposure really helps.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Why do most children draw more often than adults do?
  user_model_answer: According to me, children draw more because they have more free time and fewer responsibilities. Drawing is also a fun way for them to express their imagination. Adults get busy with work and daily tasks, so they often stop doing such activities.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Why do some people visit galleries or museums instead of viewing artworks online?
  user_model_answer: Well, many people prefer visiting museums because the experience feels more real and personal. Seeing the actual size, colour and texture of an artwork gives a different feeling that a screen cannot provide. Some also enjoy the peaceful environment there.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Do you think galleries and museums should be free of charge?
  user_model_answer: In my opinion, it would be great if they are free because more people, especially students, would visit and learn. However, I also understand that museums need money for maintenance, so maybe a small fee or free entry on certain days can balance both sides.
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. How do artworks inspire people?
  user_model_answer: Artworks inspire people by showing different ideas, emotions and stories. Sometimes a painting or sculpture makes us think about our own life or gives motivation. For example, I once saw a painting of a mountain climber and it made me feel more confident about facing challenges.
- band_level: 7.5
  turn_type: standalone
  ai_line: 6. What are the differences between reading a book and visiting a museum?
