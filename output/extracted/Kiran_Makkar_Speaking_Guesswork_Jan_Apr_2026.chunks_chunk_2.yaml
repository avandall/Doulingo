- band_level: 7.5
  turn_type: standalone
  ai_line: 1. What kind of advice do parents give to their children?
  user_model_answer: Parents advice children about various issues like their friend circle, subjects to choose for specialization and sometimes on healthy eating too.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. How do experts give advice to others? (example a doctor gives advice to patients)
  user_model_answer: Experts are specialists in their field and it is best to seek advice from an expert who is proficient. A good teacher will guide the students in the right direction, similarly, a doctor's advice is valuable regarding health issues.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. What advice do parents give to teenagers about making friends?
  user_model_answer: Teenagers need maximum advice as they are vulnerable and can be led astray by bad company. It is very difficult to advise a teenager so parents normally warn their wards to not mingle with friends who are known to be naughty.
