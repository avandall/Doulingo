  ai_line: 2. When did you start to learn about science?
  user_model_answer: I started learning about science right from elementary school.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Which science subject is interesting to you?
  user_model_answer: Chemistry is the most interesting subject to me. I like doing hands-on experiments and applying classroom learning in the lab. It’s really interesting to see what happens when different substances mix with each other.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. What kinds of interesting things have you done with science?
  user_model_answer: I have done many interesting things with science like the volcano experiment where we added vinegar and baking soda in an empty bottle. The reaction created carbon dioxide gas which erupted out of the bottle. It was so cool to watch.
- band_level: 7.0
