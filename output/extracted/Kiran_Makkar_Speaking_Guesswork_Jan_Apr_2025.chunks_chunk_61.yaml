  ai_line: 1. Where did you go for your last holiday?
  user_model_answer: I went to Goa for my last holiday. It was in Feb 2020 and was a very memorable holiday. My cousin had invited us to his destination wedding in Goa. We stayed back for four days after the wedding. I enjoyed the beaches, water sport activities, cruises, and casinos. We also visited old Goa and the beautiful churches that display the Portuguese architecture.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Do you like holidays? Why?
  user_model_answer: I like holidays as they provide me the opportunity to relax and get a break from my demanding job. I also get to spend more time with my family and friends. I feel refreshed and I am much more productive when I get back from the holidays.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Which public holiday do you like the best?
  user_model_answer: My favorite public holiday is Diwali – the festival of lights. I love lighting our house, eating delicious sweets, meeting my friends and relatives, etc. The atmosphere is so lively, and people are happy all around. The view is beautiful as all houses and shops are decked up with beautiful lights.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. What do you do on holidays?
