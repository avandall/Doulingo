- band_level: 7.5
  turn_type: standalone
  ai_line: 1. What are the differences between clothes worn by old people and those by young people?
  user_model_answer: Older people prefer simple and traditional clothes. Youngsters like trendy and colourful outfits. For example, my grandmother wears suits, while my sister wears jeans and tops. Comfort is the key for both.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. What kind of clothes do people wear in the workplace?
  user_model_answer: It depends on the job. In offices, people wear formal clothes like shirts and trousers. But in creative fields, people wear casual or stylish outfits. Uniforms are also common in some places.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Do you think it is a good idea to buy clothes online?
  user_model_answer: Yes and no. It’s easy and saves time, but sometimes size or quality is not right. I once ordered a jacket online, and it was too tight. Trying in-store is safer.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Do you think young people wear unusual clothes more than other age groups?
  user_model_answer: Yes, young people love to experiment with fashion. They follow trends and social media influencers. Sometimes they wear clothes that look strange to elders. But that’s how they express themselves.
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. Do you think that the style of the clothing is more important than its comfort?
  user_model_answer: I think comfort is more important. If something looks stylish but is uncomfortable, it’s hard to wear all day. For example, tight shoes can cause pain. But some people prefer looking good over feeling good.
- band_level: 7.5
  turn_type: standalone
