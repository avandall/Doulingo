- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Why is it difficult for some people to relax?
  user_model_answer: Because they are always thinking about work or problems. Their mind doesn’t stop. I think meditation can help. But not everyone has time or patience for it.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. What are the benefits of doing exercise?
  user_model_answer: Exercise keeps the body fit and mind fresh. It also helps in reducing stress. I feel happy after a walk. Even 30 minutes a day can make a big difference.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Do people in your country exercise after work?
  user_model_answer: Some do, but not everyone. Many are tired after office and skip exercise. I try to go for a walk in the evening. Gyms are also popular now.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. What is the place where people spend most of their time at home?
  user_model_answer: Mostly in the living room or bedroom. These are places to relax and watch TV. Some people also spend time in the kitchen if they love cooking.
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. Do you think there should be classes for training young people and children how to relax?
  user_model_answer: Yes, today’s kids have a lot of pressure. Teaching them yoga or meditation can help. Even small breathing exercises can improve focus and reduce stress.
- band_level: 7.5
