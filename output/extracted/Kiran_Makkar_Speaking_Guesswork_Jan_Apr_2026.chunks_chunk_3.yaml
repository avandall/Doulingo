- band_level: 7.5
  turn_type: standalone
  ai_line: 1. What are the differences between the technology of the past and that of today?
  user_model_answer: Acconrding to me, the main difference is speed and convenience. In the past, technology was slow and limited, like landline phones or bulky computers. Today everything is faster, smaller, and more connected. For example, now we can do banking or shopping on our phones within seconds.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. What technology do young people like to use?
  user_model_answer: Well, young people mostly prefer smartphones and social media apps. They enjoy using them for chatting, gaming, and watching videos. I often see teenagers spending hours on TikTok and Instagram because it keeps them entertained and connected with friends.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. What are the differences between online and face-to-face communication?
  user_model_answer: Online communication is quick and convenient, but it lacks body language and real emotion. On the other hand, face-to-face conversations feel more personal and honest. For example, it’s easier to understand a person’s feelings when you talk to them in person.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Do you think technology has changed the way people communicate?
  user_model_answer: Yes, I believe it has changed communication a lot. People now send texts or voice notes instead of meeting in person. This saves time, but sometimes it also reduces deep conversations. Some older people still prefer talking face-to-face because they feel it is more meaningful.
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. What negative effects does technology have on people’s relationships?
  user_model_answer: Um, one negative effect is reduced time together. Many people spend more time on screens than talking to their family. For example, at home during dinner, everyone is often busy with their phone. This can weaken emotional bonds over time.
