sample_dialogues:
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Do you like snacks?
  user_model_answer: Yes, definitely. I really enjoy snacks, especially things like nuts and seeds. They’re not only tasty but also give me a quick energy boost, which helps me concentrate and work more efficiently.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. How often do you eat snacks?
  user_model_answer: I snack pretty much every day. Usually around 10 a.m. and again at about 3:30 in the afternoon — basically during my short breaks. It’s when my energy dips, so a small, healthy snack helps me stay focused.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. How do you choose what snacks to eat?
  user_model_answer: I actually pay a lot of attention to the labels. I always check the ingredients to make sure there’s no trans fat or added sugar. I prefer snacks made with natural, wholesome ingredients—something that’s healthy but still satisfying.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Did you ever eat snacks when you were a child?
  user_model_answer: Yes, of course. I think most children love snacks. My mom used to give me little treats as a reward, especially when I behaved well or finished my homework. It was a small thing, but I really looked forward to it.
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. Do you think it is healthy for you to eat snacks?
  user_model_answer: It depends on the type of snack. If you go for healthy options like nuts, seeds, or fruit that isn’t too sugary, then yes – they can be very good for you. But snacks packed with added sugar, unhealthy fats, or preservatives can definitely do more harm than good.
