- band_level: 7.0
  turn_type: standalone
  ai_line: '13. Ask and answer with your partner: - What TV programmes did you enjoy watching when you were a child? Which ones were you allowed/not allowed to watch when you were 10 years old?'
  user_model_answer: '- What magazines do you read now? Which ones were you allowed/not allowed to read when you were 10 years old?'
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. Look at the following dialogue from Part 1 of the Speaking test. Match the examiner's questions with the candidate's answers. | EXAMINER | CANDIDATE | |----------|-----------| | A. Hello, my name is Mary - what's your full name, please? | |
