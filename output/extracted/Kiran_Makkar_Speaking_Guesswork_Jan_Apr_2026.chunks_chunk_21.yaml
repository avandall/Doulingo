- band_level: 7.5
  turn_type: standalone
  ai_line: 1. What technology do people currently use?
  user_model_answer: Well, most people nowadays use smartphones, laptops, and smart TVs almost every day. Actually, these gadgets help with work, entertainment, and even online shopping. For example, I use my phone not just for calls but also for classes and paying bills.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Why do big companies introduce new products frequently?
  user_model_answer: I believe companies release new products to stay ahead in the competition. To be honest, if they stop upgrading, customers might lose interest and shift to other brands. At the same time, it’s also a smart way to increase profit.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Why are people so keen on buying iPhones even though they haven't changed much from one iPhone to the next?
  user_model_answer: According to me, people go for iPhones mainly because of the brand image and social status. Even a small upgrade like a better camera or a new design is enough to attract them. On the other hand, some feel it’s unnecessary since older models still work perfectly.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Why do technology companies keep upgrading their products?
  user_model_answer: Well, one reason is that upgrades fix problems and make devices more user-friendly. Also, competition pushes them to keep adding something new. For instance, most phone brands every year improve the battery or camera just to stay relevant.
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. What changes has the development of technology brought about in our lives?
  user_model_answer: To be honest, technology has changed almost everything, from the way we talk to how we travel. Life has become faster and much more convenient. Like earlier, buying train tickets meant waiting in long lines, but now it’s just a matter of a few clicks.
