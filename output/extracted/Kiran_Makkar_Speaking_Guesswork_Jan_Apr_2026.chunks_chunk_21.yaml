- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Which is better, electric bicycles or ordinary bicycles?
  user_model_answer: Well, I think both have their own benefits. Electric bicycles save energy and are good for longer rides, while ordinary ones are healthier because they give more exercise. For example, I prefer a normal cycle when I just want some fitness.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Do you think electric bicycles will replace ordinary bicycles in the future?
  user_model_answer: According to me, no, they won’t fully replace them. Some people will always prefer simple bicycles because they are cheaper and easier to maintain. At the same time, in big cities, electric ones might become more common for daily travel.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Which is better, electric cars or petrol cars?
  user_model_answer: Honestly, electric cars are better for the environment since they don’t produce smoke. But petrol cars are still more practical because charging stations are not available everywhere. For long trips, many people still trust petrol cars.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. How did people manage to live without electricity in the ancient world?
  user_model_answer: I believe they lived a very simple life. People used candles or oil lamps for light and cooked food on firewood. My grandmother sometimes tells me that even in her childhood, they studied under lanterns as there was no electricity, so they were used to it.
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. Is it difficult for the government to replace all the petrol cars with electric cars?
  user_model_answer: Yes, it’s very difficult. The main reason is cost, as not everyone can afford an electric car. Also, the government needs to build a huge charging network first, which takes a lot of time and money.
