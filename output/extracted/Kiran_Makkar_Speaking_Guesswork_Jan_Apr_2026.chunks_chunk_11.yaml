sample_dialogues:
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Why are children attracted to new things (such as electronics)?
  user_model_answer: I think everyone is attracted to new things nowadays. Children are attracted more so because for them everything is new and they are curious about things work. Another reason is that children want to possess or own the latest technology to show off to their friends and classmates.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Why do some grown-ups hate to throw out old things (such as clothes)?
  user_model_answer: Adults have a personal connection or a story attached to old things. For example, a sweater made by their mother or gifted by an aunt. They feel like they are losing a part of themselves when they throw them out as it is a reminder of their childhood and hence, they are hesitant. In today’s era of mass-produced goods, there is no connection to products.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Is the way people buy things affected? How?
  user_model_answer: Yes, people today buy things online. Moreover, like I said before we don’t have an emotional connection with products as in the past. Earlier, we felt a loss when something broke down. Now, it’s just an object, and breaking down is an opportunity to buy a newer version.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. What do you think influences people to buy new things?
  user_model_answer: I think it’s just that as things get old, people get bored, and to renew their excitement, they buy a new thing. It also the influence of ads, which keep on reminding us that we are missing out if we don’t have the latest version of something.
