sample_dialogues:
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Which town or city do you live in now?
  user_model_answer: I live in Ho Chi Minh City, the biggest city in Vietnam. It’s a lively, fast-paced place with loads of energy. There’s always something happening, whether it’s people rushing around or street food vendors setting up shop.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Are there any things you don’t like about your area? (What are they?)
  user_model_answer: Yeah, traffic here is a nightmare. It can take forever to get anywhere, especially during rush hour. Plus, the pollution isn’t great either – there’s just too much smog from all the motorbikes and cars.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Do you think you will continue to live there for a long time? (Why? Why not?)
  user_model_answer: I don’t think so. City life is exciting, but I’d much rather live somewhere quieter, like the countryside. I’d love to have more space and fresh air—it feels like a better fit for me in the long run.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. What are some changes in the area recently?
  user_model_answer: There’ve been a few changes. For one, there are a lot more surveillance cameras around, which makes the place feel safer. Also, there’s been a boom in street food stalls, so there are even more options to grab a quick, tasty bite.
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. Do you live in a house or an apartment?
  user_model_answer: I live in an apartment. It’s in a pretty modern building, and though it’s not huge, it’s cozy and has everything I need, like a gym and a little garden area.
- band_level: 7.5
  turn_type: standalone
  ai_line: 6. What is your favourite room in your home? (Why?)
  user_model_answer: Definitely my bedroom. It’s my little haven where I can just chill out. I love lying on my comfy bed with a good book or scrolling on my phone. It’s the one place where I feel completely relaxed.
- band_level: 7.5
  turn_type: standalone
  ai_line: 7. What things make your home pleasant to live in? (Why?)
  user_model_answer: My indoor garden, for sure. I’ve got a few plants set up near the window, and they really brighten up the space. It makes the apartment feel fresh and a bit closer to nature, which is nice in the middle of a busy city.
- band_level: 7.5
  turn_type: standalone
  ai_line: 8. Are the people in your neighbourhood nice and friendly?
  user_model_answer: Not really. I mean, people are polite, but everyone seems super busy, so we don’t really know each other. It’s more of a “nod and smile in the elevator” kind of vibe.
- band_level: 7.5
  turn_type: standalone
  ai_line: 9. Is the place where you live quiet or noisy?
  user_model_answer: It’s pretty noisy, especially because there’s a school nearby. During the day, you can hear kids shouting and playing, and there’s always some announcement blaring over the speakers. It calms down in the evening, though, which is a relief.
