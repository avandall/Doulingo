content_unit:
  template_type: band_ladder
  title: "Warm-up: Cooking and Sequencing"
  topic_tags: ["Cooking", "Food", "Sequencing"]
  target_band_min: 5.0
  target_band_max: 7.0
  register: neutral
  source_citation: "Lessons_for_IELTS_Speaking.md, WARM-UP"

band_tiers:
  - band_min: 5.0
    band_max: 6.0
    can_do_description: "Can list ingredients and basic steps, but may struggle with sequencing markers or complex sentence structures."
    grammar_required: 
      - Quantifiers (How many/much)
      - Present simple for instructions
    vocabulary_core: ["mix", "add", "cook", "ingredients", "bowl"]
    vocabulary_stretch: ["marinate", "simmer", "recipe"]
    sentence_length_target: "Short, simple sentences"
    common_errors_to_simulate: "Confusion between countable/uncountable nouns (e.g., 'how much eggs'), missing logical sequencers."
  - band_min: 7.0
    band_max: 8.0
    can_do_description: "Can describe a process fluently using a variety of sequencing words and precise culinary vocabulary."
    grammar_required: 
      - Cohesive devices (firstly, then, finally)
      - Complex noun phrases
    vocabulary_core: ["firstly", "then", "finally", "ingredients"]
    vocabulary_stretch: ["culinary", "process", "simultaneously"]
    sentence_length_target: "Varied sentence lengths with natural flow"

sample_dialogues:
  - band_level: 6.0
    turn_type: standalone
    ai_line: "Can you tell me something about how to make your favourite dish?"
    user_model_answer: "One of my favourite recipes is for chocolate cake. You need some chocolate, flour, a few eggs, sugar, and butter. First, you mix the butter and sugar in a bowl, then add the other ingredients and mix them together. Finally, you put the cake into the oven."
