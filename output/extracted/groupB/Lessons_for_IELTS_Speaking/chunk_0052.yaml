content_unit:
  template_type: band_ladder
  title: "Grammar: Extending Answers with Conjunctions"
  topic_tags: ["Transport", "Grammar", "Part 1"]
  target_band_min: 5.0
  target_band_max: 7.0
  register: neutral
  source_citation: "Lessons_for_IELTS_Speaking, GRAMMAR"

band_tiers:
  - band_min: 5.0
    band_max: 6.0
    can_do_description: "Answers the question but tends to be short. Often uses simple sentences without logical connectors."
    grammar_required: 
      - Present simple
      - Basic conjunctions (and, but)
    vocabulary_core: ["transport", "work", "walk"]
    vocabulary_stretch: ["convenient", "exercise"]
    sentence_length_target: "short-medium"
    common_errors_to_simulate: "Lack of explanation/extension, repetitive sentence structures, missing connectors."
  - band_min: 7.0
    band_max: 8.0
    can_do_description: "Fluently extends answers by providing relevant details using a variety of conjunctions."
    grammar_required: ["Complex sentences using subordinating and coordinating conjunctions"]
    vocabulary_core: ["convenient", "daily routine"]
    vocabulary_stretch: ["commute", "physical exertion"]
    sentence_length_target: "medium-long"

sample_dialogues:
  - band_level: 6.0
    turn_type: standalone
    ai_line: "How do you usually travel to work?"
    user_model_answer: "I usually go to work by train because it's convenient, but sometimes I walk for the exercise."
