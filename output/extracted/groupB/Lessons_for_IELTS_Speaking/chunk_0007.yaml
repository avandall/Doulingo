sample_dialogues:
- band_level: 7.0
  turn_type: standalone
  ai_line: Describe a teacher you had at primary school who was wonderful.
  user_model_answer: I remember a teacher I had at primary school who was wonderful.
    From the first day, she was friendly and kind towards us. She was also strict—on
    the first day, she took out this old-fashioned strap and banged it on the desk.
    We all got such a fright, but she was just trying to show us she was in control.
    What I used to enjoy most about her classes was her personality and the fact that
    she cared for all her students, even the naughty ones. She was like a mother to
    me, gentle but strict at the same time.
