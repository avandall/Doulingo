content_unit:
  template_type: band_ladder
  title: "Fluency and Coherence — Using Conjunctions for Long Turns"
  topic_tags: ["Transport", "Fluency and Coherence", "Speaking Part 2"]
  target_band_min: 5.0
  target_band_max: 7.0
  register: neutral
  source_citation: "Lessons_for_IELTS_Speaking, FLUENCY AND COHERENCE"

band_tiers:
  - band_min: 5.0
    band_max: 6.0
    can_do_description: "Struggles to extend answers, leading to short, choppy sentences. Tendency to pause frequently."
    grammar_required: 
      - Basic conjunctions (and, but)
    vocabulary_core: ["Transport", "Bus", "Train", "Car"]
    vocabulary_stretch: []
    sentence_length_target: "Short, simple sentences"
    common_errors_to_simulate: "Lack of linking devices, repetitive sentence structure, frequent hesitation."
  - band_min: 7.0
    band_max: 8.0
    can_do_description: "Uses a variety of conjunctions to extend ideas naturally and maintains flow without excessive hesitation."
    grammar_required: 
      - Coordinating and subordinating conjunctions (because, although, so that)
    vocabulary_core: ["Public transport", "Congestion", "Commute"]
    vocabulary_stretch: ["Infrastructure", "Reliable", "Efficient", "Inconvenient"]
    sentence_length_target: "Complex, coherent sentences with smooth transitions"

sample_dialogues:
  - band_level: 5.5
    turn_type: standalone
    ai_line: "Describe the transport system in your home town. What types of transport are available?"
    user_model_answer: "In my town, there are buses and taxis. Also, many people use motorbikes. It is very busy."
  - band_level: 7.5
    turn_type: standalone
    ai_line: "Describe the transport system in your home town. What types of transport are available and what are the advantages?"
    user_model_answer: "My hometown has a fairly diverse transport system, including a network of public buses and a metro line. The main advantage is that it's quite affordable, but the biggest problem is that the buses are often overcrowded because there are so many commuters during rush hour."
