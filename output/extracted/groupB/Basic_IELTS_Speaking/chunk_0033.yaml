  turn_type: standalone
  ai_line: If you were the president of your middle school, what changes would you
    like to make?
  user_model_answer: I'd change the classes to start later in the morning, and then
    I'd eliminate classes on weekends. I'd make sure there were plenty of clubs for
    students to join.
- band_level: 7.0
  turn_type: standalone
  ai_line: What did you think of your middle school teachers?
  user_model_answer: For the most part, they were really good—conscientious and knowledgeable.
    However, there was one teacher I really didn't get along with; she made my life
    quite miserable, which actually put me off studying History in the long run.
