band_tiers:
- band_min: 7.0
  band_max: 8.5
  can_do_description: Candidate demonstrates the ability to use idiomatic expressions,
    complex grammatical structures, and coherent argumentative flow to answer abstract
    questions.
  grammar_required:
  - Complex sentences
  - Relative clauses
  - Conditional structures (hypothetical)
  - Passive voice for academic tone
  vocabulary_core:
  - essential
  - intricately connected
  - immerse
  - inevitable
  - disadvantaged
  vocabulary_stretch:
  - lingua franca
  - backlash
  - holds much sway
  - technophile
  - on second thoughts
  sentence_length_target: Variable (varying between concise direct answers and extended
