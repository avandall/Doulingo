sample_dialogues:
  - band_level: 6.0
    turn_type: standalone
    ai_line: "Do you think scientific developments often cause more problems than they solve?"
    user_model_answer: "Scientific developments often cause lots of problems so sometimes they're not worth it."
  - band_level: 7.5
    turn_type: standalone
    ai_line: "Do you think scientific developments often cause more problems than they solve?"
    user_model_answer: "Actually, I would say that it's the other way round - the problems that science solves far outweigh the problems that it may bring."