  title: "Opinion Question: Should we allow TV advertising aimed at children?"
  topic_tags: ["Society", "Advertising", "Children", "Media"]
  target_band_min: 7.0
  target_band_max: 9.0
  register: formal
  source_citation: "Get_IELTS_Band_9_Speaking, 3. Should we allow TV advertising aimed at children?"

band_tiers:
  - band_min: 7.0
    band_max: 8.0
    can_do_description: "Can present a balanced argument with clear linking expressions (on the one hand/on the other hand), acknowledges both sides of an issue, and provides a nuanced personal conclusion."
    grammar_required: ["Complex sentences with conjunctions", "Modals of possibility/obligation"]
