sample_dialogues:
  - band_level: 8.5
    turn_type: standalone
    ai_line: "Should we allow TV advertising aimed at children?"
    user_model_answer: "Well, on the one hand, companies should be free to communicate with their customers, and that includes children. We also sometimes forget that children love TV commercials for all the excitement and humour. But on the other hand, children don't have the ability to judge or choose in the way that adults do, and adverts can exploit this. So generally speaking, I think we should allow these adverts, provided they're carefully regulated and controlled by the authorities."