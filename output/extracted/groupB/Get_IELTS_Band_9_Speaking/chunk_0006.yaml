sample_dialogues:
  - band_level: 9.0
    turn_type: standalone
    ai_line: "Please tell me about your home town. What do people do in the evenings?"
    user_model_answer: "I come from a coastal city where the pace of life is quite laid-back. In the evenings, locals typically gravitate toward the night market, which is the heart of our social life, as it offers a chance to catch up with neighbors over traditional snacks while enjoying the cool sea breeze."
  - band_level: 9.0
    turn_type: standalone
    ai_line: "Let's talk about your plans for the future. What kind of career do you want to follow?"
    user_model_answer: "I've set my sights on becoming a data analyst. I'm drawn to this field because it allows me to extract meaningful insights from complex information, and with the current digital transformation, I believe it's a career path that offers both stability and intellectual growth."