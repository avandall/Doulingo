  ai_line: How do stores persuade people to spend money?
  user_model_answer: They use a variety of methods. They often use promotions which
    make people buy more, for example '3 for the price of 2' and so on. These offers
    are usually backed up with advertising, whether on TV, the Internet or in the
    shop itself, and the advertising emphasises both the quality of the product and
    the money saving. There is another method too, which is to display the products
    in an attractive way that encourages shoppers to pick them up and look at them.
    When they're used together, I think these techniques can be very powerful indeed,
    and very effective at persuading the public to spend more.
