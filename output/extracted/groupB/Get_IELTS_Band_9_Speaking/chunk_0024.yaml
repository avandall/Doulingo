sample_dialogues:
  - band_level: 8.5
    turn_type: standalone
    ai_line: "Why do people like shopping during sale or promotion periods?"
    user_model_answer: "I think we're all familiar with the fun of finding a bargain and feeling we've saved money. This is probably the main reason. To be frank, I think another reason is the feeling of following the crowd. I mean, if we see thousands of other people heading to the shops, we have an urge to do the same thing even if we don't really need to buy a product. Yes, I think those are the two major reasons."
