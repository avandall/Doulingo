sample_dialogues:
- band_level: 7.0
  turn_type: standalone
  ai_line: Describe a long journey that you have made.
  user_model_answer: I’d like to talk about a trip I took to the northern mountains
    last summer. It was a long journey by train that lasted for over 15 hours. The
    scenery was absolutely breathtaking as we passed through deep valleys and lush
    forests. At the end, although I was physically drained from the long travel, I
    felt a deep sense of accomplishment and peace.
- band_level: 7.0
  turn_type: elaborate
  ai_line: Would you recommend this as a method of travelling? Why/why not?
  user_model_answer: Honestly, it depends on what you're looking for. If you're in
    a rush, a train is definitely not ideal because it's quite time-consuming. However,
    if you want to soak in the view and disconnect from the hectic pace of modern
    life, I would highly recommend it.
