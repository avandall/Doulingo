sample_dialogues:
- band_level: 9.0
  turn_type: standalone
  ai_line: 'Describe a holiday or trip you remember well. You should say: where you
    went, what you did, who you went with, and explain why you remember it so well.'
  user_model_answer: I'm going to talk about a trip that I remember very well, which
    was a holiday in Paris... In fact, at that time I was eleven years old, and I
    had just finished my primary school education... we quickly saw all the most important
    tourist sights such as the Eiffel Tower... which gave us an amazing panoramic
    view... Personally, I found those evenings just as interesting as the big tourist
    attractions... I went with a group of classmates, in particular my best friend...
    I remember it well for lots of reasons. Firstly, it was the end of an era in my
    life... So, all in all, it was a very eventful experience, and that's why it stays
    in my memory so clearly.
