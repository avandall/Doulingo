content_unit:
  template_type: band_ladder
  title: "IELTS Speaking Part 1 & 3 — Relevance and Skill Assessment"
  topic_tags: ["Health", "Exam Strategy", "Relevance", "Part 1", "Part 3"]
  target_band_min: 5.0
  target_band_max: 6.0
  register: neutral
  source_citation: "Get_Ready_for_IELTS_Speaking_Pre_Intermediate.md, Part 2: Skills development"

band_tiers:
  - band_min: 5.0
    band_max: 6.0
    can_do_description: "Thí sinh ở mức này thường trả lời câu hỏi nhưng đôi khi lan man hoặc đưa thông tin không liên quan (irrelevant). Cần tập trung vào tính logic của câu trả lời so với câu hỏi."
    grammar_required: 
      - Present simple for daily habits
      - "Should/shouldn't for suggestions"
    vocabulary_core: ["healthy", "free time", "hobbies", "exercise", "junk food"]
    vocabulary_stretch: ["relaxing", "professional", "encourage"]
    sentence_length_target: "Simple sentences and basic compound sentences (using and, but)."
    common_errors_to_simulate: "Trả lời không đúng trọng tâm câu hỏi (ví dụ: hỏi về sở thích nhưng liệt kê các hoạt động không liên quan đến bản thân), lạm dụng từ vựng đơn giản, lặp từ."

sample_dialogues:
  - band_level: 5.0
    turn_type: standalone
    ai_line: "Do you enjoy watching sports?"
    user_model_answer: "Yes, I enjoy sports. I play football every week and I think doing sports is good for you."
  - band_level: 6.0
    turn_type: standalone
    ai_line: "What do you like doing in your free time?"
    user_model_answer: "I like meeting my friends and relaxing. I really enjoy going to the cinema and going shopping."
