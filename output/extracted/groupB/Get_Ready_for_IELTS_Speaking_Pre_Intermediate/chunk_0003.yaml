    common_errors_to_simulate: "Quên chia động từ ngôi thứ 3 số ít (e.g., 'he like' thay vì 'he likes'), sai cấu trúc thì quá khứ của động từ bất quy tắc, lạm dụng cấu trúc câu đơn ngắn."

sample_dialogues:
  - band_level: 5.0
    turn_type: standalone
    ai_line: "Tell me about something you like doing."
    user_model_answer: "I like going to museums. It's very relaxing."
  - band_level: 5.5
    turn_type: standalone
    ai_line: "Do you watch DVDs?"
    user_model_answer: "Yes. I like watching DVDs at the weekend. But I don't like watching TV."