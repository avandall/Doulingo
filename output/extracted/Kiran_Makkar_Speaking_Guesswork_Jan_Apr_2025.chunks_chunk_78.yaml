  ai_line: 1. Do you often use a dictionary?If yes, how often and what for? If no, why not? If not very often,
  user_model_answer: say how often and why not very often? Yes, I use a dictionary very often, in fact daily. I am a student and I read a lot of text related to my studies. I often come across words I don’t know the meaning of and I use the dictionary to look up the meaning and synonyms.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Do you prefer to use an electronic dictionary or a dictionary made of paper?
  user_model_answer: I prefer to use the electronic dictionary now as it is very convenient and I can easily search for a meaning in a matter of a few seconds. I have a dictionary app downloaded on my phone.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. If someone gave you a dictionary as a gift, how would you feel?
  user_model_answer: I will feel happy, as it is a very useful gift for me or for anyone. We keep coming across new words everyday and everyone should have a dictionary.
