- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Do you think handwriting is still important?
  user_model_answer: Yes, I think so. Handwriting skills will always be important. Formal letters are needed in business. Writing skills are also needed in writing resumes. We all know that we belong to a global village. Today we have to compete with children all over the world. We have to apply for jobs in multinational companies. So we need good writing skills.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Do you think computers might one day replace handwriting?
  user_model_answer: Even though technology has reduced the need of writing skills, still, I feel that it is very important in today’s world and will remain in future as well.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Do you usually write by hand or write using a computer?
  user_model_answer: Well it depends on the situation, if I am sending an email to my friends or texting them then it is usually by computer or mobile phone. When I am studying and making notes then I usually write by hand.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. When do children begin to write in your country?
  user_model_answer: Nowadays the children have started writing a lot earlier. They normally join the schools at the age of 4 and they begin to write at the age of five
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. Do you think handwriting will die in the future?
  user_model_answer: No, definitely not. Handwriting will never die. Its need may decrease because of technology; still there will be many areas in which handwriting will be needed. I also feel that, that day is still very far when each and every person on earth will have access to technology.
- band_level: 7.0
  turn_type: standalone
  ai_line: 6. Do you write letters?
  user_model_answer: Yes, I do. I write e-mails to my friends and relatives.
- band_level: 7.0
  turn_type: standalone
  ai_line: 7. Do you think children should be taught to write like in the old days?
  user_model_answer: Yes, I think so. Writing is an art, which is going down because of modern technology.
