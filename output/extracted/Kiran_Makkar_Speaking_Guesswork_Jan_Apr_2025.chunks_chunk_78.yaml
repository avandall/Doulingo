  ai_line: 1. Do you like animals?
  user_model_answer: Yes, I like animals. I think they are all unique and beautiful creations of nature and form an important part of our ecosystem.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. What's your favourite animal? (Why?)
  user_model_answer: My favourite animal is dog because I think it is the most affectionate and the most loyal animal. Dogs make excellent companions for humans.
- band_level: 7.0
  turn_type: standalone
  ai_line: 3. What's your favourite wild animal? (Why?)
