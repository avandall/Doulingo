- band_level: 7.5
  turn_type: standalone
  ai_line: 16. Does rain ever affect transportation in your hometown? (How?)
  user_model_answer: Yes, sometimes the rain affects the transportation. It is mostly on some roads where the drainage system is not good or when it is blocked. At such times the water logging happens on the roads and the movement of traffic is affected.
- band_level: 7.5
  turn_type: standalone
  ai_line: 17. Do you think the seasons have changed in recent years, compared to the past? (Why?
  user_model_answer: How?) Yes, I think seasons have changed in the recent years because of global warming and the consequent climate change. The summers last longer and the winters are shorter. Also, the amount of rainfall during the monsoon season has reduced. Sometimes we hardly get any rains during the monsoon season.
