- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Do you often write (or, send) emails?
  user_model_answer: No, I don’t often write/send emails. I sometimes write official emails, like for sending in a job application through email and sometimes I write to my friends.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. What do you write about?
  user_model_answer: I sometimes I write official emails, like sending a job application. When I write to my friends or relatives, it is informal and I ask about their health and wellbeing and tell them about what’s going on in my life.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Do you think emails are useful?
  user_model_answer: Yes, I think that emails are very useful. Emails are convenient, timesaving, cost-effective and easy to send and receive. These days, emails are a good way to communicate for both formal and informal purposes.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. What kinds of emails do you send and receive?
  user_model_answer: I mostly receive promotional or spam emails advertising various shopping websites or products. I sometimes receive emails from my friends who are living in another country and at times I receive official communication, e.g. emails from the bank or the Income Tax department.
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. Do you think it is a good thing that some companies send out letters/spam emails for the purpose of advertising?
  user_model_answer: I think sending spam emails for the purpose of advertising is a good marketing strategy and promotes a product or a service. However, it sometimes becomes a nuisance when it is sent repeatedly.
- band_level: 7.5
  turn_type: standalone
  ai_line: 6. How often do you write letters?
  user_model_answer: I don’t write handwritten letters any more. If I need to, I send an email. All official and personal letters can be sent through emails now.
- band_level: 7.5
  turn_type: standalone
  ai_line: 7. What do you write about?
  user_model_answer: It depends whom I am writing to. When I’m writing to my friends and relatives, it’s usually about what’s happening in my life and to ask about their wellbeing. When writing an official letter, it is for a specific purpose and it is formal.
- band_level: 7.5
  turn_type: standalone
