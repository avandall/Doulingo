  ai_line: 28. Work with a partner. Take turns to suggest solutions to the problems. **For example:** How can we solve the problem of food distribution in some parts of the world?
  user_model_answer: → It's a matter of getting around the wars, politics, and corruption that prevent the distribution of staples to the general population.
- band_level: 7.5
  turn_type: standalone
  ai_line: 29. Look at the following questions. Note down all of the vocabulary items you will need to give your own solutions to the problems. Use the Vocabulary Bank and your dictionary to help you if necessary. a. How can we solve the problem of increasing petrol prices?
  user_model_answer: b. How can we solve the problem of declining energy reserves? c. How can we solve the problem of food distribution in some parts of the world? d. How can we solve the problem of increasing food prices? e. Do you think that we will be able to produce enough staples, such as rice, to feed the world's population in the future?
