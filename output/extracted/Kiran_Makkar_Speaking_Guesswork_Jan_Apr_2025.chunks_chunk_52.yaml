sample_dialogues:
- band_level: 7.0
  turn_type: standalone
  ai_line: 1. Do young people like to go to parks?
  user_model_answer: Not many youngsters like to go to the parks. One generally sees more children and older adults there.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. What do old people like to do in parks?
  user_model_answer: Old people generally stroll in the parks. One notices they are like a community gathering place for older people who like to sit and chat with their friends in the parks. Some of them even feed the birds.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. What benefits can parks bring to a city?
  user_model_answer: Parks bring life to a place. They are islands of beauty and peace. The greenery improves the quality of air in the city. They act as happy spots where people can come for sometime to relax, exercise or just sit and chat with their friends. Little children can enjoy playing games or use the rides to get rid of excess energy. Older children can cycle and exercise. On the whole parks and gardens bring peace and joy to the area they are in.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. What are the benefits of going to the park for young people and old people?
  user_model_answer: Young and old people can relax in the open and enjoy their friend’s company in the park. Older people generally walk in the park. Whereas youngsters can have picnics, exercise, play, run, cycle out there.
- band_level: 7.0
  turn_type: standalone
  ai_line: 5. Why do some people like planting flowers?
  user_model_answer: Some people love the happiness and calming effect that flowers bring to the environment, thus they plant flowers.
