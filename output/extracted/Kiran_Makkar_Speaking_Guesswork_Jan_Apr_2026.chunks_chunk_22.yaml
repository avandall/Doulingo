- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Why are some people unwilling to try new things?
  user_model_answer: Well, I think many people avoid new things because they feel safe in their routine. Change makes them uncomfortable, and they worry about failure. For example, one of my uncles never tries new food because he feels he might not like the taste.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Do you think fear stops people from trying new things?
  user_model_answer: Yes, definitely. Fear of the unknown or making mistakes often holds people back. At the same time, some people push through their fear and end up enjoying the new experience, like my cousin who was scared of swimming but now loves it.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Why are some people keen on doing dangerous activities?
  user_model_answer: According to me, they like the thrill and excitement. Activities like skydiving or rafting give them an adrenaline rush that normal life doesn’t. On the other hand, some people avoid such things because they don’t want to take any risk.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Do you think that children adapt to new things more easily than adults?
  user_model_answer: In my opinion, yes, children are quicker to adapt. They are curious, less afraid of failure, and more open to learning. Adults, however, often overthink and hesitate before trying. For instance, kids can learn a new app in minutes, while elders struggle.
