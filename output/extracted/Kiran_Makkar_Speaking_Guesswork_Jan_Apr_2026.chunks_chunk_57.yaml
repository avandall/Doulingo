sample_dialogues:
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. What can children learn from parents?
  user_model_answer: Children learn many things from their parents. Firstly, they learn basic household skills like cooking, cleaning and ironing clothes. They also learn money management from their parents. Finally and most importantly, they learn etiquettes and moral values from them.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Do you think some children are well-behaved because of the influence of their parents?
  user_model_answer: Both yes and no. I do believe parents play a very significant role in the upbringing of their children and imparting them moral values, which in turn impact their behaviour. However, I believe their behaviour is also influenced by other factors like their friend circle and the TV channels they watch.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Is it necessary for adults to learn new things?
  user_model_answer: Yes, I think it is so necessary to keep up with the times. Professionally, people may even lose their jobs if they don’t learn new things from time to time. Even personally I think if people don’t change themselves, they would be considered dull and boring.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. How can people learn new things?
  user_model_answer: The most accessible source for learning new things is certainly the internet. There is information on nearly everything available on the internet. However, in some cases, face to face learning is the only solution like in driving.
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. Does the internet make learning easier or more difficult?
  user_model_answer: I believe it makes it much easier. There is endless information available on the internet. If people have the willpower, they can learn anything from the internet in today’s time.
- band_level: 7.5
  turn_type: standalone
  ai_line: 6. Can people acquire more knowledge now than before?
