sample_dialogues:
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. What is your family home like?
  user_model_answer: a. The neighbourhood where I live is very peaceful. b. My parents' apartment is in a very dynamic part of the city. c. The family I'm staying with live in a very chic part of town. d. The house is very high tech. e. It is in a very good location.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Look at the numbering in the tables. Which tables are read from top to bottom? Which are read from left to right?
  user_model_answer: '> **Technique**: Familiarize yourself with charts and tables. Find them in newspapers and magazines and online, e.g. at www.ons.gov.uk. Learn to read and understand them.'
- band_level: 7.0
  turn_type: standalone
  ai_line: '5. The instructions for the table completion task in exercise 4 are: Write NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer. Which of the following answers must be wrong, and why?'
  user_model_answer: a. very high quality b. 210 c. £35 or £55 d. 3 or 4 years
- band_level: 7.5
  turn_type: standalone
  ai_line: 7. The table below is also taken from a table completion task. Read through the table carefully and answer these questions. a. In which order will you hear the information?
  user_model_answer: b. Which answers can you predict? | | old ValueCard | new SuperValue Card | |---------------------|---------------|---------------------| | Points | Standard number | Double points | | Free credit period | One month | 6. months | | Interest rate | 18.5% | 7. % | | Cardholder shopping evenings | 8. per month | Two per month | | Benefits | Free delivery within 9. miles | Free delivery within 50 miles | | Fee | Nil | 10. $ |
- band_level: 7.5
  turn_type: standalone
  ai_line: 8. What sort of place do you live in now?
  user_model_answer: a. I've got this beautiful ring that belonged to my grandmother. It has sentimental value for me. It's very special. b. Spiders. c. In New York, of course. d. I'm quite keen on comedies. I don't particularly like news and current affairs. They make me feel sad. e. Hotels mostly. f. I grew up in quite a small town. It was quiet and nice, and everyone seemed to know everyone else. g. I like playing jazz piano. I like it because it relaxes me. h. My dad. He has taught me such a lot about how to live my life well, and I'm grateful for that.
- band_level: 7.0
  turn_type: standalone
  ai_line: 2. Look again at the questions and answers in exercise 1. Answer the questions below. a. Are the questions complex and abstract or do they relate to personal information?
  user_model_answer: b. Which answers would be good in the Speaking test? Why?
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Make 10 typical questions that examiners ask in Part 1 of the Speaking module. Use the words given to make the full questions, add in extra words such as articles where necessary. The first one has been done for you. a. How often / you / listen / music?
  user_model_answer: → How often do you listen to music? b. Where / was / last / place / you / travelled / to? c. What form / transport / you / use most? d. When / you / start / learning English? e. Which form / communication / you / like / use / most - / email / phone? f. What sports / you / played? g. What kind / food / like / eat? h. What hobbies / you / have? i. What sort / television programmes / you / enjoy / watching? j. What type / books / you / enjoy / reading?
