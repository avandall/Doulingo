sample_dialogues:
- band_level: 7.5
  turn_type: standalone
  ai_line: 68. Advertisement What kind of advertising do you like?
  user_model_answer: I like advertisements that are funny, creative or tell a story. I also like ads that address social issues and challenge stereotypes. Do you like advertisements? I don’t mind ads if they are not too long and intrusive. Do you see a lot of advertising on trains or other transport? Yes, I see a lot of advertising on trains or other transport like buses and autos. I think it is good way to advertise as it can reach a lot of people at once as many people commute daily via public transport. Is there an advertisement that made an impression on you when you were a child? Yes, I remember an ad about Cadbury chocolate where a girl jumps in the middle of a cricket match after the player hits a boundary. She is dancing while eating and enjoying chocolate.
- band_level: 7.5
  turn_type: standalone
  ai_line: 69. Feeling bored Do you think childhood is boring or adulthood is boring?
  user_model_answer: I think adulthood is boring as there more responsibilities and people get busy with repetitive chores and tasks. They don’t have much time to play, be creative and enjoy life. What do you do when you feel bored? When I’m bored, I usually read or watch something on TV. When would you feel bored? I feel bored when I have nothing to do or I am stuck in a routine. Do you often feel bored? No, I have something to do and I am never bored.
- band_level: 7.5
  turn_type: standalone
  ai_line: 70. Friends Would you invite friends to your home?
  user_model_answer: 'Yes, I love having friends over at my place, we always have a good time. Do you prefer to spend time with one friend or with a group of friends? www.youtube.com/makkarielts www.instagram.com/makkarielts www.makkarielts.com/books 308 Jan-Apr 2026 Speaking Guesswork (FIRST VERSION) www.makkarielts.com/books Follow us on Instagram for latest updates: www.instagram.com/makkarielts I prefer spending time with a smaller group of friends as it feels more personal and I get time to interact with everyone. Do you have a friend you have known for a long time? Yes, I have one friend I have known for years. He is very important to me and we always make time to catch up. What do you usually do with your friends? We usually go out for meals, movies or just hang out at home. Where do you often meet each other? We usually meet at home, coffee shops, malls and movie theaters. Do you often go out with your friends? Yes, we often go out to movies, malls, cafe’s etc. How important are
    friends to you? Friends are very important to me, specially my childhood friends. We know each other so well and always make time to stay in touch.'
- band_level: 7.5
  turn_type: standalone
  ai_line: 71. Books and reading habits Which do you prefer, reading books or watching movies?
  user_model_answer: I prefer reading books as they let me use my imagination more than movies. Have you ever read a novel that has been adapted into a movie? Yes, there are many such novels. Recently I read a novel – The Book Thief which has been adapted into a movie. I loved the book but didn’t like the movie as much. Are your reading habits now different than before? Yes, my reading habits have changed with time. I used to read only fiction books but now I enjoy nonfiction books as well specially the autobiographies. Do you often read books? When? I often read book books before bed or on weekends when I don’t have to go to work. Do you read more or less now than when you were younger? I read more now than when I was younger. I used to spend more time outdoors playing sports when I was younger.
- band_level: 7.5
  turn_type: standalone
  ai_line: 72. Evening time What do you hate doing in the evening?
  user_model_answer: 'I am too tired and don’t like exercising in the evening. I usually work out early morning before I start my day. Do you like the morning or evening? I am not a morning person as I prefer to stay awake till late. My brain needs some time to get active, so I perform better in the evening. What do you usually do in the evening? I do many things. I go and play cricket with my friends, I take my dogs out for a walk and sometimes I help my mother in the kitchen. What did you do in the evening when you were little? Why? I think it was nearly the same except the dog part. We didn’t have a dog when I young. Sometimes I also played videos games. www.youtube.com/makkarielts www.instagram.com/makkarielts www.makkarielts.com/books 309 Jan-Apr 2026 Speaking Guesswork (FIRST VERSION) www.makkarielts.com/books Follow us on Instagram for latest updates: www.instagram.com/makkarielts Are there any differences between what you do in the evening now and what you did in the past? Like I
    said the main difference was that nowadays I take my dogs out for a walk but I didn’t in the past, as we didn’t have a dog then. Do you spend your evenings doing the same things on both weekends and weekdays? Why? On the weekends, I normally go out shopping with my friends. Sometimes, I watch movies at the cinemas. But, sometimes I also do the same things as the weekend.'
- band_level: 7.5
  turn_type: standalone
  ai_line: 73. Sitting down Do you find it easy to fall asleep when sitting on a sofa?
  user_model_answer: No, sofa sleeping is not for me. I need to lay down to sleep. When you were a kid, did you usually sit on the floor? I don’t think so. My parents allowed shoes inside the house, so the floor wasn’t that clean. So I didn’t sit on the floor. Do you feel sleepy when you are sitting down? No, I don’t feel sleepy when I am sitting down. Like I said, I normally need to lay down to sleep. I am only able to sleep sitting down when I haven’t slept for 2-3 days and I am extremely tired. Do you always sit down for a long time? Not always but yes I do sit down for long hours when I am watching the TV or studying. I am trying to change this habit, however. Where is your favorite place to sit? My favourite place to sit is the sofa in our living room. Its really comfortable.
- band_level: 7.5
  turn_type: standalone
  ai_line: 74. Computers In what conditions would it be difficult for you to use a computer?
  user_model_answer: 'I cant imagine a situation where it would be difficult, but I avoid using it at the cafe or restaurants as I am afraid of coffee spilling on it. It happened once and I had to get my touchpad replaced. What would your life be like without computers? Oh, I can’t even imagine. I am so dependent upon computers that I would like something is missing. There are so many things I do using computers and doing them in the traditional way would be so irritating. When was the first time you used a computer? I think it was when I was in the 3rd or 4th standard. My uncle had a computer shop and he set up a Personal computer for us. www.youtube.com/makkarielts www.instagram.com/makkarielts www.makkarielts.com/books 310 Jan-Apr 2026 Speaking Guesswork (FIRST VERSION) www.makkarielts.com/books Follow us on Instagram for latest updates: www.instagram.com/makkarielts In what conditions would you use a computer? I think I would use a computer in any situation. Its a part of my life and
    I can’t imagine not having a computer.'
- band_level: 7.5
  turn_type: standalone
  ai_line: 75. Old buildings Are there any old buildings you want to see in the future? Why?
  user_model_answer: Ya, I want to really see the Pyramids. Its my lifelong dream. I just had a fascination for Pyramids from a very young age, when I saw a documentary about them on Discovery Channel. Do you prefer to live in an old building or a modern house? I prefer a modern house. I think its really difficult to maintain an old house in today’s time. Moreover, it is hard to imagine living without the amenities of today’s era. Do you think we should preserve old buildings in cities? Yes, I think it is our duty. Preserving old buildings is a key to preserving our culture and heritage and moreover, these can add to the tourism appeal of the cities and generate valuable revenue for the city authorities. Have you ever seen old buildings in the city? Yes, my dad was a government servant and he was a allotment a bungalow which was actually the palace of the erstwhile king of my city.
- band_level: 7.5
  turn_type: standalone
  ai_line: 76. Collecting things Where do you usually keep things you need?
  user_model_answer: I normally keep things I need in my room. I also keep certain things which I need while going out like my shades, keys and jacket in a cupboard next to the main door of the house Would you keep old things for a long time? Why? I have kept certain things like handmade sweaters, my childhood toys, my parent jeans for many years. Otherwise, I normally throw away or donate the things as I don’t to clutter the house. Are there any things you have kept from your childhood? Yes I have certain toys from my childhood. Apart from that, I have two sweaters, which were made my mother. Do you collect things? No, I am not collecting things kind of person. I have a friend who collect coins and one who collects cards, but I personally don’t.
- band_level: 7.5
  turn_type: standalone
  ai_line: 77. Art/drawing Did you learn to draw when you were a kid?
