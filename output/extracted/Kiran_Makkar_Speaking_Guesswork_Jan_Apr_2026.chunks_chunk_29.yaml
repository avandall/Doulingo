- band_level: 7.5
  turn_type: standalone
  ai_line: 1. What kinds of sports events are broadcast on TV or other media in your country?
  user_model_answer: In my country, cricket is the most popular on TV. Apart from that, people also watch football, kabaddi, and hockey. During big events like the Olympics or World Cup, even non-sports fans watch. Sports channels show highlights all the time.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Do people in your country enjoy watching football games?
  user_model_answer: Yes, especially young people. Though cricket is more famous, football is growing fast. Big matches like FIFA finals attract a lot of viewers. I also enjoy watching Messi and Ronaldo play.
