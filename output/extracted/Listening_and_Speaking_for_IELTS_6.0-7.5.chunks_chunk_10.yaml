- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Read the two responses to the examiner's question. Which response is better? Why?
  user_model_answer: '**Examiner:** Do you think it''s important for friends to have similar personalities? **Candidate A:** No I don''t think it''s important for friends to have similar personalities. It would be very boring and predictable if friends all had the same personality. I think sometimes the most interesting relationships are the relationships between very different personalities. People sometimes assume that relationships between different personalities can lead to arguments but they don''t have to lead to arguments. For example, one person could be quite sociable whilst the person''s friend isn''t sociable, but together the two friends'' personalities can make a good balance. **Candidate B:** No I don''t think so. It would be very boring and predictable if friends all had the same character. I think sometimes the most interesting relationships are the ones between very different individuals. People sometimes assume that this type of friendship can lead to arguments but they
    don''t have to. For example, one person could be quite sociable whilst her friend isn''t, but together their personalities can make a good balance.'
