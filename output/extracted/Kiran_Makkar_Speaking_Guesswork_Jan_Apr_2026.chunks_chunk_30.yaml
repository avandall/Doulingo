sample_dialogues:
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Is punctuality important to people?
  user_model_answer: Yes, being on time shows respect and discipline. In schools and offices, it’s a must. I try to be punctual always, but sometimes traffic causes delays. Some people don’t take it seriously, which creates problems.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. What do you think is a good way to record things? Why?
  user_model_answer: I think using a phone app or writing in a notebook helps. It reminds us about tasks. I use my phone’s calendar to track appointments. This helps me stay organised.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Which is more important, a work-related appointment or an appointment with a friend? Why?
  user_model_answer: Work meetings are usually more serious and time-bound. But meeting a friend is important too for mental health. I think it depends on the situation. Both are important in life.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. If someone doesn't really like whom they are going to meet, they may deliberately miss their appointment. Is that true? Why?
  user_model_answer: Yes, it happens. If people feel uncomfortable, they try to avoid such meetings. I have done it once when I didn’t want to meet a distant cousin. It's not a good habit, though.
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. Do you think people should remember family history?
  user_model_answer: Yes, family history connects us to our roots. It also tells us about culture and values. My grandfather used to share stories, and I found them interesting. It’s good to pass them to the next generation.
