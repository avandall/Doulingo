- band_level: 7.5
  turn_type: standalone
  ai_line: 1. What programs do people like to watch in your country?
  user_model_answer: India is a diverse country, and it is very hard to generalize what people like to watch. People like to watch news, soaps, dramas, comedy shows, reality shows, and sports. It really depends on the person. I personally like to watch news, sports shows, and reality shows.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Do people in your country like to watch foreign TV programs?
  user_model_answer: I think the younger generation in my country enjoys watching foreign TV shows, especially because online streaming platforms like Netflix and Amazon Prime have made them easily available. These shows offer different cultures, stories, and styles that many young people find interesting and entertaining.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. What's the benefit of letting kids watch animal videos rather than visiting a zoo?
  user_model_answer: The main benefit of letting kids watch animal videos instead of visiting a zoo is that videos often include audio explanations about the animals, their habitats, behaviors, and diets. In a zoo, the children can see the animals, but they may not learn much about them unless someone explains to them. Videos are very educational and informative.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Do teachers play videos in class in your country?
  user_model_answer: Yes, many teachers play videos in class, especially in private and modern government schools. Videos are used to explain difficult topics in a simple way. They also help students stay engaged and focused. Videos also makes learning more interesting and fun.
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. Do you think watching talk shows is a waste of time?
  user_model_answer: Yes, talk shows can be a waste of time if they are about gossip and drama. But others can be inspiring and educational, especially those that talk about success stories, current issues, and real- life problems. It really depends on the type of show.
- band_level: 7.5
  turn_type: standalone
