sample_dialogues:
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Some people think it's a waste to buy too many clothes for children. What do you think?
  user_model_answer: I agree that it can be a waste to buy too many clothes for children. Children grow very quickly, so they often outgrow their clothes in just a few months. It's better to buy a few good-quality clothes and add more only when needed.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. How do people usually handle the clothes they don’t want?
  user_model_answer: People usually donate their unwanted clothes to charity or give them to their siblings or cousins. Some also choose to sell their clothes online through various apps or websites. This helps reduce waste and gives clothes a second life.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Why do people buy second-hand clothes?
  user_model_answer: People usually buy second-hand clothes because they are cheaper and more budget-friendly. Some people buy them because they are vintage and cannot be found in stores. Some people also buy them because they're eco-friendly and help reduce waste.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. What problems will occur if people don’t recycle?
  user_model_answer: If people don't recycle, a lot of useful materials like paper, metal, and plastic will go to waste. This waste will pile up in landfills and pollute the environment. Over time, this can increase climate change and make our planet dirtier and less healthy for future generations.
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. Should the government encourage people to recycle items?
  user_model_answer: Yes, I think the government should definitely encourage people to recycle. Recycling is very important today, especially with serious issues like global warming and climate change. It helps reduce waste, saves energy, and lowers pollution. By promoting recycling, the government can help people reduce their carbon footprint and protect the environment for future generations.
- band_level: 7.5
  turn_type: standalone
  ai_line: 6. How do people in your country recycle various items they don’t want?
