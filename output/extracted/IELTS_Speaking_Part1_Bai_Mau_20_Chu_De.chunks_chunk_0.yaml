sample_dialogues:
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Hometown Where is your hometown?
  user_model_answer: 'Keywords: quiet, peaceful, friendly people My hometown is a small city in Vietnam. It’s a quiet and peaceful place with a lot of trees and beautiful landscapes. People here are friendly and always ready to help each other. What do you like about your hometown? Keywords: fresh air, not crowded/noisy, delicious food I like the fresh air and the relaxing atmosphere. Unlike big cities, my hometown is not too crowded or noisy. Also, the food here is delicious and quite affordable. Is your hometown a good place to live? Keywords: fresh air, not crowded/noisy, fewer jobs Yes, I think it’s a great place to live. It’s safe, has a lower cost of living compared to major cities, and has a strong sense of community. However, job opportunities can be limited.'
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Study Do you work or study?
  user_model_answer: 'Keywords: English, prepare for IELTS I am a student. I am currently studying English because I want to improve my language skills and prepare for the IELTS exam. Why did you choose this major? Keywords: English, useful for future: people + jobs I chose to study English because it is an international language and will be useful for my future. It can help me communicate with people from different countries and open up more job opportunities. Do you like your studies? Keywords: yes, challenges + interesting Yes, I really enjoy studying English. It is challenging but also very interesting. However, sometimes it can be stressful when there are too many lessons to learn.'
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Daily Routine What do you usually do in a day?
  user_model_answer: 'Keywords: wake up -> breakfast -> work; evening: books + TV; weekends: family + friends On weekdays, I wake up early, have breakfast, and go to work. In the evening, I like to relax by reading books or watching TV. On weekends, I spend time with my family and friends. Do you have a fixed daily routine? Keywords: schedule -> organized; small changes Yes, I follow a regular schedule because it helps me stay organized. However, sometimes I make small changes, like going out for dinner or exercising in the morning instead of the evening. What part of the day do you enjoy the most? Keywords: evening -> relax (movies, books) I enjoy the evening the most because I can relax after a long day. It’s the time when I can watch a movie, read a book, or just spend time with my loved ones.'
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Hobbies What hobbies do you have?
  user_model_answer: 'Keywords: books + music + traveling I enjoy reading books, listening to music, and traveling. These activities help me relax and learn new things at the same time. How often do you do your hobbies? Keywords: books: every day; music: free time; travelling: a few times/year I read books almost every day, and I listen to music whenever I have free time. As for traveling, I try to do it a few times a year when I have a break from work. Do you think hobbies are important? Keywords: yes -> relax + ß stress Yes, hobbies are very important because they help people relax and reduce stress. They also allow people to develop new skills and meet like-minded individuals.'
