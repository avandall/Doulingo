- band_level: 7.5
  turn_type: standalone
  ai_line: 1. What do you think buildings will be like in the future?
  user_model_answer: In the future, buildings will likely be taller and smarter. They might have eco-friendly designs with solar panels and green spaces to help the environment. Many future buildings could be fully automated, using technology to control lights, temperature, and security. Some buildings might even be built underground or underwater to save space.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Why do some people choose to live in the city centre?
  user_model_answer: Some people prefer living in the city centre because it is close to work, shops, and entertainment. They can save time on traveling and enjoy a more active lifestyle. City centres often have better public transport, restaurants, and cultural events. It’s also convenient for people who like being in the middle of the action and want everything nearby.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Do different people have different preferences for houses or apartments? Yes, different
  user_model_answer: people have different preferences. Some people prefer houses because they want more space, privacy, and perhaps a garden. Others like apartments because they are easier to maintain, often located in convenient areas, and can be more affordable. It depends on a person's lifestyle, family size, and budget. https://g.co/kgs/xBR5EKQ
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. What would people normally consider when they rent or buy a house or an apartment?
  user_model_answer: People consider several things, such as location, size, price, and safety. They also think about how close the house or apartment is to work, schools, and shops. Other important factors include the quality of the neighbourhood, the condition of the property, and whether it fits their family's needs. https://amzn.to/4gcbYC9
