  ai_line: 1. Why do some people enjoy doing extreme sports? Some people enjoy extreme sports
  user_model_answer: because they like the thrill and excitement. These sports give them an adrenaline rush, which makes them feel alive. They also enjoy the challenge and the sense of achievement after completing something difficult. For some, it’s a way to push their limits and overcome their fears.
