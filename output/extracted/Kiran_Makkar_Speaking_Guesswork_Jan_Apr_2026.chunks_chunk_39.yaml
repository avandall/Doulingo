- band_level: 7.5
  turn_type: standalone
  ai_line: 2. How should bosses reward employees?
  user_model_answer: I think bosses should reward employees based on their performance. It can be through bonuses, promotions, or even a simple thank-you in front of the team. Sometimes, just being appreciated is more meaningful than money. But of course, fair financial rewards also matter.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. What kinds of gifts do young people like to receive as rewards?
  user_model_answer: Most young people enjoy tech gadgets like headphones or smartwatches, or even gift cards so they can choose for themselves. Some also like experiences, like movie tickets or a trip. It really depends on the person, but useful and trendy gifts are quite popular.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. How should children spend their allowance money?
  user_model_answer: In my opinion, children should learn to spend their allowance wisely. They can save a part of it, buy things they really need or want, and maybe even donate a little. Learning money habits early in life helps them in the future. But it’s also okay if they treat themselves once in a while.
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. Why do people like shopping more now than in the past?
  user_model_answer: Shopping has become easier and more fun these days, especially with online stores. There are so many options, and people can buy things with just a click. Also, many shop for fun or to feel better, not just for need. In the past, it was more about buying only what was necessary.
- band_level: 7.5
  turn_type: standalone
  ai_line: 6. Do you think shopping is good for a country's economy?
