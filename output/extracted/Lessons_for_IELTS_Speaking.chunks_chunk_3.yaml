- band_level: 7.5
  turn_type: standalone
  ai_line: '12. Use the table above to ask each other questions about the sports. **For example:** A: Tell me more about ping-pong. What equipment do you need for it?'
  user_model_answer: 'B: Oh, ping-pong is a fun game to play. I really like playing ping-pong because you don''t need a lot of equipment - just a table, bats, net, and a ball.'
- band_level: 7.5
  turn_type: standalone
  ai_line: 20. Ask and answer the questions below with your partner. In the answer, talk about your own experience and include adverbs of frequency. a. Do you go swimming at the pool very often?
  user_model_answer: b. Do you watch football on television much? c. How often do you go jogging? d. Do you exercise in a gym? e. Do you play tennis? f. Do you like watching sport on TV?
