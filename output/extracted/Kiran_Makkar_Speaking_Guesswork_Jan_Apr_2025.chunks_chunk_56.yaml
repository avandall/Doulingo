  ai_line: 3. What’s your favorite room in your home?
  user_model_answer: My favorite room is my own room, because I’ve decorated it according to my taste.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. What have you done to your room to make it look nice?
  user_model_answer: I keep my room spic and span. The walls are painted light pink because it is my favorite color. There are floral curtains.
- band_level: 7.0
  turn_type: standalone
  ai_line: 5. Who do you live with?
  user_model_answer: I live with my parents and brother.
- band_level: 7.5
  turn_type: standalone
  ai_line: 6. Which room does your family spend most of the time in?
  user_model_answer: My family spends most time in the living room. We have our meals there. We watch TV together and also entertain informal guests in that room.
- band_level: 7.0
  turn_type: standalone
  ai_line: 7. How long have you lived there?
  user_model_answer: I have lived there since my birth.
- band_level: 7.0
  turn_type: standalone
  ai_line: 8. Do you plan to live there a long time?
  user_model_answer: Presently I plan to go abroad for my studies. But, but I love my home and would like to come back there.
