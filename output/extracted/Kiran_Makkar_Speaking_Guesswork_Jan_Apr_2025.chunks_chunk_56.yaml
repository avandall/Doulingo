  ai_line: 12. Are there any tourist attractions in your hometown?
  user_model_answer: Yes, there are two Sikh temples, dedicated to the sixth guru of Sikhs. There is an ancient Shiva Temple and there is a famous hotel Haveli, which is very popular among the tourists.
