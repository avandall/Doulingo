sample_dialogues:
- band_level: 7.5
  turn_type: standalone
  ai_line: 18. Fashion Do you like fashion?
  user_model_answer: 'Keywords: express personality Yes, I like fashion because it allows me to express my personality. I enjoy dressing well and trying different styles. What kind of clothes do you usually wear? Keywords: casual + comfortable I prefer casual and comfortable clothes, like jeans and T-shirts. But for special occasions, I like to dress more formally. Do you follow fashion trends? Keywords: suits, not trends Not really. I wear what suits me instead of following trends. But sometimes, I check fashion trends for inspiration.'
- band_level: 7.5
  turn_type: standalone
  ai_line: 19. Weekend Activities What do you usually do on weekends?
  user_model_answer: 'Keywords: friends + coffee – home + movies/books I usually relax, meet friends, or go out for coffee. Sometimes, I just stay home and watch movies or read books. Do you prefer spending weekends indoors or outdoors? Keywords: mood: explore new places - rest It depends on my mood. Sometimes I like going out to explore new places, but other times I prefer staying at home to rest. Do you think weekends are important? Keywords: relax +recharge Yes, weekends help people relax and recharge after a busy week. It’s a good time to spend with family and friends.'
- band_level: 7.5
  turn_type: standalone
  ai_line: 20. Mobile Phones Do you use your phone often?
  user_model_answer: 'Keywords: every day, important Yes, I use my phone every day for work, communication, and entertainment. It’s an important part of my daily life. What do you use your phone for? Keywords: texting, videos, music, internet I use it for texting, watching videos, listening to music, and browsing the internet. It helps me stay connected with everything. Do you think people use their phones too much? Keywords: too much, health, take breaks Yes, many people spend too much time on their phones, which is not good for their health. It’s important to take breaks and use them wisely.'
