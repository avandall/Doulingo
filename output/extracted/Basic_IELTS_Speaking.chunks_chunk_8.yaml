sample_dialogues:
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Complete the following dialogue with appropriate sentences or phrases. **A:** Can you tell me something about your years in school? I'm interested in learning what people think about their years as students.
  user_model_answer: '**B:** Sure, no problem. What do you want to know? **A:** Well, first of all, when did you start attending school? **B:** When I was three years old, I began attending nursery school. **A:** What are some of your happiest memories about your early years in school? **B:** I remember going to school with my mother, and being picked up by my grandfather. My teachers were very kind, and we had a lot of fun playing and learning. **A:** Where did you go to elementary school? Where was it located? **B:** My elementary school was located just 5 minutes away from my house.'
