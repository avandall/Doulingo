- band_level: 7.5
  turn_type: standalone
  ai_line: 1. What kinds of people are likely to be the role models for teenagers?
  user_model_answer: I think that teenagers find role models in many places, for some it could be their relatives or parents who have been successful in life. It could also be celebs whom the kids admire and are able to relate their life goals or personal qualities with.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Is it important for children to have a role model?
  user_model_answer: Yes I think having a role model can help children stay focused about their life goals and dreams. Children like to emulate what their role models do and in a way it acts as a motivation for them to achieve big in life.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Are there any differences between today's famous people and those of the past?
  user_model_answer: Absolutely! There are some big differences between famous people today and those of the past. In the past, fame came from things like movies, TV, or music on the radio. Now, social media lets anyone become famous very quickly, even if they're not a singer or actor. Also, I feel that in the past famous people used to be more humble because they valued their fame whereas nowadays people don’t care if fame comes or goes.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. What qualities do famous people have?
  user_model_answer: I think that famous people can be pretty different, but there are some qualities that many of them share. For example, they might be super talented at something, like singing or acting, or maybe they're really good at sports. They also probably work really hard and never give up on their dreams.
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. What kinds of people are likely to become famous?
  user_model_answer: Like I mentioned earlier people who never give up on their dreams and do not care about what society says about them are most likely to be famous. Also, they are super talented in their fields and they put more than 100% effort in whatever they do.
- band_level: 7.5
  turn_type: standalone
