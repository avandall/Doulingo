  ai_line: 1. What are the differences between old and young people when using apps?
  user_model_answer: Young people are usually faster and more comfortable exploring new features, while older people prefer simple layouts and need more time to get used to updates.
- band_level: 7.0
  turn_type: standalone
  ai_line: 2. Why do some people not like using apps?
  user_model_answer: Some people find apps confusing or time-consuming, and others worry about privacy or feel they don’t really need them.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. What apps are popular in your country? Why?
  user_model_answer: Social media and payment apps are very popular because they make communication and daily transactions quick and convenient.
