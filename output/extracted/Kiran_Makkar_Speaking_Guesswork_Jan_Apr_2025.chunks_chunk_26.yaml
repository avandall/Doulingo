- band_level: 7.5
  turn_type: standalone
  ai_line: '55. Describe a time you visited a new place You should say: - Where the new place is - When you went there - Why did you go there?'
  user_model_answer: '- And explain how you feel about the place • There are many public buildings and historical places, which I have visited in my life. • Here, I would like to talk about the Statue of Unity in the Narmada district of Gujarat. • It is a colossal statue of Sardar Vallabhai Patel, who was the first Home Minister of Independent India. • His expression, posture and pose show the confidence and the iron-will of this great person. • Recently I had an opportunity to visit this architectural marvel. • This statue can withstand winds of 180 km/hour and can resist earthquake of 6.5 on the Richter scale. • I came to know about it from the news channels on TV. • It was on all news channels in January 2019. • This Statue of Unity was first open to public on 3rd Jan 2019 • It is the world’s tallest statue. • It was built in just 33 months. • It is made of bronze and is about 600 feet tall. • I visited this place with my family, and I really enjoyed a lot with them. • We visited this
    place in December last year. • I had read a lot about it on the internet. • Apart from the statue there are several other things here which are worth seeing. • The ticket is Rs. 350/- per head. • It includes the entry to the observation deck, valley of flowers, the Sardar Patel Memorial, museum and audio-visual Gallery, the statue of Unity site and the Narmada River. • More than 2 million people have visited the statue already. • It has become a major tourist attraction of India. www.youtube.com/makkarielts www.instagram.com/makkarielts www.makkarielts.com/books 122 Jan-Apr 2025 Speaking Guesswork (FINAL VERSION) www.makkarielts.com/books'
