sample_dialogues:
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. What kinds of bills do you have to pay?
  user_model_answer: I have to pay various kinds of bills every month, such as ultility bills, you know things like gas, heating, water and electricity. Other bills include travel expenses, insurance, and my credit card bill because I pay for nearly everything with my credit card. Fortunately, I don’t have to pay rent because I live with my parents.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. How do you usually pay your bills – in cash or by another method?
  user_model_answer: Like I said earlier, I use my credit card for nearly every purchase because it’s much more convenient than cash. But I always make sure that I pay my balance in full every month; otherwise, I would end up with mountains of debt.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Have you ever forgotten to pay a bill? Why/why not?
  user_model_answer: Yes, two years ago I forgot to pay my electricity bill because at that time paying online wasn’t available in my village. So, my electricity was cut and I remember I had to go to the provider’s office to pay the bill to get it back.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Is there anything you could do to make your bills cheaper?
  user_model_answer: Yes, there are a few different ways I could make my bills cheaper. I could reduce my travel expenses by taking public transport instead of driving to work. I could cut down my grocery bills by making a shopping list to avoid impulse buying and planning meals to make the most use of what I have bought.
