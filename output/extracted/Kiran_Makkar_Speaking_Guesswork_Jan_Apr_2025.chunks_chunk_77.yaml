  ai_line: 194. Sharing a. Did you share anything with others recently?
  user_model_answer: Yes I shared my bike with a friend. My friend’s bike had gone for repair and he was finding it difficult to commute to college so I lent him my bike for few days. b. Did your parents teach you to share when you were a child? Yes my parents taught me that sharing is caring. They always told me to share my toys with my friends. c. What kind of things do you like to share with others? I share a lot of things with my friends like food, my bike etc. When we are playing cricket I take along my cricket kit which everyone shares. d. What kind of things are not suitable for sharing? Things that are personal like clothes are not suitable for sharing. The reason is that it is not hygenic to share such items.
- band_level: 7.5
  turn_type: standalone
  ai_line: 195. Patience a. Were you patient when you were young?
  user_model_answer: Well I do not remember exactly but I guess I was patient. My parents never told me that b. How do you feel when other people are not patient? It feel bad when other people are not patient because if we do something in hurry then there are chances that things can go bad. c. Are you less or more patient when you are angry? I normally do not get angry, but whenever I do its momentary. I also go silent when I am angry and try to reason logically with people. So I am more patient when I am angry.
- band_level: 7.5
  turn_type: standalone
  ai_line: 197. Drinking water a. Do you think we should drink a lot of water?
  user_model_answer: Yes we should definitely drink a lot of water as it is good for our health. Drinking water has lot of health benefits, it keeps our skin and body hydrated. If we do not drink enough water, our body will suffer from dehydration. b. How often you drink water? I try to drink at least 3-4 litres of water everyday, so I normally have water after every 2-3 hours during the day. c. Do you drink bottled water or water from machines? I like to drink water from machines like water purifier because I believe water in machines is more pure and safe as compared to water that is packed in plastic bottles d. What kind of water do you like to drink Well, I like to drink water at room temperature because when I drink cold water I get a sore throat
