  user_model_answer: Yes, I have a tried a lot of different cuisines like Italian, Mexican, Japanese Chines, etc. b. Do you like to try new food? Yes, I call myself a foodie, I absolutely love to try new food, especially the local food of any new place that I visit. c. What kind of new food you have tried recently? Recently, I went on a holiday to Thailand and I tried the street food over there. I dont remember the name of the dish, but it had noodles, prawn and vegetables. d. What kind of foreign foods are popular in your country In my country most popular cuisines are Italian and Chinese. Most of the people like to eat Pizzas and Noodles when they eat outside
