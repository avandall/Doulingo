  ai_line: 3. What was the favourite sport when you were young?
  user_model_answer: My favourite sport was cricket when I was young, it is also my favourite sport now. I remember I used to play cricket continuously for 5 to 6 hours during my holidays. Batting was my favorite part in cricket.
