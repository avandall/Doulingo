  - term: second thoughts
    meaning: doubts about a decision already made
    example: I'm having second thoughts about going on holiday with Jean.
    band_suitability: 6.0+
    register: neutral
  - term: as free as a bird
    meaning: to feel completely free and without responsibilities
    example: When I had finished all my exams, I felt as free as a bird.
    band_suitability: 7.0+
    register: neutral
  - term: give someone a free hand
    meaning: to give someone freedom to act as they wish
