  - term: economic independence
    meaning: having enough income to pay your own way without depending on others
    example: cản trở họ trong việc đạt được những kỹ năng cần thiết để có được những
      công việc được trả lương cao và độc lập về kinh tế
    band_suitability: 7.0+
    register: formal
  - term: workplace discrimination
    meaning: unfair treatment of employees based on prejudice
    example: workplace discrimination also limits women’s career advancement
    band_suitability: 7.0+
    register: formal
  - term: career advancement
    meaning: upward progression in one's career
    example: workplace discrimination also limits women’s career advancement
    band_suitability: 7.0+
    register: formal
  - term: equal access to education
    meaning: providing the same educational opportunities to all people regardless
