  - term: a selfish streak
    meaning: a typical part of someone's character that makes them care only about
      themselves
    example: She has a selfish streak and doesn’t care sometimes how much she hurts
      my feelings.
    band_suitability: 7.0+
    register: neutral
  - term: bear a grudge
    meaning: to continue to feel angry or unfriendly towards someone who has done
      something to upset you
    example: I know that I have a tendency to bear a grudge, but I just can’t forget
      something bad a friend did.
    band_suitability: 7.0+
    register: neutral
  - term: make a fool out of someone
    meaning: to make someone look stupid
    example: someone seems to enjoy making a fool out of you in front of other people
    band_suitability: 6.0+
    register: informal
  - term: hurt someone's feelings
    meaning: to upset or offend someone
    example: she has a selfish streak and doesn’t care sometimes how much she hurts
      my feelings.
    band_suitability: 6.0+
    register: neutral
  - term: lose your temper
    meaning: to suddenly become very angry
    example: I am finding it increasingly hard to keep my temper with her. But perhaps
      it might be better to lose my temper?
    band_suitability: 6.0+
    register: neutral
  - term: painfully shy
