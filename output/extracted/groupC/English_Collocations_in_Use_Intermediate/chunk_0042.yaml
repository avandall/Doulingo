vocabulary_entry:
  topic_tags:
  - change
  - habits
  - lifestyle
  - choices
  category: collocation
  source_citation: English Collocations in Use Intermediate, Unit 48
  entries:
  - term: make adjustments
    meaning: to make small changes to something to make it work better
    example: I made a few adjustments to the gears and my bike works much better now.
    band_suitability: 6.0+
    register: neutral
  - term: slight alteration
    meaning: a small change made to something
    example: We’ve had to make a slight alteration to our plans for the evening.
    band_suitability: 6.0+
    register: neutral
  - term: make modifications
    meaning: to make small changes to a system or product
    example: We’ve made a few modifications to the software so that it suits our systems
      better.
    band_suitability: 6.0+
    register: neutral
  - term: adopt a new approach
    meaning: to start using a new way of dealing with a situation or problem
    example: We’ve decided to adopt a new approach to the parking problem.
    band_suitability: 7.0+
    register: formal
  - term: break a habit
    meaning: to stop doing something that you do regularly
    example: It is often much more difficult than you’d expect to break a habit.
    band_suitability: 6.0+
    register: neutral
  - term: kick the habit
    meaning: to stop doing a harmful habit
    example: The organisation helps smokers who want to kick the habit.
    band_suitability: 7.0+
    register: informal
  - term: transform the way
    meaning: to make a major, positive change to how something is done or felt
    example: Yoga has the power to transform the way we feel.
    band_suitability: 7.0+
    register: neutral
  - term: change places/seats
    meaning: to exchange where you are sitting with someone else
    example: Would you like to change places/seats with me – then you can sit next
      to your friend?
    band_suitability: 6.0+
    register: neutral
  - term: change jobs
    meaning: to leave one job to start another
    example: Jack is going to change jobs next year, so they’ll have to move house.
    band_suitability: 6.0+
    register: neutral
  - term: move house
    meaning: to leave your home to live in a new one
    example: Jack is going to change jobs next year, so they’ll have to move house.
    band_suitability: 6.0+
    register: neutral
  - term: change your mind
    meaning: to alter your opinion or decision about something
    example: Harry is planning to study law at university but he may change his mind.
    band_suitability: 6.0+
    register: neutral
  - term: change the subject
    meaning: to start talking about a different topic
    example: Whenever Flora talks about marriage, Adam changes the subject.
    band_suitability: 6.0+
    register: neutral
  - term: change the beds
    meaning: to put clean sheets on a bed
    example: I’ll get some clean sheets and we’ll change the beds.
    band_suitability: 6.0+
    register: neutral
  - term: change your clothes
    meaning: to take off what you are wearing and put on different garments
    example: Do you want to change your clothes before we go out?
    band_suitability: 6.0+
    register: neutral
  - term: rise steadily
    meaning: to increase consistently over time (used for standards, prices, profits)
    example: The standard of living is rising steadily.
    band_suitability: 7.0+
    register: neutral
  - term: raise a question
    meaning: to bring up an issue or question for discussion
    example: During a meeting you sometimes raise a question.
    band_suitability: 7.0+
    register: formal
