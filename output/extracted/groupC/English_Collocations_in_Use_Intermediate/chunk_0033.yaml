  category: collocation
  source_citation: English Collocations in Use Intermediate, Unit 38
  entries:
  - term: fight a running battle
    meaning: to fight while moving or over a continuous, lengthy period
    example: The police fought a running battle with football hooligans in the town
      centre.
    band_suitability: 7.0+
    register: neutral
  - term: put up a heroic fight
    meaning: to struggle very bravely and determinedly against difficulties
    example: The people of the village put up a heroic fight against the construction
      of the new motorway.
    band_suitability: 7.0+
    register: neutral
  - term: lose the battle
    meaning: to fail in an attempt to achieve or prevent something
    example: The people of the village put up a heroic fight against the construction
      of the new motorway, but finally lost the battle.
    band_suitability: 6.0+
    register: neutral
  - term: offer resistance
    meaning: to fight back or refuse to submit
    example: The bank robbers didn’t offer any resistance when the police surrounded
      them.
    band_suitability: 7.0+
    register: formal
  - term: fight for one's life
    meaning: to try very hard to stay alive after a severe injury or illness
    example: The President is fighting for his life tonight in the City hospital after
      a major operation.
    band_suitability: 6.0+
    register: neutral
