    band_suitability: 8.0+
    register: neutral
  - term: gale-force winds
    meaning: extremely strong winds
    example: Gale-force winds caused a lot of damage to property.
    band_suitability: 7.0+
    register: neutral
  - term: rivers burst their banks
    meaning: rivers overflow due to too much water (flooding)
