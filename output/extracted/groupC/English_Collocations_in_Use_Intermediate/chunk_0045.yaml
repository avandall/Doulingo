vocabulary_entry:
  topic_tags:
  - success
  - failure
  - events
  - time
  category: collocation
  source_citation: English Collocations in Use Intermediate, Units 51-52
  entries:
  - term: close finish
    meaning: a finish of a race or competition in which the winner is very close behind
      the others
    example: Pedro Macarro emerged the winner of today’s Spanish Grand Prix in a very
      close finish.
    band_suitability: 6.0+
    register: neutral
  - term: nail-biting finish
    meaning: an exciting and tense finish where you do not know who will win until
      the end
    example: Claude Roux won the championship yesterday in a nail-biting finish.
    band_suitability: 7.0+
    register: neutral
  - term: put the finishing touches to
    meaning: add the final details to something to make it complete
    example: Ministers met in Rome today to put the finishing touches to a new constitution
      for the European Union.
    band_suitability: 7.0+
    register: neutral
  - term: bring to an end
    meaning: to cause something to stop or finish
    example: The doctors' strike was finally brought to an end yesterday.
    band_suitability: 6.0+
    register: neutral
  - term: beginning of the end
    meaning: the beginning of a series of events that show that something is failing
      or ending soon
    example: The invention of television marked the beginning of the end for popular
      radio shows.
    band_suitability: 7.0+
    register: neutral
  - term: end result
    meaning: the final result or outcome of a process or activity
    example: I studied hard for a whole month and the end result was that I got a
      grade ‘A’ in the exam.
    band_suitability: 6.0+
    register: neutral
  - term: perfect end
    meaning: a wonderfully satisfying conclusion to an event or period of time
    example: The meal we had on our last evening in Istanbul was a perfect end to
      our holiday.
    band_suitability: 6.0+
    register: neutral
  - term: make a start / get started
    meaning: to begin doing something
    example: It’s two o’clock. Let’s make a start / get started, shall we?
    band_suitability: 6.0+
    register: neutral
  - term: come to an end
    meaning: to finish or stop
    example: As my time at university came to an end, I knew I had to start looking
      for a job.
    band_suitability: 6.0+
    register: neutral
  - term: draw to a close
    meaning: to gradually come to an end (often used for meetings, events, speeches)
    example: The meeting drew to a close at 5.30, after a long discussion.
    band_suitability: 7.0+
    register: neutral
  - term: abrupt end
    meaning: a sudden and unexpected end
    example: It was an abrupt end to his career in journalism.
    band_suitability: 7.0+
    register: neutral
  - term: make a breakthrough
    meaning: to make an important discovery or achieve success after trying for a
      long time
    example: James has made a breakthrough in his maths this year.
    band_suitability: 7.0+
    register: neutral
  - term: dramatic improvement
    meaning: a very large and noticeable improvement
    example: This year has seen a dramatic improvement in James’s English.
    band_suitability: 6.0+
    register: neutral
  - term: crowning achievement
    meaning: the most important or successful thing that someone has achieved
    example: His crowning achievement was his performance in the school production
      of Othello.
    band_suitability: 8.0+
    register: formal
  - term: excellent grasp
    meaning: a thorough understanding of something
    example: James has an excellent grasp of French.
    band_suitability: 7.0+
    register: neutral
  - term: take advantage of
    meaning: to make good use of an opportunity
    example: We hope he will take advantage of the opportunities to speak French there.
    band_suitability: 6.0+
    register: neutral
  - term: make good progress
    meaning: to develop or improve well
    example: James has made good progress with his geography this year.
    band_suitability: 6.0+
    register: neutral
  - term: great success
    meaning: an outcome that is extremely successful
    example: James’s history project was a great success.
    band_suitability: 6.0+
    register: neutral
  - term: enjoy the fruits of one's hard work
    meaning: to experience the good results of what you have worked hard for
    example: James is now able to enjoy the fruits of his hard work.
    band_suitability: 8.0+
    register: neutral
  - term: bring out the best in someone
    meaning: to cause someone's best qualities to show
    example: Playing for the school has certainly brought out the best in him.
    band_suitability: 7.0+
    register: neutral
  - term: win the respect
    meaning: to earn the admiration and respect of others
    example: He has rightly won the respect of all his team-mates.
    band_suitability: 6.0+
    register: neutral
  - term: fail miserably
    meaning: to fail completely in a very obvious way
    example: Unfortunately the peace talks now seem likely to fail miserably.
    band_suitability: 7.0+
    register: neutral
  - term: spectacular failure
    meaning: an extremely large and notable failure
    example: Although a lot of money was invested in the film it has proved to be
      a spectacular failure.
    band_suitability: 7.0+
    register: neutral
  - term: hopes were dashed
    meaning: hopes were suddenly destroyed or ruined
    example: Hopes that the play would enjoy a long run in London were dashed.
    band_suitability: 8.0+
    register: neutral
  - term: doomed to failure
    meaning: certain to fail and impossible to save
    example: Everyone agrees that the peace talks are doomed to failure.
    band_suitability: 7.0+
    register: neutral
  - term: dismal failure
    meaning: a complete and disappointing failure
    example: It has proved to be a dismal failure.
    band_suitability: 7.0+
    register: neutral
  - term: go out of business
    meaning: to stop operating as a business because of bankruptcy or lack of money
    example: A couple of major companies in the area went out of business last month.
    band_suitability: 6.0+
    register: neutral
  - term: recipe for disaster
    meaning: a situation that is very likely to result in disaster or severe problems
    example: I think the new plans for cutting railway costs are a recipe for disaster.
    band_suitability: 7.0+
    register: neutral
  - term: lose one's nerve
    meaning: to suddenly become too frightened to do something you had planned to
      do
    example: At the last moment the Olympic ski jumper lost his nerve.
    band_suitability: 7.0+
    register: neutral
  - term: miss the point
    meaning: to fail to understand the most important part of an argument or situation
    example: The President’s speech was disappointing as it totally missed the point.
    band_suitability: 6.0+
    register: neutral
