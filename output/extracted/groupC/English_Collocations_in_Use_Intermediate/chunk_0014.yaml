    band_suitability: 6.0+
    register: neutral
  - term: brutally honest
    meaning: honest in a very direct way that may hurt someone's feelings
    example: You can be brutally honest and sometimes hurt others’ feelings.
    band_suitability: 7.0+
    register: neutral
  - term: play a joke/trick
    meaning: to do something to deceive or trick someone for fun
    example: The children played a joke on the teacher by hiding under their desks.
    band_suitability: 6.0+
    register: neutral
  - term: take a joke
    meaning: to not be upset or offended when someone plays a joke on you
    example: Fortunately, the teacher could take a joke and didn’t punish them.
    band_suitability: 6.0+
    register: neutral
  - term: swallow your pride
    meaning: to decide to do something even though it is embarrassing for you
    example: Isabella swallowed her pride and admitted that she was wrong.
    band_suitability: 8.0+
    register: neutral
  - term: throw a tantrum
    meaning: to behave in a very uncontrolled, angry manner (usually used of children)
    example: The child threw a tantrum when I wouldn’t buy him any sweets.
    band_suitability: 7.0+
    register: neutral
  - term: lose your patience
    meaning: to stop being able to stay calm and become angry
    example: Finally I lost my patience and shouted at her.
    band_suitability: 6.0+
    register: neutral
  - term: come to terms with
    meaning: to accept a difficult or sad situation psychologically
    example: Nick has found it hard to come to terms with his illness.
    band_suitability: 8.0+
    register: neutral
  - term: reveal your true character
    meaning: to show what you are really like underneath
    example: Daniel’s failure to support her has certainly revealed his true character.
