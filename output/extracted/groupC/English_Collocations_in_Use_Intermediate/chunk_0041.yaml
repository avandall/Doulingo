vocabulary_entry:
  topic_tags:
  - travel
  - movement
  - speed
  - transport
  - directions
  category: collocation
  source_citation: English Collocations in Use Intermediate, Unit 47
  entries:
  - term: fast car
    meaning: an automobile that can travel at high speeds
    example: Luke has a passion for fast cars.
    band_suitability: 6.0+
    register: neutral
  - term: fast train
    meaning: a train that makes few stops and travels quickly between destinations
    example: The fast train to London only takes 45 minutes.
    band_suitability: 6.0+
    register: neutral
  - term: fast lane
    meaning: the lane on a motorway or highway used for overtaking
    example: I don’t like driving in the fast lane on the motorway.
    band_suitability: 6.0+
    register: neutral
  - term: quick glance
    meaning: a brief, fast look at something
    example: We had a quick glance at the menu and went in.
    band_suitability: 6.0+
    register: neutral
  - term: quick shower
    meaning: a fast and brief bath under a shower
    example: I think I’ll have a quick shower before going out.
    band_suitability: 6.0+
    register: informal
  - term: rapid growth
    meaning: fast development or increase in size/number
    example: There has been a rapid increase in the number of tourists visiting the
      city.
    band_suitability: 7.0+
    register: formal
  - term: rapid decline
    meaning: a fast decrease in number, amount, or quality
    example: There has been a rapid decline in the number of seabirds visiting the
      island each year.
    band_suitability: 7.0+
    register: formal
  - term: speedy recovery
    meaning: getting well quickly after an illness or operation
    example: She made a speedy recovery after her operation.
    band_suitability: 7.0+
    register: neutral
  - term: swift action
    meaning: fast and effective measures taken to deal with a situation
    example: The government took swift action to change the law.
    band_suitability: 7.0+
    register: formal
  - term: prompt reply
    meaning: an answer or response given quickly without delay
    example: I was happy that my letter received such a prompt reply.
    band_suitability: 7.0+
    register: formal
  - term: brisk walk
    meaning: a fast, energetic walk for exercise or transportation
    example: We had a brisk walk before lunch.
    band_suitability: 6.0+
    register: neutral
  - term: hasty decision
    meaning: a decision made too quickly, often without sufficient thought
    example: We should not make a hasty decision; we may regret it later.
    band_suitability: 7.0+
    register: neutral
  - term: top speed
    meaning: the maximum speed at which a vehicle can travel
    example: This car has a top speed of 180 kilometres per hour.
    band_suitability: 6.0+
    register: neutral
  - term: breakneck speed
    meaning: dangerously fast speed
    example: He drove at breakneck speed along the motorway and was soon stopped by
      the police.
    band_suitability: 8.0+
    register: informal
  - term: slow motion
    meaning: filmed or shown at a speed much slower than normal
    example: It was fascinating to see the winning goal again in slow motion.
    band_suitability: 6.0+
    register: neutral
  - term: slow-moving traffic
    meaning: vehicles moving at a very slow pace due to congestion
    example: We were stuck in slow-moving traffic for an hour on our way to the airport.
    band_suitability: 6.0+
    register: neutral
  - term: come to a standstill
    meaning: to stop completely
    example: After the accident the traffic slowed to a crawl and then finally came
      to a standstill.
    band_suitability: 7.0+
    register: neutral
  - term: leisurely breakfast
    meaning: a relaxed meal eaten without rushing
    example: We got up late and had a leisurely breakfast.
    band_suitability: 7.0+
    register: neutral
  - term: pick up speed
    meaning: to go faster
    example: As it left the city, the train gathered/picked up speed and headed north.
    band_suitability: 6.0+
    register: neutral
  - term: take a shortcut
    meaning: to follow a more direct or faster route than usual
    example: We took a shortcut through a narrow side-street and saved ourselves a
      15-minute walk.
    band_suitability: 6.0+
    register: neutral
  - term: make a detour
    meaning: to take a different or indirect route to avoid something or visit somewhere
    example: Several roads were closed, so we had to make/take a detour.
    band_suitability: 7.0+
    register: neutral
  - term: lose one's balance
    meaning: to become unsteady and fall or nearly fall
    example: I lost my balance and fell off my bike.
    band_suitability: 6.0+
    register: neutral
  - term: lose one's footing
    meaning: to slip or trip, failing to keep a firm placement with one's feet
    example: I lost my footing and fell down the bank into the river.
    band_suitability: 8.0+
    register: neutral
  - term: steer the conversation
    meaning: to gently guide a discussion towards a different topic
    example: I tried to steer the conversation away from my terrible exam results.
    band_suitability: 8.0+
    register: neutral
  - term: change one's mind
    meaning: to alter one's opinion or decision about something
    example: She took a few steps towards the bus, then changed her mind and decided
      not to go after all.
    band_suitability: 6.0+
    register: neutral
  - term: go astray
    meaning: to become lost or go to the wrong place while in transit
    example: One of the packages I posted went astray and never arrived.
    band_suitability: 8.0+
    register: formal
