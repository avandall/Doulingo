  - term: whiff of perfume
    meaning: a slight, brief smell of perfume
    example: Do I detect a whiff of perfume?
    band_suitability: 7.0+
    register: neutral
  - term: share the same taste
    meaning: to like the same things
    example: Hudson and I share the same taste in music.
    band_suitability: 6.0+
    register: neutral
  - term: develop a taste for
    meaning: to start liking something over time
    example: She has developed a taste for fast cars.
    band_suitability: 7.0+
    register: neutral
  - term: smell danger
    meaning: to sense or feel that danger is near
    example: We smelt danger and decided not to enter the city.
    band_suitability: 8.0+
    register: neutral
