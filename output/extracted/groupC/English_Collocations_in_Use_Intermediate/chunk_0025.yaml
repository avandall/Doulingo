    band_suitability: 6.0+
    register: neutral
  - term: pie chart
    meaning: a circular statistical graphic divided into slices to illustrate numerical
      proportion
    example: If you are presenting numbers or data, pie charts, bar charts or graphs
      are often the clearest way.
    band_suitability: 6.0+
    register: neutral
  - term: bar chart
    meaning: a chart with rectangular bars with lengths proportional to the values
