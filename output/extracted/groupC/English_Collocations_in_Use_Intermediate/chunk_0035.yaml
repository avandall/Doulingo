vocabulary_entry:
  topic_tags:
  - time
  - daily routine
  - lifestyle
  - planning
  category: collocation
  source_citation: English Collocations in Use Intermediate, Unit 40
  entries:
  - term: spend time
    meaning: to pass time doing something or in a particular place
    example: I spent some time in South America when I was younger.
    band_suitability: 6.0+
    register: neutral
  - term: waste time
    meaning: to use time without any real purpose or benefit
    example: You’ll save time if you do it like this.
    band_suitability: 6.0+
    register: neutral
  - term: save time
    meaning: to prevent time from being wasted or spent
    example: You’ll save time if you do it like this.
    band_suitability: 6.0+
    register: neutral
  - term: tell someone the time
    meaning: to look at a clock or watch and say what time it is
    example: Can you tell me the time, please?
    band_suitability: 6.0+
    register: neutral
  - term: free/spare time
    meaning: time when you are not working or busy
    example: What do you like to do in your free/spare time?
    band_suitability: 6.0+
    register: neutral
  - term: have time to
    meaning: to have enough time available to do something
    example: I’m sorry, I didn’t have time to do my homework.
    band_suitability: 6.0+
    register: neutral
  - term: make time for
    meaning: to create time in a busy schedule for someone or something
    example: The doctor’s very busy but he’ll try to make time for you.
    band_suitability: 7.0+
    register: neutral
  - term: kill time
    meaning: to do something to fill in the time while waiting
    example: We had a meal in the restaurant to kill some time.
    band_suitability: 7.0+
    register: informal
  - term: take your time
    meaning: to do something without hurrying
    example: No need to hurry – you can take your time.
    band_suitability: 6.0+
    register: neutral
  - term: bang/dead/right on time
    meaning: at the exact correct time without being late
    example: The train left bang/dead/right on time.
    band_suitability: 7.0+
    register: informal
  - term: have a good/great time
    meaning: to enjoy oneself
    example: We had a good/great time at the party.
    band_suitability: 6.0+
    register: neutral
  - term: have the time of your life
    meaning: to have an extremely enjoyable experience
    example: Lena had the time of her life in Brazil.
    band_suitability: 7.0+
    register: neutral
  - term: as time goes by / as time passes
    meaning: as a period of time elapses
    example: Your attitude to work may change a bit as time goes by.
    band_suitability: 7.0+
    register: neutral
  - term: run out of time
    meaning: to have no time left to finish something
    example: I couldn’t finish the exam because I ran out of time.
    band_suitability: 6.0+
    register: neutral
  - term: big time
    meaning: extremely or to a great degree
    example: You’ll be sorry big time for speaking to me like that!
    band_suitability: 8.0+
    register: informal
  - term: recent past
    meaning: the period of time that happened not long ago
    example: She’s not interested in the recent past at all.
    band_suitability: 7.0+
    register: neutral
  - term: last-minute
    meaning: happening just before something else happens or too late
    example: There are lots of last-minute things left to do.
    band_suitability: 7.0+
    register: neutral
  - term: work from dawn till dusk
    meaning: to work all day from early morning until night
    example: They work from dawn till dusk.
    band_suitability: 8.0+
    register: neutral
  - term: small hours
    meaning: the early hours of the morning after midnight (2, 3, 4 a.m.)
    example: They stay up until the small hours.
    band_suitability: 8.0+
    register: neutral
  - term: ungodly hours
    meaning: unreasonably late or early hours
    example: Tina can’t wait until they stop working such ungodly hours.
    band_suitability: 8.0+
    register: informal
  - term: take ages
    meaning: to take a very long time
    example: It’s taking them ages to complete their work.
    band_suitability: 6.0+
    register: neutral
  - term: worth your while
    meaning: worth the time and effort spent
    example: Tina is sure it will eventually all be worth their while.
    band_suitability: 7.0+
    register: neutral
  - term: a great future ahead
    meaning: promising future prospects
    example: She is sure they both have a great future ahead of them.
    band_suitability: 7.0+
    register: neutral
  - term: in the not too distant future
    meaning: soon; in a short time
    example: They will both get good academic jobs in the not too distant future.
    band_suitability: 7.0+
    register: neutral
  - term: what the future holds
    meaning: what will happen in the future
    example: No one can know what the future holds.
    band_suitability: 8.0+
    register: neutral
