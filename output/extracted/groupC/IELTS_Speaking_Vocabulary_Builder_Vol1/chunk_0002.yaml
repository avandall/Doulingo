vocabulary_entry:
  topic_tags:
  - health
  - fitness
  - lifestyle
  - wellbeing
  category: collocation
  source_citation: IELTS_Speaking_Vocabulary_Builder_Vol1 - Health
  entries:
  - term: stay healthy
    meaning: to remain in a good physical condition
    example: Staying healthy involves making certain choices.
    band_suitability: 6.0+
    register: neutral
  - term: prone to
    meaning: likely to suffer from an illness or show a negative characteristic
    example: make you more prone to certain conditions.
    band_suitability: 7.0+
    register: neutral
  - term: play a key role in
    meaning: to be very important in a process or activity
    example: many of which play a key role in keeping you healthy
    band_suitability: 6.0+
    register: neutral
  - term: moderate-intensity aerobic activity
    meaning: physical exercise that gets your heart rate up at a medium level
    example: 150 minutes of moderate-intensity aerobic activity a week
    band_suitability: 7.0+
    register: formal
  - term: whole foods
    meaning: food that is unprocessed or refined in a simple, natural form
    example: Eat more whole foods
    band_suitability: 7.0+
    register: neutral
  - term: artificial ingredients
    meaning: chemical additives created in a lab to improve taste or preservation
    example: They don’t contain a lot of added chemicals or artificial ingredients
    band_suitability: 7.0+
    register: neutral
  - term: shelf life
    meaning: the length of time that food can be stored before it goes bad
    example: give them a long shelf life.
    band_suitability: 7.0+
    register: neutral
  - term: stay hydrated
    meaning: to drink enough water to keep your body functioning properly
    example: Staying hydrated keeps your brain working well.
    band_suitability: 6.0+
    register: neutral
  - term: key to
    meaning: extremely important for achieving a specific result
    example: Drinking enough water each day is key to good health.
    band_suitability: 6.0+
    register: neutral
