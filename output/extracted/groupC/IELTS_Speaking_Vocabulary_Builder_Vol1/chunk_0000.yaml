vocabulary_entry:
  topic_tags:
  - dreams
  - sleep
  - psychology
  - emotions
  category: phrase
  source_citation: IELTS Speaking Vocabulary Builder Vol 1 - Dreams (verywellmind.com)
  entries:
  - term: wake up in a pool of sweat
    meaning: to wake up covered in sweat, usually from a nightmare or illness
    example: You scream, but nothing comes out, and suddenly, wake up in a pool of
      sweat.
    band_suitability: 6.0+
    register: informal
  - term: a symbol of fear
    meaning: something that represents or is a sign of fear
    example: It is a symbol of fear in real life— perhaps of failing at work or in
      your love life.
    band_suitability: 6.0+
    register: neutral
  - term: let yourself go
    meaning: to relax and behave much more freely than usual
    example: Falling often expresses a need to let yourself go more and enjoy life
      more.
    band_suitability: 7.0+
    register: neutral
  - term: enjoy life
    meaning: to take pleasure in living and experience happiness
    example: Falling often expresses a need to let yourself go more and enjoy life
      more.
    band_suitability: 6.0+
    register: neutral
  - term: dream interpreters
    meaning: people who analyze or explain the meaning of dreams
    example: Dream interpreters often suggest that such dreams mean that you are trying
      to avoid something in your daily life.
    band_suitability: 7.0+
    register: neutral
  - term: be worried about
    meaning: feeling anxious or troubled about actual or potential problems
    example: It might mean that you are worried about your attractiveness or appearance,
      for instance.
    band_suitability: 6.0+
    register: neutral
  - term: fear of the unknown
    meaning: fear of things that are not known or experienced yet
    example: Popular dream interpretations suggest that such dreams reflect anxiety
      about change or a fear of the unknown.
    band_suitability: 7.0+
    register: neutral
