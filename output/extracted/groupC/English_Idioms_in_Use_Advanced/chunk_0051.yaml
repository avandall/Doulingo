vocabulary_entry:
  topic_tags:
  - failure
  - plans
  - success_and_failure
  - problems
  category: idiom
  source_citation: English Idioms in Use Advanced, Unit 56
  entries:
  - term: dead and buried
    meaning: finished or ended completely
    example: As far as I'm concerned, that idea is now dead and buried.
    band_suitability: 7.0+
    register: neutral
  - term: the kiss of death
    meaning: an event or action that caused a plan or project to fail
    example: That was the kiss of death to our plan to buy a place in the city centre.
    band_suitability: 8.0+
    register: informal
  - term: dead in the water
    meaning: failed and will never succeed
    example: No. The city council ran out of money, and the whole plan is dead in
      the water.
    band_suitability: 7.0+
    register: neutral
  - term: as dead as a dodo
    meaning: not existing, popular, or important any more
    example: That's as dead as a dodo. They stopped publishing it about a year ago.
    band_suitability: 8.0+
    register: informal
  - term: dead wood
    meaning: members of a group who are not useful any more and who should be removed
    example: If you want my opinion, there's too much dead wood. We need some new
      people.
    band_suitability: 8.0+
    register: neutral
  - term: a dead duck
    meaning: not successful or useful
    example: Oh, it's a dead duck. Everyone voted against it.
    band_suitability: 8.0+
    register: informal
  - term: deal a death blow
    meaning: cause something to fail completely
    example: The economic recession has dealt a death blow to many small businesses.
    band_suitability: 8.0+
    register: neutral
