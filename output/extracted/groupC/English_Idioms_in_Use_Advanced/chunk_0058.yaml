  - term: neat and tidy
    meaning: very clean and organized
    example: ''
    band_suitability: 6.0+
    register: neutral
  - term: wear and tear
    meaning: the damage that happens to an object in ordinary use over a period
    example: ''
    band_suitability: 7.0+
    register: neutral
  - term: hustle and bustle
    meaning: busy and noisy activity
    example: The hustle and bustle of market day.
    band_suitability: 7.0+
    register: neutral
  - term: through and through
    meaning: completely; in every way
    example: He's a United supporter through and through.
    band_suitability: 7.0+
    register: neutral
  - term: chalk and cheese
    meaning: completely different from each other
    example: Her two dogs are like chalk and cheese.
    band_suitability: 7.0+
    register: neutral
  - term: in dribs and drabs
    meaning: in small amounts or numbers over a period of time
    example: People started to enter the room in dribs and drabs.
    band_suitability: 8.0+
    register: neutral
  - term: wax and wane
    meaning: to increase and decrease over time
    example: Jack's commitment to work waxed and waned throughout the year.
    band_suitability: 8.0+
    register: formal
  - term: out and about
    meaning: active; able to go outside again after an illness
    example: Have a few days' rest and you'll be out and about in no time.
    band_suitability: 7.0+
    register: neutral
  - term: time after time
    meaning: repeatedly; on many occasions
    example: I've told him time after time not to leave his car unlocked.
    band_suitability: 7.0+
    register: neutral
  - term: blood, sweat and tears
    meaning: a lot of effort and hard work
    example: The work required a lot of blood, sweat and tears, but it was worth it.
    band_suitability: 7.0+
    register: neutral
  - term: at sixes and sevens
    meaning: in a state of confusion or disarray
    example: The whole team's been at sixes and sevens since Kay resigned.
    band_suitability: 8.0+
    register: neutral
  - term: all fingers and thumbs
    meaning: awkward and clumsy; unable to hold things properly
    example: I keep dropping things today - I'm all fingers and thumbs.
    band_suitability: 8.0+
    register: informal
  - term: It takes two to tango
    meaning: both people involved in a difficult situation are equally responsible
      for it
    example: It takes two to tango.
    band_suitability: 7.0+
    register: neutral
  - term: It never rains but it pours
    meaning: bad things always happen together or in large numbers
    example: Three big bills at the same time? It never rains but it pours!
    band_suitability: 7.0+
    register: neutral
  - term: Every cloud has a silver lining
    meaning: every difficult situation has a hopeful or comforting aspect
    example: At least we can spend more time together. They do say every cloud has
      a silver lining.
    band_suitability: 7.0+
    register: neutral
  - term: Rome wasn't built in a day
    meaning: important things take time to achieve
    example: Take your time and don't be impatient. Rome wasn't built in a day!
    band_suitability: 7.0+
    register: neutral
  - term: Necessity is the mother of invention
    meaning: difficult situations inspire creative solutions
    example: It was a case of necessity is the mother of invention.
    band_suitability: 8.0+
    register: neutral
  - term: Variety is the spice of life
    meaning: doing a lot of different things makes life more interesting
    example: Still, they say that variety is the spice of life!
    band_suitability: 7.0+
    register: neutral
  - term: No pain, no gain
    meaning: you must suffer or work hard in order to achieve success
    example: It was very hard work but no pain, no gain.
    band_suitability: 7.0+
    register: informal
  - term: Better to be safe than sorry
    meaning: it is wiser to be cautious than to take risks and regret it
    example: Better to be safe than sorry.
    band_suitability: 7.0+
    register: neutral
  - term: First come, first served
    meaning: the first people to arrive will get the service or items available
    example: It's first come, first served.
    band_suitability: 7.0+
    register: neutral
  - term: Mum's the word
    meaning: keep this a secret; do not tell anyone
    example: No, I promise. Mum's the word.
    band_suitability: 7.0+
    register: informal
  - term: Give me a break
    meaning: stop treating me so severely or complaining
    example: That's not fair! Give me a break!
    band_suitability: 7.0+
    register: informal
  - term: Get your skates on
    meaning: hurry up
    example: Get your skates on! We need to leave in five minutes.
    band_suitability: 8.0+
    register: informal
  - term: Good riddance
    meaning: an expression of relief about someone or something leaving
    example: Not at all. Good riddance!
    band_suitability: 7.0+
    register: informal
  - term: Take it easy
    meaning: calm down; don't panic
    example: Take it easy! Don't panic!
    band_suitability: 6.0+
    register: informal
  - term: So far, so good
    meaning: things have gone well up to this point
    example: So far, so good. But it's early days yet.
    band_suitability: 7.0+
    register: neutral
  - term: Truth will out
    meaning: the truth will eventually be discovered or revealed
    example: I don't know but I'm sure we'll find out. Truth will out.
    band_suitability: 8.0+
    register: formal
  - term: Any friend of yours is a friend of mine
    meaning: I will like someone because they are a friend of someone I already like
    example: Of course. Any friend of yours is a friend of mine.
    band_suitability: 7.0+
    register: neutral
  - term: Beauty is only skin deep
    meaning: physical beauty does not indicate a good personality or character
    example: Well, beauty is only skin deep, remember.
    band_suitability: 7.0+
    register: neutral
  - term: Money is the root of all evil
    meaning: greed for money is the cause of most wrongdoings
    example: Money is the root of all evil.
    band_suitability: 7.0+
    register: neutral
  - term: on an ad hoc basis
    meaning: when necessary; without prior planning
    example: We don't receive many complaints, so we just deal with them on an ad
      hoc basis.
    band_suitability: 8.0+
    register: formal
  - term: de facto
    meaning: in fact, whether officially established or not
    example: They are now the de facto government.
    band_suitability: 8.0+
    register: formal
  - term: non sequitur
    meaning: a conclusion or statement that does not logically follow from the previous
      argument
    example: This sentence in your essay is a non sequitur.
    band_suitability: 8.0+
    register: formal
  - term: ad infinitum
    meaning: endlessly; forever
    example: I could go on ad infinitum about the advantages of moving to the countryside.
    band_suitability: 8.0+
    register: formal
  - term: status quo
    meaning: the existing state of affairs
    example: Whenever a new person takes over as manager, they disturb the status
      quo.
    band_suitability: 8.0+
    register: formal
  - term: compos mentis
    meaning: sane and in control of one's mind and actions
    example: His lawyer claims he wasn't fully compos mentis when he admitted he was
      guilty.
    band_suitability: 8.0+
    register: formal
  - term: fait accompli
    meaning: a thing that has already been decided or done and cannot be changed
    example: The reform was presented as a fait accompli.
    band_suitability: 8.0+
    register: formal
  - term: au fait
    meaning: familiar with or knowledgeable about something
    example: All players must be au fait with the rules of the game.
    band_suitability: 8.0+
    register: formal
  - term: c'est la vie
    meaning: that's life; such is life (used to accept a frustrating situation)
    example: Oh well, c'est la vie.
    band_suitability: 7.0+
    register: neutral
  - term: bête noire
    meaning: a person or thing one particularly dislikes or avoids
    example: Awards ceremonies are my bête noire.
    band_suitability: 8.0+
    register: formal
  - term: plus ça change
    meaning: the more things change, the more they stay the same
    example: So Dan has been arguing with his boss again. Plus ça change!
    band_suitability: 8.0+
    register: neutral
  - term: laissez-faire
    meaning: a policy of letting things take their own course; non-interventionist
    example: A laissez-faire attitude to behaviour.
    band_suitability: 8.0+
    register: formal
