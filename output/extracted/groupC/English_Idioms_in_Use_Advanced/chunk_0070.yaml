vocabulary_entry:
  topic_tags:
  - life
  - death
  - mind
  - difficulties
  - challenges
  - personality
  category: idiom
  source_citation: English Idioms in Use Advanced, Units 55-58
  entries:
  - term: within an inch of one's life
    meaning: very close to death or experiencing something to an extreme degree
    example: We were within an inch of our lives when the lightning struck the tree
      beside us.
    band_suitability: 8.0+
    register: informal
  - term: risk life and limb
    meaning: to take a big risk with your physical safety or life
    example: I don't like cycling to work. I feel like I'm risking life and limb in
      all that traffic.
    band_suitability: 7.0+
    register: neutral
  - term: a new lease of life
    meaning: an occasion when you become more energetic and active than before
    example: The operation has given my grandmother a new lease of life.
    band_suitability: 7.0+
    register: neutral
  - term: live to tell the tale
    meaning: to successfully deal with a difficult situation and survive to talk about
      it
    example: Taking your final exams won't be easy, but I'm sure you 'll live to tell
      the tale.
    band_suitability: 7.0+
    register: neutral
  - term: the shock of one's life
    meaning: a very great and sudden surprise
    example: Clare got the shock of her life when she saw the police officer at her
      door.
    band_suitability: 7.0+
    register: informal
  - term: live out of a suitcase
    meaning: to stay living in temporary places with only the clothes in your bags
    example: Some people find living out of a suitcase away from home very stressful.
    band_suitability: 7.0+
    register: neutral
  - term: live on borrowed time
    meaning: surviving past the time when you should have died or when something should
      have ended
    example: The company chairman is living on borrowed time after the latest fall
      in profits.
    band_suitability: 8.0+
    register: neutral
  - term: the life and soul of the party
    meaning: someone who is energetic and the center of attention in social gatherings
    example: Lewis is really shy and isn't usually the life and soul of the party.
    band_suitability: 7.0+
    register: neutral
  - term: live a lie
    meaning: to live in a way that deceives people about who you are or what you feel
    example: You'll be living a lie if you don't tell him you were once in prison.
    band_suitability: 7.0+
    register: neutral
  - term: live and let live
    meaning: used for saying that people should accept other people's faults or different
      ways of living
    example: In this life, we have to live and let live.
    band_suitability: 7.0+
    register: neutral
  - term: live a charmed life
    meaning: to be very lucky and avoid danger or failure continually
    example: Not many people have lived such a charmed life as Ed has.
    band_suitability: 8.0+
    register: neutral
  - term: have the time of one's life
    meaning: to enjoy oneself immensely
    example: We had the time of our lives in California last year.
    band_suitability: 6.0+
    register: neutral
  - term: scare the life out of someone
    meaning: to frighten someone very much
    example: The sudden scream scared the life out of me.
    band_suitability: 7.0+
    register: informal
  - term: live in a dream world
    meaning: to have ideas that are not realistic or practical
    example: Jess thinks she'll have a career as a model, but she's living in a dream
      world in my opinion.
    band_suitability: 7.0+
    register: neutral
  - term: dead wood
    meaning: people or things that are no longer useful or needed
    example: There is a lot of dead wood in my office. They should sack some people.
    band_suitability: 8.0+
    register: neutral
  - term: the kiss of death
    meaning: an event or action that causes something to fail
    example: Putting Joshua in charge was the kiss of death to the project.
    band_suitability: 8.0+
    register: neutral
  - term: as dead as a dodo
    meaning: completely dead or no longer relevant/fashionable
    example: His idea of building a plane and flying round the world is as dead as
      a dodo.
    band_suitability: 8.0+
    register: informal
  - term: dead and buried
    meaning: completely finished and forgotten
    example: The old family quarrel is now dead and buried, and they live in harmony.
    band_suitability: 7.0+
    register: neutral
  - term: a death blow
    meaning: an action or event that destroys something completely
    example: The planning committee's decision was a death blow to the proposal to
      build the new airport.
    band_suitability: 8.0+
    register: neutral
  - term: a dead duck
    meaning: a plan, scheme, or idea that has failed or has no hope of success
    example: That project is a dead duck after we lost our main sponsor.
    band_suitability: 8.0+
    register: informal
  - term: dead to the world
    meaning: fast asleep
    example: After working a 12-hour shift, he was dead to the world.
    band_suitability: 7.0+
    register: informal
  - term: dead in the water
    meaning: having stopped making progress and with no chance of success
    example: Without more funding, the new venture is dead in the water.
    band_suitability: 8.0+
    register: neutral
  - term: at death's door
    meaning: very ill and close to death
    example: He had a terrible cold and felt like he was at death's door.
    band_suitability: 7.0+
    register: informal
  - term: in the dead of night
    meaning: during the middle of the night when it is dark and quiet
    example: The thieves stole the painting in the dead of night.
    band_suitability: 7.0+
    register: neutral
  - term: a matter of life and death
    meaning: extremely important and serious
    example: You should only call an ambulance if it is a matter of life and death.
    band_suitability: 6.0+
    register: neutral
  - term: sick to death of
    meaning: annoyed or bored with something/someone; very tired of
    example: I am sick to death of people complaining all the time.
    band_suitability: 7.0+
    register: informal
  - term: a death trap
    meaning: a place or vehicle that is very dangerous and likely to cause accidents
      or death
    example: That old car is so dangerous. It's a death trap.
    band_suitability: 7.0+
    register: informal
  - term: a fate worse than death
    meaning: a situation that is extremely unpleasant and distressing
    example: Having to sit next to my boring uncle at the restaurant was a fate worse
      than death.
    band_suitability: 8.0+
    register: informal
  - term: a living death
    meaning: a life that is extremely unpleasant, boring, or unhappy
    example: Many people suffered a living death in prison camps during the civil
      war.
    band_suitability: 8.0+
    register: neutral
  - term: over my dead body
    meaning: used to emphasize that you will strongly oppose something
    example: The council are planning to demolish my house to build a motorway. Over
      my dead body!
    band_suitability: 7.0+
    register: informal
  - term: in one's right mind
    meaning: sane and thinking clearly
    example: Nobody in their right mind would lend him money again.
    band_suitability: 7.0+
    register: neutral
  - term: a one-track mind
    meaning: a mind that is focused on only one subject
    example: He's always talking about cars. I've never met anyone with such a one-track
      mind.
    band_suitability: 8.0+
    register: neutral
  - term: take someone's mind off something
    meaning: to make someone stop thinking about something unpleasant or worrying
    example: What can we do to take Marco's mind off his problems?
    band_suitability: 6.0+
    register: neutral
  - term: cast one's mind back
    meaning: to try to remember something that happened in the past
    example: I'd like you all to cast your mind back to your very first day at school.
    band_suitability: 7.0+
    register: neutral
  - term: mind how you go
    meaning: take care / be careful (often used as a goodbye)
    example: Bye. Mind how you go!
    band_suitability: 7.0+
    register: informal
  - term: mind your own business
    meaning: do not interfere in other people's private affairs
    example: Mind your own business!
    band_suitability: 6.0+
    register: informal
  - term: bored out of one's mind
    meaning: extremely bored
    example: I'm bored out of my mind.
    band_suitability: 6.0+
    register: informal
  - term: out of one's mind
    meaning: crazy, foolish, or irrational
    example: You must be out of your mind!
    band_suitability: 7.0+
    register: informal
  - term: prey on someone's mind
    meaning: to make someone worry constantly
    example: No, it's been preying on my mind all day.
    band_suitability: 8.0+
    register: neutral
  - term: read someone's mind
    meaning: to know what someone is thinking
    example: My twin brother can read my mind.
    band_suitability: 6.0+
    register: neutral
  - term: mind over matter
    meaning: the use of willpower to control physical reactions or difficulties
    example: Come on - mind over matter!
    band_suitability: 7.0+
    register: neutral
  - term: blow someone's mind
    meaning: to be extremely impressive or overwhelming
    example: The actor's performance blew my mind!
    band_suitability: 7.0+
    register: informal
  - term: mind your step
    meaning: to be careful about what you do or say; watch where you are walking
    example: Mind your step on the ice - it's very slippery.
    band_suitability: 7.0+
    register: neutral
  - term: mind your Ps and Qs
    meaning: to be polite and show good manners
    example: It goes without saying that you should always mind your Ps and Qs at
      an interview.
    band_suitability: 8.0+
    register: neutral
  - term: put your mind to something
    meaning: to direct all your attention and effort toward achieving something
    example: You 'll find it quite easy to learn the guitar if you put your mind to
      it.
    band_suitability: 7.0+
    register: neutral
  - term: give someone the hard sell
    meaning: to try to persuade someone to buy something in a very aggressive and
      forceful way
    example: I hate it when people try to give you the hard sell over the phone.
    band_suitability: 8.0+
    register: neutral
  - term: hit someone hard
    meaning: to affect someone very severely or adversely
    example: Her grandfather's illness has really hit her very hard.
    band_suitability: 7.0+
    register: neutral
  - term: no hard feelings
    meaning: used to say that you are not angry with someone despite a disagreement
    example: I'm so glad we're friends again. No hard feelings, OK?
    band_suitability: 6.0+
    register: neutral
  - term: hard going
    meaning: difficult and tiring to do
    example: Walking home in the heavy snow was really hard going.
    band_suitability: 7.0+
    register: neutral
  - term: hard to swallow
    meaning: difficult to believe or accept
    example: I find his constant criticism of me very hard to swallow.
    band_suitability: 7.0+
    register: neutral
  - term: fall on hard times
    meaning: to experience a period of financial difficulty and poverty
    example: Although Jack's grandfather used to be rich, he fell on hard times and
      the family lived in poverty.
    band_suitability: 8.0+
    register: neutral
  - term: hard-and-fast rules
    meaning: strict rules that cannot be altered or broken
    example: There are no hard-and-fast rules as to how you should behave in circumstances
      like these.
    band_suitability: 8.0+
    register: neutral
  - term: feel hard done by
    meaning: to feel that you have been treated unfairly
    example: I'm sure Lydia will feel hard done by when she discovers that her uncle
      has bought her twin sister a new sports car.
    band_suitability: 8.0+
    register: informal
  - term: learn the hard way
    meaning: to discover what is best through unpleasant experiences or mistakes
    example: Children eventually learn the hard way that life is not always fair.
    band_suitability: 7.0+
    register: neutral
  - term: a hard nut to crack
    meaning: a difficult problem to solve or a difficult person to understand/deal
      with
    example: I have no idea how we're going to solve this problem. It's going to be
      a hard nut to crack, I'm sure.
    band_suitability: 8.0+
    register: neutral
  - term: make hard work of something
    meaning: to make something seem much more difficult or take longer than necessary
    example: Ruby always complains and seems to make hard work of any little problem.
    band_suitability: 8.0+
    register: neutral
  - term: drive a hard bargain
    meaning: to be tough in negotiations to get the best possible deal
    example: You want me to reduce the price by £200? You certainly drive a hard bargain.
    band_suitability: 8.0+
    register: neutral
band_tiers:
- band_min: 5.0
  band_max: 6.0
  can_do_description: Auto-added
  grammar_required: []
  vocabulary_core: []
  sentence_length_target: short
sample_dialogues:
- band_level: 6.0
  turn_type: standalone
  ai_line: Can you tell me about this topic?
  user_model_answer: I often talk about this topic with my friends and family.
- band_level: 7.0
  turn_type: standalone
  ai_line: How has this changed over time?
  user_model_answer: Over the years it has changed because people moved to cities
    and lifestyles shifted significantly.
