  entries:
  - term: All's fair in love and war
    meaning: All behaviour is acceptable in extreme situations, especially in romantic
      situations and competitions
    example: 'A: Marta ended her relationship with Jakob, and the next day her friend
      Ellie met Jakob for a drink. B: All''s fair in love and war!'
    band_suitability: 7.0+
    register: neutral
  - term: It never rains but it pours
    meaning: Problems always happen together
    example: 'A: What a day! My car broke down and my wallet has been stolen. B: It
      never rains but it pours.'
    band_suitability: 7.0+
    register: neutral
  - term: It takes two to tango
    meaning: Two people are equally responsible for a situation or argument
    example: 'A: I wonder why Sylvia and Ben have broken up. B: Well, it takes two
      to tango.'
    band_suitability: 7.0+
    register: neutral
  - term: Rome wasn't built in a day
    meaning: It takes a long time to do important things properly
    example: I'm really impatient to finish decorating my flat, but Rome wasn't built
      in a day!
    band_suitability: 7.0+
    register: neutral
  - term: Better safe than sorry
    meaning: It is better not to take risks, even if it seems boring or hard work
    example: We should buy extra travel insurance for our skiing trip. Better safe
      than sorry.
    band_suitability: 6.0+
    register: neutral
  - term: No pain, no gain
    meaning: There must be some suffering or hard work in order to succeed
    example: I have to study hard and do a lot of exams to become an accountant, but
      no pain no gain.
    band_suitability: 6.0+
    register: neutral
  - term: First come, first served
    meaning: The first people to arrive will be the ones to get something
    example: We don't have enough tickets for everybody, so it's a case of first come,
      first served.
