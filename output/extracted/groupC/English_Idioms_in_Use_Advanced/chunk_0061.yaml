vocabulary_entry:
  topic_tags:
  - relationships
  - emotions
  - work
  - technology
  - lifestyle
  category: idiom
  source_citation: English Idioms in Use Advanced, Units 21-24
  entries:
  - term: star-crossed lovers
    meaning: lovers whose relationship is fated to be unfortunate or doomed
    example: The film is about two star-crossed lovers and their relationship.
    band_suitability: 7.0+
    register: neutral
  - term: eat someone out of house and home
    meaning: consume a lot of someone's food, especially when visiting them
    example: Max and his friends ate me out of house and home.
    band_suitability: 8.0+
    register: informal
  - term: make your hair stand on end
    meaning: make someone extremely frightened
    example: Harry's driving made my hair stand on end, but we arrived safely.
    band_suitability: 8.0+
    register: neutral
  - term: wild-goose chase
    meaning: a foolish and hopeless pursuit of something unattainable
    example: He set off on a wild-goose chase to find the buried treasure he'd read
      about.
    band_suitability: 7.0+
    register: neutral
  - term: in the twinkling of an eye
    meaning: extremely quickly; in an instant
    example: Masha prepared a delicious meal in the twinkling of an eye.
    band_suitability: 8.0+
    register: neutral
  - term: the green-eyed monster
    meaning: jealousy
    example: The green-eyed monster is responsible for many crimes of passion.
    band_suitability: 8.0+
    register: neutral
  - term: lay it on with a trowel
    meaning: exaggerate praise, criticism, or a story
    example: The reviewer didn't praise the play subtly- he laid it on with a trowel.
    band_suitability: 8.0+
    register: neutral
  - term: pound of flesh
    meaning: something owed but which it is unreasonable to demand
    example: People accuse the taxman of always making sure he gets his pound of flesh.
    band_suitability: 8.0+
    register: neutral
  - term: send someone packing
    meaning: tell someone firmly to go away
    example: I can't face any visitors, so if anyone comes to the door, just send
      them packing.
    band_suitability: 7.0+
    register: informal
  - term: Prince Charming
    meaning: an ideal, romantic man that a woman dreams of meeting
    example: My sister's getting married next week. I'm so happy she's found her Prince
      Charming.
    band_suitability: 6.0+
    register: neutral
  - term: Big Brother
    meaning: an authority figure or organization that tries to observe and control
      people
    example: The Internet service providers know exactly which websites we visit -
      Big Brother is watching us all the time.
    band_suitability: 7.0+
    register: neutral
  - term: Man Friday / Girl Friday
    meaning: a helpful and efficient personal assistant or general helper
    example: My life is totally chaotic. I need a Man Friday/ Girl Friday to help
      me with everything.
    band_suitability: 8.0+
    register: neutral
  - term: Aladdin's cave
    meaning: a place that is full of valuable or interesting objects
    example: The old cupboard was an Aladdin's cave of valuable objects.
    band_suitability: 8.0+
    register: neutral
  - term: Jekyll and Hyde
    meaning: someone who has two distinct personalities, one good and one bad
    example: Roberto is a real Jekyll and Hyde character. You can never predict how
      he's going to behave.
    band_suitability: 8.0+
    register: neutral
  - term: storm in a teacup
    meaning: a lot of unnecessary anger and worry about a matter that is not important
    example: Don't worry, it's just a storm in a teacup.
    band_suitability: 7.0+
    register: neutral
  - term: albatross around one's neck
    meaning: a heavy burden that is difficult to get rid of or a continuing problem
    example: He wants to borrow a lot of money to go travelling, but paying it back
      could become an albatross around his neck.
    band_suitability: 8.0+
    register: neutral
  - term: go the whole hog
    meaning: do something as thoroughly as possible; do it completely
    example: Why are you just getting a new fridge and cooker? Why not go the whole
      hog and get a new kitchen?
    band_suitability: 8.0+
    register: informal
  - term: castles in the air
    meaning: plans or hopes that have very little chance of happening
    example: He's always got some new money-making plan or scheme, but most of the
      time they're just castles in the air.
    band_suitability: 8.0+
    register: neutral
  - term: ships that pass in the night
    meaning: people who meet for a brief moment and then do not see each other again
    example: I met him ten years ago and then saw him again last year. We seem to
      be like ships that pass in the night.
    band_suitability: 8.0+
    register: neutral
  - term: ivory tower
    meaning: a lifestyle or place that is isolated from the ordinary and unpleasant
      realities of life
    example: Academics living in an ivory tower.
    band_suitability: 7.0+
    register: neutral
  - term: burn the candle at both ends
    meaning: work or play too hard without resting properly
    example: Florence seems to be burning the candle at both ends at the moment -
      going to parties every night and then getting up early to study.
    band_suitability: 7.0+
    register: neutral
  - term: teach your grandmother to suck eggs
    meaning: attempt to teach someone who is already more skilled or knowledgeable
      than you in that area
    example: Dev started telling the IT manager how to set up a spreadsheet. Talk
      about teaching your grandmother to suck eggs!
    band_suitability: 8.0+
    register: informal
  - term: you can't teach an old dog new tricks
    meaning: it is difficult to make someone change the way they have done things
      for a long time
    example: I keep forgetting that I can use online banking to pay my bills. You
      can't teach an old dog new tricks, I suppose.
    band_suitability: 6.0+
    register: neutral
  - term: set your sights on
    meaning: decide that you want something and try hard to get it
    example: Frida has set her sights on becoming CEO, and after her latest promotion,
      she's well on the way.
    band_suitability: 7.0+
    register: neutral
  - term: teach someone a lesson
    meaning: punish someone so that they will not behave badly again
    example: After his rude behaviour, Oli's mother decided to teach him a lesson
      and didn't let him play with his friends.
    band_suitability: 6.0+
    register: neutral
  - term: in leaps and bounds
    meaning: growing or increasing very rapidly
    example: Your work comes on in leaps and bounds.
    band_suitability: 7.0+
    register: neutral
  - term: stick in your mind
    meaning: be remembered easily and clearly
    example: Something sticks in your mind, you remember it.
    band_suitability: 6.0+
    register: neutral
  - term: go in one ear and out the other
    meaning: be heard and then immediately forgotten
    example: Something goes in one ear and out the other, you forget it very quickly.
    band_suitability: 7.0+
    register: neutral
  - term: work round the clock
    meaning: work continuously all day and all night
    example: If you work round the clock, you are working all the time.
    band_suitability: 7.0+
    register: neutral
  - term: a cog in the machine
    meaning: a small, unimportant person in a large organization or system
    example: I try my best to do my job well, but sometimes I feel as if I'm just
      a cog in the machine.
    band_suitability: 8.0+
    register: neutral
  - term: throw a spanner in the works
    meaning: do something that prevents a plan or activity from succeeding
    example: I don't want to throw a spanner in the works, but I think you should
      apply for official permission first.
    band_suitability: 8.0+
    register: neutral
  - term: reinvent the wheel
    meaning: waste time trying to create something that has already been created
    example: I worry sometimes that we're just reinventing the wheel in our research.
    band_suitability: 7.0+
    register: neutral
  - term: on the blink
    meaning: functioning improperly or broken (usually for machines)
    example: I'm afraid I couldn't print the document; our printer is on the blink.
    band_suitability: 7.0+
    register: informal
  - term: go haywire
    meaning: stop operating correctly; become chaotic or out of control
    example: There was a power failure and everything went haywire.
    band_suitability: 8.0+
    register: informal
  - term: it's not rocket science
    meaning: it is not very difficult to understand or do
    example: She should be able to write a simple text message. I mean, it's not rocket
      science, is it?
    band_suitability: 6.0+
    register: informal
  - term: light years away
    meaning: a very long time or distance away
    example: I think we're light years away from finding a cure for this terrible
      disease.
    band_suitability: 7.0+
    register: neutral
  - term: if it ain't broke, don't fix it
    meaning: leave something alone if it is working properly, so as not to cause problems
    example: Why change the system? If it ain't broke, don't fix it!
    band_suitability: 6.0+
    register: informal
  - term: cutting-edge
    meaning: the most modern and advanced stage of development
    example: My school was new. We had all kinds of cutting-edge technology.
    band_suitability: 7.0+
    register: neutral
  - term: set the wheels in motion
    meaning: start a process or series of events happening
    example: The city council set the wheels in motion for the construction of the
      new park.
    band_suitability: 8.0+
    register: neutral
band_tiers:
- band_min: 5.0
  band_max: 6.0
  can_do_description: Auto-added
  grammar_required: []
  vocabulary_core: []
  sentence_length_target: short
sample_dialogues:
- band_level: 6.0
  turn_type: standalone
  ai_line: Can you tell me about this topic?
  user_model_answer: I often talk about this topic with my friends and family.
- band_level: 7.0
  turn_type: standalone
  ai_line: How has this changed over time?
  user_model_answer: Over the years it has changed because people moved to cities
    and lifestyles shifted significantly.
