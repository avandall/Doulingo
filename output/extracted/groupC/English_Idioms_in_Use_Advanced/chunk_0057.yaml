  entries:
  - term: be blown away by
    meaning: to be extremely impressed and amazed by something
    example: If you are blown away by a performance, you are amazed and impressed
      because it is so good.
    band_suitability: 7.0+
    register: informal
  - term: be on the same wavelength
    meaning: to share the same ideas, opinions, and way of thinking
    example: If two people are on the same wavelength, they think in the same way.
    band_suitability: 7.0+
    register: neutral
  - term: fringe benefits
    meaning: extra benefits given with a job in addition to pay
    example: Fringe benefits are extra benefits you get with a job apart from your
      pay.
    band_suitability: 7.0+
    register: formal
  - term: part and parcel
    meaning: an essential and unavoidable part of a situation or job
    example: Learning how to manage your finances is part and parcel of becoming an
      adult.
    band_suitability: 8.0+
    register: neutral
  - term: get your act together
    meaning: to organize yourself and resolve your problems to improve your behavior
      or situation
    example: It's time you got your act together and found a job!
    band_suitability: 7.0+
    register: informal
  - term: money is burning a hole in your pocket
    meaning: an intense urge to spend money as soon as you get it
    example: The money was burning a hole in my pocket.
    band_suitability: 8.0+
    register: informal
  - term: see eye to eye
    meaning: to agree fully with someone
    example: Her two brothers don't see eye to eye and haven't spoken to each other
      for over a year.
    band_suitability: 7.0+
    register: neutral
  - term: sit on the fence
    meaning: to avoid making a decision or taking a side in an argument
    example: The president refused to make a decision and was accused of sitting on
      the fence.
    band_suitability: 8.0+
    register: neutral
  - term: back to square one
    meaning: having to start a process or project all over again from the beginning
    example: My computer crashed, so I'm back to square one with my assignment.
    band_suitability: 7.0+
    register: neutral
  - term: in hard cash
    meaning: in coins and banknotes rather than cards or checks
    example: You have to pay the deposit for hiring the boat in hard cash.
    band_suitability: 7.0+
    register: neutral
  - term: fight like cat and dog
    meaning: to argue fiercely and continuously with each other
    example: Rhiannon and her sister have always fought like cats and dogs.
    band_suitability: 7.0+
    register: informal
  - term: donkey work
    meaning: the hard, boring, and routine parts of a job or task
    example: There's a lot of donkey work to be done before we can open the new restaurant.
    band_suitability: 8.0+
    register: neutral
  - term: the icing on the cake
    meaning: something that makes a good situation even better
    example: Having such perfect weather on holiday was the icing on the cake.
    band_suitability: 7.0+
    register: neutral
  - term: take the cake
    meaning: to be the most remarkable, extreme, or annoying thing to happen
    example: Having to stay late at work on a holiday weekend really took the cake.
    band_suitability: 8.0+
    register: informal
  - term: look like the cat that ate the canary
    meaning: to look extremely pleased and proud of oneself, often secretively
    example: What's happened? You look like the cat that ate the canary.
    band_suitability: 8.0+
    register: informal
  - term: go the extra mile
    meaning: to make a special extra effort to achieve something or help someone
    example: You have to be prepared to go the extra mile if you want to get promoted.
    band_suitability: 7.0+
    register: neutral
  - term: do what it says on the tin
    meaning: to function or behave exactly as expected or promised
    example: This shampoo is great - it does exactly what it says on the tin.
    band_suitability: 8.0+
    register: informal
  - term: the flatmate from hell
    meaning: an exceptionally terrible, difficult, or annoying person to live with
    example: I'd never share an apartment with her - she'd be the flatmate from hell.
    band_suitability: 8.0+
    register: informal
  - term: whatever floats your boat
    meaning: do whatever makes you happy or suits your personal preferences
