vocabulary_entry:
  topic_tags:
  - idioms
  - expressions
  - general communication
  category: idiom
  source_citation: English Idioms in Use Advanced, Units 51-54
  entries:
  - term: all-singing, all-dancing
    meaning: having the most modern and impressive features
    example: ''
    band_suitability: 8.0+
    register: informal
  - term: to cap it all
    meaning: used to add a final, usually worse, event or remark to a series of events
    example: I'm exhausted, and to cap it all I've got three exams on the same day
      this week!
    band_suitability: 8.0+
    register: neutral
  - term: in all but name
    meaning: being the thing mentioned in fact, even if not officially
    example: ''
    band_suitability: 8.0+
    register: neutral
  - term: all things to all people
    meaning: trying to please everyone, which is usually impossible
    example: ''
    band_suitability: 8.0+
    register: neutral
  - term: an all-time low
    meaning: the lowest level or number that has ever been reached
    example: ''
    band_suitability: 7.0+
    register: neutral
  - term: all told
    meaning: in total; altogether
    example: I'm training to be a vet, and I've got ten exams, all told, to prepare
      for.
    band_suitability: 7.0+
    register: neutral
  - term: at all hours of the day and night
    meaning: very frequently or continually throughout the day and night
    example: It means I've been studying at all hours of the day and night.
    band_suitability: 7.0+
    register: neutral
  - term: all in good time
    meaning: used to tell someone to be patient because something will happen eventually
    example: I just want to relax and go on holiday, but all in good time - I'll be
      finished next month.
    band_suitability: 7.0+
    register: neutral
  - term: that's someone all over
    meaning: that is typical of someone's behavior
    example: I told my friend I was feeling stressed, but he just laughed - that's
      him all over.
    band_suitability: 8.0+
    register: informal
  - term: all smiles
    meaning: looking very happy and cheerful
    example: even when he's worried or anxious he's all smiles.
    band_suitability: 7.0+
    register: neutral
  - term: there's no such thing as a free lunch
    meaning: you cannot get something for nothing; everything has a cost
    example: There's no such thing as a free lunch!
    band_suitability: 7.0+
    register: neutral
  - term: no time like the present
    meaning: now is the best time to do something rather than waiting
    example: No time like the present!
    band_suitability: 6.0+
    register: neutral
  - term: no strings attached
    meaning: without any special conditions or limitations
    example: He said he would lend me €2,000 with no strings attached.
    band_suitability: 7.0+
    register: neutral
  - term: no ifs and buts
    meaning: no excuses or arguments allowed
    example: Go at once - no ifs and buts!
    band_suitability: 7.0+
    register: informal
  - term: spend like there's no tomorrow
    meaning: spend money quickly and recklessly in large amounts
    example: She loves going shopping and spending like there was no tomorrow.
    band_suitability: 8.0+
    register: informal
  - term: in no uncertain terms
    meaning: very clearly and directly
    example: We were told in no uncertain terms that we must always be punctual for
      work.
    band_suitability: 8.0+
    register: formal
  - term: no spring chicken
    meaning: no longer young
    example: He's a very good squash player, even though he's no spring chicken.
    band_suitability: 8.0+
    register: informal
  - term: no end of something
    meaning: a very large amount or number of something
    example: The new housing development caused no end of problems.
    band_suitability: 7.0+
    register: neutral
  - term: no prizes for guessing
    meaning: used to say that something is very obvious
    example: No prizes for guessing who won the cookery competition.
    band_suitability: 7.0+
    register: neutral
  - term: in next to no time
    meaning: very quickly; almost immediately
    example: The journey was very easy, and we got to our destination in next to no
      time.
    band_suitability: 7.0+
    register: neutral
  - term: no-go area
    meaning: an area that is dangerous or restricted to enter
    example: The police have declared the zone a no-go area.
    band_suitability: 7.0+
    register: neutral
  - term: hand it to someone
    meaning: acknowledge or give credit to someone's skill or success
    example: ''
    band_suitability: 7.0+
    register: neutral
  - term: the upper hand
    meaning: the advantage or control in a situation
    example: ''
    band_suitability: 7.0+
    register: neutral
  - term: hands down
    meaning: easily and decisively
    example: ''
    band_suitability: 7.0+
    register: neutral
  - term: old hand
    meaning: a person with a lot of experience in something
    example: ''
    band_suitability: 7.0+
    register: neutral
  - term: show one's hand
    meaning: reveal one's intentions or plans
    example: By publishing their tax plans a year before the election, the opposition
      have shown their hand too early.
    band_suitability: 8.0+
    register: neutral
  - term: play right into the hands of someone
    meaning: do something that accidentally helps one's opponent or critic
    example: Mr Mills has played right into the hands of his critics by admitting
      that he made errors in the past.
    band_suitability: 8.0+
    register: neutral
  - term: count on the fingers of one hand
    meaning: very rare or few in number
    example: You can count on the fingers of one hand the number of times this government
      has done anything to help the poor.
    band_suitability: 8.0+
    register: neutral
  - term: hands are tied
    meaning: unable to act because of rules, laws, or circumstances
    example: The minister claimed that her hands were tied by European regulations.
    band_suitability: 7.0+
    register: neutral
  - term: out of hand
    meaning: immediately and without thinking or discussing it further
    example: The minister of education rejected out of hand the claim that small schools
      would be closed.
    band_suitability: 8.0+
    register: neutral
  - term: give someone a big hand
    meaning: applaud someone enthusiastically
    example: Please give her a big hand.
    band_suitability: 6.0+
    register: neutral
  - term: lay one's hands on something
    meaning: manage to find or obtain something
    example: I know I have one somewhere, but I can't lay my hands on it at the moment.
    band_suitability: 7.0+
    register: neutral
  - term: sit on one's hands
    meaning: fail to take action when action is needed
    example: I think we should all act and do something, not just sit on our hands.
    band_suitability: 8.0+
    register: neutral
  - term: hand over the reins
    meaning: transfer control or power to someone else
    example: I'm ready to hand over the reins to someone else.
    band_suitability: 8.0+
    register: neutral
  - term: hand on heart
    meaning: honestly and sincerely
    example: Hand on heart, have you never told a lie?
    band_suitability: 8.0+
    register: neutral
  - term: a heart of gold
    meaning: a very kind and generous nature
    example: ''
    band_suitability: 7.0+
    register: neutral
  - term: in one's heart of hearts
    meaning: deep down; in one's true inner feelings
    example: The problem is that in my heart of hearts, I really don't want it.
    band_suitability: 8.0+
    register: neutral
  - term: heart's desire
    meaning: what one wants more than anything else
    example: It's always been my heart's desire to leave this city and work abroad.
    band_suitability: 8.0+
    register: neutral
  - term: not have the heart to do something
    meaning: lack the cruelty or firmness to do something that will upset someone
    example: I don't have the heart to tell my family this, as I know they'll be upset.
    band_suitability: 7.0+
    register: neutral
  - term: take heart
    meaning: feel encouraged or hopeful
    example: I know you will tell me to take heart and be strong.
    band_suitability: 7.0+
    register: neutral
  - term: have someone's best interests at heart
    meaning: care about someone's welfare and want the best for them
    example: I know they have my best interests at heart.
    band_suitability: 7.0+
    register: neutral
  - term: have a heart
    meaning: be merciful or kind
    example: Don't expect so much of him - he's only four! Have a heart!
    band_suitability: 7.0+
    register: informal
  - term: wear your heart on your sleeve
    meaning: make your feelings and emotions obvious to others
    example: You'll only get hurt if you wear your heart on your sleeve.
    band_suitability: 8.0+
    register: neutral
  - term: someone's heart is in their boots
    meaning: someone is feeling extremely depressed, anxious, or fearful
    example: His heart was in his boots as he thought about the difficult week ahead.
    band_suitability: 8.0+
    register: neutral
  - term: someone's heart is not in it
    meaning: someone lacks enthusiasm or interest in what they are doing
    example: She could tell that his heart was not in it.
    band_suitability: 7.0+
    register: neutral
