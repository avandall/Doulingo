vocabulary_entry:
  topic_tags:
  - modern_idioms
  - communication
  - opinions
  - preferences
  category: idiom
  source_citation: English Idioms in Use Advanced, Unit 8
  entries:
  - term: first lady of [something]
    meaning: the most prominent or highly skilled person in a particular field
    example: Is Madonna still the first lady of pop?
    band_suitability: 7.0+
    register: neutral
  - term: '[someone/something] from hell'
    meaning: a very difficult or unpleasant person or situation
    example: This programme looks at one couple's experience of living next to neighbours
      from hell.
    band_suitability: 7.0+
    register: casual
  - term: fall off the radar
    meaning: to be forgotten or stop being noticed
    example: That young politician was in the news every day for weeks, but now he
      seems to have fallen off the radar.
    band_suitability: 7.0+
    register: neutral
  - term: go the extra mile
    meaning: make an extra big effort or do more than is strictly necessary
    example: Sofia is a wonderful nurse. She'll always go the extra mile for her patients.
    band_suitability: 6.0+
    register: neutral
  - term: does exactly what it says on the tin
    meaning: does exactly what it claims to do
    example: The website www.cheapholidays.org does exactly what it says on the tin.
    band_suitability: 8.0+
    register: casual
  - term: nailing jelly to a wall
    meaning: very difficult to understand or describe because it is not clear or focused
    example: Finding out what really happened is like nailing jelly to a wall.
    band_suitability: 8.0+
    register: casual
  - term: be cool with [something]
    meaning: to be happy or satisfied with a suggestion
    example: I'm cool with that.
    band_suitability: 6.0+
    register: casual
  - term: not float my boat
    meaning: I don't like or I'm not interested in something
    example: It doesn't float my boat!
    band_suitability: 7.0+
    register: casual
  - term: big time
    meaning: to a very great degree; extremely
    example: I'm fed up with him big time.
    band_suitability: 6.0+
    register: casual
  - term: Too much information!
    meaning: used when someone tells you things that are too personal/unpleasant
    example: Too much information!
    band_suitability: 6.0+
    register: casual
  - term: Don't even go there!
    meaning: used to tell someone not to talk about a specific subject
    example: If a friend starts talking about a subject you do not want to discuss,
      you could respond 'Don't even go there!'
    band_suitability: 7.0+
    register: casual
