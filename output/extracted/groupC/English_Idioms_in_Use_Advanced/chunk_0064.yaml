vocabulary_entry:
  topic_tags:
  - society
  - politics
  - lifestyle
  - travel
  - happiness
  - emotions
  - anger
  category: idiom
  source_citation: English Idioms in Use Advanced, Units 33-36
  entries:
  - term: lose touch with the grass roots
    meaning: become isolated from ordinary people and their opinions
    example: Politicians often lose touch with the grass roots and become isolated
      from the public.
    band_suitability: 7.0+
    register: neutral
  - term: the silent majority
    meaning: the large number of people in a society who do not express their opinions
      publicly
    example: It's time the silent majority was heard, instead of the more vocal and
      aggressive minority.
    band_suitability: 7.0+
    register: neutral
  - term: a self-made man
    meaning: someone who has made themselves rich and successful without help from
      anyone else
    example: My father was a self-made man. He came from a poor background and worked
      his way up until he became quite rich.
    band_suitability: 6.0+
    register: neutral
  - term: the chattering classes
    meaning: educated people who enjoy discussing social, political and cultural issues
    example: I'm sick of listening to the opinions of the chattering classes. What
      about the opinions of ordinary people?
    band_suitability: 8.0+
    register: informal
  - term: a second-class citizen
    meaning: a person who is treated as being less important than other people
    example: If you are poor, you may sometimes think you are a second-class citizen
      in terms of access to university.
    band_suitability: 7.0+
    register: neutral
  - term: the gravy train
    meaning: ways of making money quickly, easily and often dishonestly, usually through
      your position in society
    example: The gravy train refers to ways of making money quickly, easily and often
      dishonestly, usually through your position in society.
    band_suitability: 8.0+
    register: informal
  - term: the power behind the throne
    meaning: a person who does not have an official position of power, but who secretly
      controls a group or situation
    example: Although Ollie receives all the media attention, his mother is the power
      behind the throne.
    band_suitability: 8.0+
    register: neutral
  - term: win by a landslide
    meaning: win an election by a very large number of votes
    example: In the election, the Green candidate won by a landslide.
    band_suitability: 7.0+
    register: neutral
  - term: movers and shakers
    meaning: people with a lot of power and influence
    example: Journalists need to establish good contacts with the movers and shakers.
    band_suitability: 7.0+
    register: neutral
  - term: creature comforts
    meaning: all the things that make life comfortable, such as good food, a soft
      bed, heating, etc.
    example: When Sam first went travelling, he missed his creature comforts, like
      hot water and a soft bed.
    band_suitability: 7.0+
    register: neutral
  - term: go out on the town
    meaning: go to enjoy yourself in bars, clubs, theatres, etc. in a town or city
    example: He loved being able to go out on the town at night with new friends in
      different countries.
    band_suitability: 6.0+
    register: informal
  - term: eat a square meal
    meaning: eat a substantial, satisfying meal
    example: He had such an exciting time that he was usually too busy to eat a square
      meal.
    band_suitability: 7.0+
    register: neutral
  - term: on the hoof
    meaning: while doing other things; without stopping
    example: He just ate on the hoof from street markets.
    band_suitability: 8.0+
    register: informal
  - term: I don't know whether I'm coming or going
    meaning: be very busy and confused because you have too many things to do
    example: It's really busy! I don't know whether I'm coming or going!
    band_suitability: 7.0+
    register: informal
  - term: outstay your welcome
    meaning: spend so much time with someone that they want you to leave
    example: Well, I was at first, but now I'm fed up. They've outstayed their welcome.
    band_suitability: 7.0+
    register: neutral
  - term: on the house
    meaning: given free by a business (e.g. a restaurant or pub)
    example: It's OK. It's on the house.
    band_suitability: 6.0+
    register: neutral
  - term: give something a miss
    meaning: decide not to do something that you usually do or that you have been
      invited to do
    example: I was hoping to, but I'm afraid I'm going to have to give it a miss.
    band_suitability: 6.0+
    register: informal
  - term: pass the time of day
    meaning: say hello or exchange a few friendly words with someone
    example: Not really, we just pass the time of day sometimes.
    band_suitability: 7.0+
    register: neutral
  - term: take each day as it comes
    meaning: deal with things as they happen without planning too far ahead
    example: He's just trying to take each day as it comes.
    band_suitability: 6.0+
    register: neutral
  - term: a bad hair day
    meaning: a day when everything seems to go wrong
    example: Oh, nothing in particular. I'm just having a bad hair day.
    band_suitability: 6.0+
    register: informal
  - term: eat like a horse
    meaning: eat a lot
    example: Yes, he eats like a horse!
    band_suitability: 6.0+
    register: informal
  - term: hit the jackpot
    meaning: have a great success, especially by luck or suddenly making a lot of
      money
    example: The company's new line of sportswear has been incredibly popular, and
      they've made a lot of money. They really hit the jackpot this time.
    band_suitability: 7.0+
    register: informal
  - term: go with a swing
    meaning: be very lively and successful
    example: The end-of-term party really went with a swing. Everyone enjoyed themselves.
    band_suitability: 8.0+
    register: neutral
  - term: go down a treat
    meaning: be extremely popular or successful
    example: That apple pie you made went down a treat with our dinner guests.
    band_suitability: 8.0+
    register: informal
  - term: hit the spot
    meaning: be exactly what is needed
    example: We were freezing, so she gave us some hot chocolate to drink - it really
      hit the spot.
    band_suitability: 7.0+
    register: informal
  - term: enter into the spirit of
    meaning: join in an activity with enthusiasm and enjoyment
    example: Everyone was in a happy mood and entered into the spirit of the fancy-dress
      ball.
    band_suitability: 7.0+
    register: neutral
  - term: hit the right note
    meaning: say or do something that is suitable for a particular occasion and produces
      the reaction you want
    example: His lecture hit exactly the right note. Everyone enjoyed it and said
      it was very informative too.
    band_suitability: 8.0+
    register: neutral
  - term: stars in her eyes
    meaning: looking very happy and excited, especially because you are thinking about
      someone you love or are dreaming of becoming famous
    example: Shona has got stars in her eyes - she's joined a rock band and given
      up his job.
    band_suitability: 7.0+
    register: neutral
  - term: full of the joys of spring
    meaning: very happy and full of energy
    example: Iris is full of the joys of spring today!
    band_suitability: 7.0+
    register: neutral
  - term: be on a high
    meaning: feel very happy and excited, usually after a special event or achievement
    example: After winning the race, I was on a high for the rest of the day.
    band_suitability: 7.0+
    register: neutral
  - term: music to my ears
    meaning: news or information that makes you very happy to hear
    example: The decision to cancel the rugby match was music to my ears.
    band_suitability: 6.0+
    register: neutral
  - term: a dream come true
    meaning: something that you have wanted for a long time and that has now happened
    example: Meeting the president was a dream come true.
    band_suitability: 6.0+
    register: neutral
  - term: blow my mind
    meaning: astound, amaze or overwhelm someone
    example: Sam Bagg's new album blew my mind.
    band_suitability: 7.0+
    register: informal
  - term: happy-go-lucky
    meaning: cheerful and relaxed; not worrying about the future
    example: My sister is such a happy-go-lucky person.
    band_suitability: 6.0+
    register: neutral
  - term: as happy as Larry
    meaning: extremely happy and content
    example: He's as happy as Larry in his new job.
    band_suitability: 8.0+
    register: informal
  - term: to your heart's content
    meaning: as much as you want to
    example: You can play football to your heart's content when the exams are over,
      but now you must study!
    band_suitability: 7.0+
    register: neutral
  - term: cheap and cheerful
    meaning: cheap, but pleasant and attractive
    example: It's not a luxury hotel; it's cheap and cheerful.
    band_suitability: 7.0+
    register: neutral
  - term: over the moon
    meaning: very happy indeed
    example: I was over the moon when I heard the news!
    band_suitability: 6.0+
    register: informal
  - term: burst a blood vessel
    meaning: become extremely angry
    example: Dad almost burst a blood vessel when I told him I'd driven into his car.
    band_suitability: 8.0+
    register: informal
  - term: all hot and bothered
    meaning: feeling nervous, worried and slightly angry
    example: Lucy felt all hot and bothered after having to push her way onto the
      train.
    band_suitability: 7.0+
    register: informal
  - term: see red
    meaning: suddenly become extremely angry
    example: Dave saw red when he heard the boy speak so rudely to Maddie.
    band_suitability: 6.0+
    register: neutral
  - term: rattle someone's cage
    meaning: make someone angry or upset, or make them feel less confident
    example: You're in a bad temper today. What's rattled your cage?
    band_suitability: 8.0+
    register: informal
  - term: make someone's blood boil
    meaning: make someone extremely angry
    example: What Lily said to her mother really made my blood boil.
    band_suitability: 7.0+
    register: neutral
  - term: get someone's goat
    meaning: annoy or irritate someone very much
    example: It really gets my goat when you say such stupid things!
    band_suitability: 8.0+
    register: informal
  - term: a bundle of nerves
    meaning: extremely nervous or anxious
    example: I'm a bundle of nerves.
    band_suitability: 7.0+
    register: neutral
  - term: down in the dumps
    meaning: unhappy, depressed
    example: I feel down in the dumps today.
    band_suitability: 6.0+
    register: informal
  - term: a sinking feeling
    meaning: a feeling that something bad is going to happen
    example: I have a sinking feeling about this exam.
    band_suitability: 7.0+
    register: neutral
  - term: run out of patience
    meaning: lose patience; become unable to wait or tolerate something any longer
    example: I'm running out of patience with that incompetent company.
    band_suitability: 6.0+
    register: neutral
  - term: knock someone for six
    meaning: surprise and upset someone greatly
    example: The argument I had with my best friend has knocked me for six.
    band_suitability: 8.0+
    register: informal
  - term: wild horses couldn't make me
    meaning: nothing could persuade me to do something
    example: Wild horses couldn't make me apologise to Nick.
    band_suitability: 7.0+
    register: neutral
band_tiers:
