vocabulary_entry:
  topic_tags:
  - behavior
  - strategies
  - relationships
  - decision_making
  category: idiom
  source_citation: English Idioms in Use Advanced, Units 48-51
  entries:
  - term: play cat and mouse
    meaning: to act in a way that deceives someone into believing you will do one
      thing, while planning to do something else
    example: ''
    band_suitability: 8.0+
    register: neutral
  - term: play gooseberry
    meaning: to be an unwanted third person with a romantic couple
    example: I went to the cinema with Elena and her new boyfriend , but it was horrible
      playing gooseberry.
    band_suitability: 8.0+
    register: informal
  - term: play second fiddle
    meaning: to be in a subordinate position to someone else
    example: She's been an assistant manager for five years and is tired of playing
      second fiddle.
    band_suitability: 7.0+
    register: neutral
  - term: the name of the game
    meaning: the most important aspect of a particular situation or activity
    example: When you're looking for a new flat, location is the name of the game.
    band_suitability: 7.0+
    register: neutral
  - term: play for time
    meaning: to delay something in order to gain more time to make a decision or take
      action
    example: We're still not ready to decide, so we need to play for time and not
      sign the contract yet.
    band_suitability: 7.0+
    register: neutral
  - term: play it cool
    meaning: to hide your real feelings, especially by acting calm and relaxed
    example: When people ask how the interview went, just play it cool.
    band_suitability: 7.0+
    register: informal
  - term: play dirty
    meaning: to act dishonestly or unfairly in order to win or achieve something
    example: Some businesses play dirty just to make more money.
    band_suitability: 7.0+
    register: informal
  - term: play it safe
    meaning: to be careful and not take risks
    example: ''
    band_suitability: 6.0+
    register: neutral
  - term: raise your game
    meaning: to improve your performance or the quality of what you do
    example: ''
    band_suitability: 7.0+
    register: neutral
  - term: play someone for a fool
    meaning: to trick or deceive someone to make them look stupid
    example: I'm fed up with him playing me for a fool.
    band_suitability: 7.0+
    register: informal
  - term: half the battle
    meaning: a large part of achieving a goal or overcoming a difficulty
    example: Writers say that coming up with a good idea for a novel is half the battle.
    band_suitability: 7.0+
    register: neutral
  - term: meet someone halfway
    meaning: to compromise with someone
    example: I know it's hard to compromise but you should try to meet him halfway.
    band_suitability: 7.0+
    register: neutral
  - term: too clever by half
    meaning: too confident of your own intelligence in an annoying way
    example: I find her just too clever by half.
    band_suitability: 8.0+
    register: neutral
  - term: not know the half of it
    meaning: not know the full, usually difficult or unpleasant, extent of a situation
    example: No, he doesn't know the half of it.
    band_suitability: 7.0+
    register: neutral
  - term: two can play at that game
    meaning: said to warn someone that you will treat them as badly as they have treated
      you
    example: Two can play at that game.
    band_suitability: 7.0+
    register: informal
  - term: two of a kind
    meaning: two people with very similar characters, qualities, or opinions
    example: The director and department head are both very arrogant. They're two
      of a kind.
    band_suitability: 7.0+
    register: neutral
  - term: it takes two to tango
    meaning: said to emphasize that both people involved in a difficult situation
      are equally responsible for it
    example: When a couple breaks up, it is hardly ever the fault of just one person.
      It takes two to tango.
    band_suitability: 7.0+
    register: neutral
  - term: two heads are better than one
    meaning: two people can achieve more or solve a problem better together than working
      alone
    example: Lily, can you help me with this? Two heads are better than one.
    band_suitability: 6.0+
    register: neutral
  - term: two sides of the same coin
    meaning: two different aspects of the same thing or situation
    example: Einstein saw time and space as two sides of the same coin.
    band_suitability: 7.0+
    register: neutral
  - term: like two peas in a pod
    meaning: very similar to each other
    example: ''
    band_suitability: 7.0+
    register: neutral
  - term: know a thing or two
    meaning: to have a good practical understanding of a subject
    example: Richard knows a thing or two about finance.
    band_suitability: 7.0+
    register: neutral
  - term: bring someone down a peg or two
    meaning: to show someone that they are not as important or clever as they think
    example: Losing the race brought him down a peg or two.
    band_suitability: 8.0+
    register: neutral
  - term: cut both ways
    meaning: to have both good and bad effects or advantages and disadvantages
    example: 'Political power cuts both ways: it enables people to change things,
      but it tempts them to become corrupt too.'
    band_suitability: 8.0+
    register: neutral
  - term: two a penny
    meaning: very common and therefore of little value
    example: Satnav systems in cars are two a penny these days.
    band_suitability: 8.0+
    register: neutral
  - term: all systems go
    meaning: everything is ready for an activity or event to start
    example: The office never stops. It's all systems go from 8 am to 6 pm.
    band_suitability: 7.0+
    register: neutral
  - term: all told
    meaning: in total; when everything is considered
    example: There were 18 of us for dinner, all told.
    band_suitability: 7.0+
    register: neutral
  - term: all in good time
    meaning: used to tell someone to be patient because something will happen eventually
    example: Don't be in such a hurry to pass your driving test. All in good time!
    band_suitability: 7.0+
    register: neutral
  - term: for all someone cares
    meaning: used to show that you do not care about someone or something at all
    example: I could be homeless for all she cares.
    band_suitability: 7.0+
    register: neutral
  - term: the all-clear
    meaning: official permission to do something after a danger or problem has passed
    example: Stefan went out to celebrate getting the all-clear from his doctor.
    band_suitability: 7.0+
    register: neutral
  - term: at all hours
    meaning: frequently throughout the day and night
    example: Some parents allow their children to come home at all hours of the day
      and night.
    band_suitability: 6.0+
    register: neutral
  - term: that's someone all over
    meaning: that is typical of someone's behavior
    example: That's him all over!
    band_suitability: 7.0+
    register: informal
  - term: all smiles
    meaning: looking very happy and friendly
    example: My dad was really grumpy this morning, but he's all smiles now.
    band_suitability: 6.0+
    register: neutral
