  category: idiom
  source_citation: English Idioms in Use Advanced, Units 14-17
  entries:
  - term: cream of the cream
    meaning: the very best examples of people or things
    example: The expression is used to describe the very best examples of people or
      things.
    band_suitability: 8.0+
    register: formal
  - term: non sequitur
    meaning: a statement which does not follow on logically from what was previously
      said
    example: The expression is used to refer to a statement which does not follow
      on logically from what was previously said.
    band_suitability: 8.0+
    register: formal
  - term: a fait accompli
    meaning: a thing that has already happened or been decided before those affected
      hear about it, leaving no option but to accept
    example: If a deed is done, then it cannot be changed.
    band_suitability: 8.0+
    register: formal
  - term: give a wide berth
    meaning: stay away from someone or something
    example: I try to give the city centre a wide berth on Saturdays if I possibly
      can.
    band_suitability: 7.0+
    register: neutral
  - term: taken aback
    meaning: shocked or surprised, usually in a negative way
    example: Jaime's mother was taken aback by his decision to leave school.
    band_suitability: 7.0+
    register: neutral
  - term: go by the board
    meaning: be abandoned or rejected (of plans or ideas)
    example: Amy's plans to buy a new car went by the board when she lost her job.
    band_suitability: 8.0+
    register: neutral
  - term: on the rocks
    meaning: in a state of severe difficulty or likely to fail
    example: Their relationship has been on the rocks for some months.
    band_suitability: 7.0+
    register: neutral
  - term: run a tight ship
    meaning: manage an organization firmly and effectively
    example: Asim runs a tight ship.
    band_suitability: 7.0+
    register: neutral
  - term: in the wake of
    meaning: following or as a result of
    example: The cost of home insurance has risen in the wake of last summer's floods.
    band_suitability: 7.0+
    register: formal
  - term: high and dry
    meaning: in a helpless or abandoned position
    example: We were left high and dry when the babysitter didn't turn up.
    band_suitability: 7.0+
    register: neutral
  - term: weather the storm
    meaning: survive a difficult situation
    example: I know it's been hard for you, but I'm sure you'll weather the storm.
    band_suitability: 7.0+
    register: neutral
  - term: on the warpath
    meaning: very angry and ready to argue or fight
    example: The last thing he needed at the moment was an outraged husband on the
      warpath.
    band_suitability: 8.0+
    register: informal
  - term: drop a bombshell
    meaning: announce something shocking or unexpected
    example: 'Igor dropped a bombshell: he said he no longer wanted to be part of
      Ali''s plans.'
    band_suitability: 7.0+
    register: neutral
  - term: hang / hold fire
    meaning: delay making a decision or taking action
    example: Despite Ali's attempts to persuade him to hang/ hold fire on his decision...
    band_suitability: 8.0+
    register: neutral
  - term: beat a retreat
    meaning: run away or withdraw from a situation, especially because you are frightened
      or embarrassed
    example: '...was going to beat a retreat before it was too late.'
    band_suitability: 8.0+
    register: neutral
  - term: steal a march on
    meaning: gain an advantage over someone by acting before them
    example: Two weeks later Igor stole a march on Ali by launching his own on line
      gift-ordering company.
    band_suitability: 8.0+
    register: neutral
  - term: come out fighting
    meaning: respond vigorously to a challenge or criticism
    example: Ali was shell-shocked by this betrayal, but he soon came out fighting.
    band_suitability: 7.0+
    register: neutral
  - term: call to arms
    meaning: a summons or appeal to engage in a struggle or conflict
    example: He took Igor's behaviour as a call to arms and has persuaded a bank to
      lend him the money he needs.
    band_suitability: 8.0+
    register: neutral
  - term: baptism of fire
    meaning: a very difficult first experience of something
    example: Ali's introduction to the business world has certainly been a baptism
      of fire...
    band_suitability: 7.0+
    register: neutral
  - term: run the gauntlet
    meaning: face a difficult or dangerous series of problems or criticisms
    example: Freshers were obliged to run a gauntlet of computer software, insurance
      and Student Railcard salesmen.
    band_suitability: 8.0+
    register: neutral
  - term: a flash in the pan
    meaning: something that happened only once or lasted a short time and was not
      successful
    example: ''
    band_suitability: 7.0+
    register: neutral
  - term: shoot down in flames
    meaning: completely criticize or reject an idea or plan
    example: ''
    band_suitability: 8.0+
    register: neutral
  - term: a battle of wills
    meaning: a contest where two people try to force each other to do what they want
    example: ''
    band_suitability: 7.0+
    register: neutral
  - term: go off the rails
    meaning: start behaving in a way that is not socially acceptable or successful
    example: ''
    band_suitability: 7.0+
    register: neutral
  - term: run out of steam
    meaning: lose energy, enthusiasm, or momentum
    example: ''
    band_suitability: 7.0+
    register: neutral
  - term: do a U-turn
    meaning: change your opinion or policy completely
    example: ''
    band_suitability: 7.0+
    register: neutral
  - term: drive someone round the bend
    meaning: to annoy or irritate someone
    example: Be quiet! You're driving me round the bend!
    band_suitability: 7.0+
    register: informal
  - term: a back-seat driver
    meaning: a passenger who gives unwanted advice, or someone who tries to control
      a situation they are not responsible for
    example: Even though we have a new director, the old one still seems to be a back-seat
      driver in the company.
    band_suitability: 8.0+
    register: neutral
  - term: step on it
    meaning: drive faster or hurry up
    example: Step on it! We have to be there in five minutes!
    band_suitability: 7.0+
    register: informal
  - term: put the brakes on
    meaning: slow down or stop an activity
    example: The government has put the brakes on airport expansion because of climate
      change.
    band_suitability: 7.0+
    register: neutral
  - term: give the green light
    meaning: give permission for something to happen
    example: The architects have been given the green light to build a new bridge
      over the River Honda.
    band_suitability: 7.0+
    register: neutral
  - term: the cat's whiskers
    meaning: someone who thinks they are better than everyone else
    example: Yes, she thinks she's the cat's whiskers.
    band_suitability: 8.0+
    register: informal
  - term: a dog's life
    meaning: a very unhappy and hard life
    example: Yes, it's a dog's life!
    band_suitability: 7.0+
    register: informal
  - term: a cat in hell's chance
    meaning: no chance at all
    example: No, I haven't got a cat in hell's chance.
    band_suitability: 8.0+
    register: informal
  - term: a dog-in-the-manger attitude
    meaning: refusing to let other people use something, even though you have no use
      for it yourself
    example: Yes, he has a real dog-in-the-manger attitude.
    band_suitability: 8.0+
    register: neutral
  - term: the elephant in the room
    meaning: an obvious problem or difficult situation that people do not want to
      talk about
    example: ''
    band_suitability: 7.0+
    register: neutral
  - term: a wolf in sheep's clothing
    meaning: someone who appears friendly or harmless but is actually hostile or dangerous
    example: ''
    band_suitability: 7.0+
    register: neutral
  - term: straight from the horse's mouth
    meaning: from the original or highest source of information
    example: ''
    band_suitability: 7.0+
    register: neutral
  - term: sort the sheep from the goats
    meaning: separate the people or things of high quality from those of lower quality
    example: ''
    band_suitability: 8.0+
    register: neutral
  - term: shedding crocodile tears
    meaning: showing fake sorrow or sympathy
    example: ''
    band_suitability: 7.0+
    register: neutral
  - term: until the cows come home
    meaning: for a very long time
    example: ''
    band_suitability: 7.0+
    register: informal
