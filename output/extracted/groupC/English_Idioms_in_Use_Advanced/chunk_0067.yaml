vocabulary_entry:
  topic_tags:
  - opinions
  - success
  - failure
  - conversational_phrases
  - describing_qualities
  category: idiom
  source_citation: English Idioms in Use Advanced, Units 43-47
  entries:
  - term: for good measure
    meaning: in addition to what has already been done or given
    example: The party was fantastic - delicious food, a great band and all my favourite
      people there for good measure.
    band_suitability: 7.0+
    register: neutral
  - term: into the bargain
    meaning: in addition, besides
    example: She's pretty, clever and nice into the bargain.
    band_suitability: 7.0+
    register: neutral
  - term: when all's said and done
    meaning: everything considered; ultimately
    example: When all's said and done, I think you made the right decision.
    band_suitability: 7.0+
    register: neutral
  - term: a turn-up for the books
    meaning: a surprising event or turn of events
    example: No one thought the film would be a success, so it was a real turn-up
      for the books when it won three Oscars.
    band_suitability: 8.0+
    register: informal
  - term: there is a lot at stake
    meaning: there is a lot to be won or lost
    example: I feel very nervous about this exam; there is a lot at stake.
    band_suitability: 7.0+
    register: neutral
  - term: the penny dropped
    meaning: finally understood something after a period of confusion
    example: I didn't understand what he meant at first, but then the penny dropped.
    band_suitability: 7.0+
    register: informal
  - term: from the word go
    meaning: from the very beginning
    example: We got on really well from the word go.
    band_suitability: 7.0+
    register: informal
  - term: to put it mildly
    meaning: stating something in a way that is much less strong than what is actually
      true
    example: I think you were rather rude to her, to put it mildly.
    band_suitability: 7.0+
    register: neutral
  - term: good riddance
    meaning: an expression of relief at being free of someone or something unwanted
    example: Good riddance (to bad rubbish)! I could never stand her.
    band_suitability: 7.0+
    register: informal
  - term: same difference
    meaning: used to say that two different things are essentially the same or have
      the same result
    example: Well, same difference.
    band_suitability: 7.0+
    register: informal
  - term: no time like the present
    meaning: now is the best time to do something rather than waiting
    example: You're right. There's no time like the present.
    band_suitability: 6.0+
    register: neutral
  - term: nice work if you can get it
    meaning: said about an attractive or easy job that pays well
    example: Nice work if you can get it.
    band_suitability: 7.0+
    register: informal
  - term: in the long run
    meaning: over a long period of time in the future
    example: They may be enjoying themselves now, but in the long run it will all
      end in tears.
    band_suitability: 6.0+
    register: neutral
  - term: trust someone as far as I could throw her
    meaning: not trust someone at all
    example: I think Tara is unreliable and a liar. I wouldn't trust her as far as
      I could throw her.
    band_suitability: 8.0+
    register: informal
  - term: only time will tell
    meaning: it will become clear in the future
    example: The new manager may make a difference to the company, or he may fail.
      Only time will tell.
    band_suitability: 6.0+
    register: neutral
  - term: take the words right out of my mouth
    meaning: say exactly what the other person was about to say
    example: You took the words right out of my mouth.
    band_suitability: 7.0+
    register: neutral
  - term: tell me about it
    meaning: used to say that you completely agree with someone based on your own
      experience
    example: Tell me about it!
    band_suitability: 6.0+
    register: informal
  - term: if you can't beat 'em, join 'em
    meaning: accept that you cannot defeat an opponent and therefore cooperate with
      them
    example: Well, in the end I thought, 'If you can't beat 'em, join 'em.'
    band_suitability: 7.0+
    register: informal
  - term: at odds with
    meaning: disagreeing with someone
    example: I am at odds with everyone else in my family about where we should go
      on holiday.
    band_suitability: 7.0+
    register: formal
  - term: pour oil on troubled waters
    meaning: try to calm a dispute and restore good relations
    example: Please do all you can to pour oil on troubled waters. I hate it when
      people argue.
    band_suitability: 8.0+
    register: neutral
  - term: on message
    meaning: expressing the official or expected opinions
    example: The politician was sacked for not being on message.
    band_suitability: 8.0+
    register: formal
  - term: a paper tiger
    meaning: someone or something that appears powerful or threatening but is actually
      weak
    example: a paper tiger
    band_suitability: 8.0+
    register: neutral
  - term: built on sand
    meaning: built on a weak foundation and likely to fail
    example: built on sand
    band_suitability: 8.0+
    register: neutral
  - term: win your spurs
    meaning: prove your ability and earn respect
    example: win your spurs
    band_suitability: 8.0+
    register: neutral
  - term: on a roll
    meaning: experiencing a continuous streak of success
    example: on a roll
    band_suitability: 7.0+
    register: informal
  - term: go down a storm
    meaning: be very successful or popular with an audience
    example: The chef's new recipes went down a storm with the clientele.
    band_suitability: 7.0+
    register: informal
  - term: go down like a lead balloon
    meaning: be completely unsuccessful or unpopular
    example: My ideas for restructuring the company went down like a lead balloon.
    band_suitability: 8.0+
    register: informal
  - term: riding high
    meaning: enjoying a period of great success and popularity
    example: The new prime minister is riding high at the moment.
    band_suitability: 7.0+
    register: neutral
  - term: cut the mustard
    meaning: come up to expectations; reach the required standard
    example: I'm quite worried about starting my new job. I'm afraid I won't be able
      to cut the mustard.
    band_suitability: 8.0+
    register: informal
  - term: ahead of the game
    meaning: having an advantage over potential competitors
    example: I've been studying hard all year, so I hope I will be ahead of the game
      when it comes to taking my exams.
    band_suitability: 7.0+
    register: neutral
  - term: a double whammy
    meaning: two unpleasant things happening at the same time
    example: Poor Carl has been hit by a double whammy- losing his job and having
      a flood in his house.
    band_suitability: 7.0+
    register: informal
  - term: fighting fit
    meaning: in very good physical health
    example: My old auntie Lily is fighting fit, even though she had an operation
      two months ago.
    band_suitability: 7.0+
    register: neutral
  - term: filthy rich
    meaning: extremely wealthy
    example: 'She''s filthy rich: she owns a private jet and a massive yacht.'
    band_suitability: 6.0+
    register: informal
  - term: stark naked
    meaning: completely without clothes
    example: A man jumped into the fountain stark naked and was arrested by the police.
    band_suitability: 7.0+
    register: neutral
  - term: squeaky-clean
    meaning: having an impeccably pure or honest image
    example: The new government had a squeaky-clean image until the recent scandal
      broke.
    band_suitability: 7.0+
    register: neutral
  - term: a razor-sharp mind
    meaning: an extremely intelligent and quick mind
    example: Erica has a razor-sharp mind and is the most intelligent person I know.
    band_suitability: 8.0+
    register: neutral
  - term: hit rock bottom
    meaning: reach the lowest possible level
    example: Things have hit rock bottom between my parents and their neighbours;
      they don't speak to each other any more.
    band_suitability: 7.0+
    register: neutral
  - term: crystal clear
    meaning: completely easy to understand
    example: It is crystal clear to me that she is trying to deceive us all.
    band_suitability: 6.0+
    register: neutral
  - term: a small fortune
    meaning: a very large amount of money
    example: They've spent a small fortune on furniture for their new house.
    band_suitability: 6.0+
    register: neutral
  - term: in broad daylight
    meaning: during the day when crimes can be easily seen
    example: Police report that more crimes are taking place in broad daylight.
    band_suitability: 7.0+
    register: neutral
