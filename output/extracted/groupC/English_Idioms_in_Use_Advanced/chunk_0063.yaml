    example: He's completely immoral about financial matters. He would sell his own
      grandmother.
    band_suitability: 8.0+
    register: informal
  - term: take someone to the cleaners
    meaning: to defeat someone completely or cheat them out of all their money
    example: He sued the newspaper for libel, won his case and took them to the cleaners.
    band_suitability: 8.0+
    register: informal
  - term: laughing all the way to the bank
    meaning: making a lot of money very easily and feeling very happy about it
