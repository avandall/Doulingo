    band_suitability: 8.0+
    register: informal
  - term: bring home the bacon
    meaning: to earn the money that your family needs to live
    example: Well, someone has to bring home the bacon!
    band_suitability: 7.0+
    register: neutral
  - term: quids in
    meaning: in a fortunate financial position, especially after making a profit
    example: Jessie paid me for that job I did last week, so I'm quids in.
    band_suitability: 8.0+
    register: informal
  - term: go for a song
    meaning: to be sold very cheaply
    example: I bought a new guitar at the weekend. It was going for a song at only
      £80.
    band_suitability: 8.0+
    register: neutral
  - term: live on a shoestring
    meaning: to live on a very small amount of money
    example: I'm tired of living on a shoestring. I need to earn more money.
    band_suitability: 7.0+
    register: neutral
  - term: throw money down the drain
    meaning: to waste money completely
    example: Spending money on ready-made meals is just throwing money down the drain.
    band_suitability: 7.0+
    register: neutral
  - term: rolling in it
    meaning: extremely rich
    example: He must be absolutely rolling in it.
    band_suitability: 8.0+
    register: informal
  - term: cheap and cheerful
    meaning: inexpensive but of acceptable quality or enjoyable
    example: We had lunch in a cheap and cheerful restaurant.
    band_suitability: 7.0+
    register: neutral
  - term: pay over the odds
    meaning: to pay more money for something than it is actually worth
    example: There's no point in paying over the odds for it - it's just not worth
      it.
    band_suitability: 8.0+
    register: neutral
  - term: break the bank
    meaning: to cost too much money or drain all of one's savings
    example: Why don't you buy her a bunch of flowers? It won't break the bank.
    band_suitability: 7.0+
    register: neutral
  - term: breadwinner
    meaning: the member of a family who earns the money to support them
    example: Rachel is the main breadwinner in our family.
    band_suitability: 6.0+
    register: neutral
  - term: penny-pinching
    meaning: unwilling to spend money; excessively careful with money
    example: I wish we had more money. I hate being so penny-pinching all the time.
    band_suitability: 7.0+
    register: neutral
  - term: no-expense-spared
    meaning: involving spending as much money as necessary to make something very
      luxurious
    example: The prize is a no-expense-spared weekend in a London hotel.
    band_suitability: 8.0+
    register: neutral
  - term: money to burn
    meaning: so much money that you can spend it on unnecessary things
    example: Ivana is always going shopping. She must have money to burn.
    band_suitability: 8.0+
    register: informal
  - term: scrimp and save
    meaning: to live very frugally and save every possible coin
    example: Kim has never had much money. She has always had to scrimp and save.
    band_suitability: 7.0+
    register: neutral
