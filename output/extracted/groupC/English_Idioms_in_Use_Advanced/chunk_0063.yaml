    register: neutral
  - term: tick all the boxes
    meaning: to fulfill all the necessary requirements or expectations
    example: They chose Mark for the job because he ticked all the boxes.
    band_suitability: 7.0+
    register: neutral
  - term: money for old rope
    meaning: money earned easily for doing very little work
    example: Working as a security guard is money for old rope, unless someone actually
