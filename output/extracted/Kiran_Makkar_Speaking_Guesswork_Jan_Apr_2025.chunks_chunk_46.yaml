  ai_line: 1. How should parents teach their children what a risk is?
  user_model_answer: Parents can explain risk as the chance of something bad happening. They can also give examples of everyday risky situations! For example, the can tell the kids that crossing the street without looking is a risk because one might get hit by a car.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. What risks should parents tell their children to avoid?
  user_model_answer: Parents should warn children about risks that could seriously hurt them. This could be things like talking to strangers, running into traffic, or playing with dangerous objects like sharp knives.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Why do some people like to watch risk-taking movies?
  user_model_answer: People enjoy the excitement and adrenaline rush that comes with watching risky situations on screen. It's a safe way to experience the thrill without facing the real danger themselves. Imagine watching a car chase – it's exciting, but you wouldn't want to be in one!
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. What kinds of sports are dangerous but exciting?
  user_model_answer: Many extreme sports involve high risks but are popular because of the challenge and adrenaline. Rock climbing or white-water rafting are good examples. They require skill and safety precautions to minimize the danger.
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. Why do some people enjoy extreme sports?
  user_model_answer: Some people enjoy extreme sports because they’re adventurous by nature. They get the thrill out of doing challenging sports. Some people also do it for money as there is a lot of money involved in such sports.
- band_level: 7.0
  turn_type: standalone
  ai_line: 6. Are action films popular in your country?
  user_model_answer: Yes, action films are very popular in my country. They are especially popular among children and young people.
- band_level: 7.5
