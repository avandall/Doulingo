  ai_line: 1. Do you use internet (very much)?
  user_model_answer: Yes, I use the internet a lot, especially for research for my studies. I also use the internet for chatting with my friends, watching movies and playing games.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. When was the first time you used the internet?
  user_model_answer: The first time I used the internet was when I was in around 10-11 years old. We got a computer and an internet connection set up at our home.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Is the internet very important (or useful) to you?
  user_model_answer: Yes, the internet is very important/useful for me. I mostly use it for research purposes for my studies. It also helps me stay connected with my friends. www.youtube.com/makkarielts www.instagram.com/makkarielts www.makkarielts.com/books 269 Jan-Apr 2025 Speaking Guesswork (FINAL VERSION) www.makkarielts.com/books
