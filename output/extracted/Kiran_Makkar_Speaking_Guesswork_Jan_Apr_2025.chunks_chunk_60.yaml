  ai_line: 1. Do you like art?
  user_model_answer: Yes, I like art. Art gives meaning to life. Art is what differentiates us from animals. I like all sorts of art. I like drawing and painting. I also liked performing arts like music and dance.
- band_level: 7.0
  turn_type: standalone
  ai_line: 2. Do you think art classes are necessary? {Why?)
  user_model_answer: Yes, I think art classes are very necessary. Art brings out peoples creativity. Art preserves our culture and tradition.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. How do you think art classes affect children’s development?
  user_model_answer: Art classes affect children’s development in many ways. Art brings out the hidden creativity of children. Art is a form of communication. People can convay their feelings through their paintings and through their songs.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. What kind of paintings do Indian people like?
  user_model_answer: Indian people like different kinds of paintings. It is a matter of personal choice. Some people like portraits, some like paintings of landscapes, some like the traditional forms of painting and some like the modern art forms.
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. What can you learn from western paintings?
  user_model_answer: We can learn many things from western paintings, in fact from any form of art from anywhere. Sometimes it is related to a culture, sometimes it maybe someone’s expression of their perspective, sometimes it’s a social message and we can also learn about the types of material (canvas, paints, etc.) used to create that work of art.
- band_level: 7.5
  turn_type: standalone
  ai_line: 6. What benefits can you get from painting as a hobby?
  user_model_answer: Painting as a hobby can bring out your hidden talent. Painting can relax you. You can even sell your paintings and earn money. You can also gift your painting to someone you love.
