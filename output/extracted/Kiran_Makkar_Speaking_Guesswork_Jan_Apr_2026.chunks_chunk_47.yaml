sample_dialogues:
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Are there many people growing their own vegetables now?
  user_model_answer: Yes, many people are growing their own vegetables these days, especially after the pandemic. They want fresh and chemical-free food at home.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Do you think it’s good to let kids learn how to plant?
  user_model_answer: Yes, it’s a great hobby and it teaches them patience and responsibility. It also helps them connect with nature and fosters a love for gardening.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. What do you think of the job of a farmer?
  user_model_answer: Farmers grow the food we eat, and farming is a very important and hardworking job. If farmers will not grow any crops, then we will not have any food on our table and there will be hunger and starvation everywhere. I feel disappointed that farmers don’t get enough support or respect.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. What are the differences between traditional and modern agriculture?
  user_model_answer: Traditional agriculture used a lot of chemicals to increase the yield and prevent the crops from diseases, but modern agriculture is shifting towards organic and more environment friendly approach.
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. What happened to the farmers’ income during the pandemic?
  user_model_answer: Many farmers faced losses during the pandemic due to market closures and transport issues. Some couldn’t sell their crops on time, which lowered their income.
- band_level: 7.5
  turn_type: standalone
