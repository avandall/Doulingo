- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Do people in your country set goals?
  user_model_answer: Yes, people do set goals. Goals give people a sense of direction and purpose. It also acts as a source of motivation. Imagining the goal in our mind, can help people work harder and achieve it.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Do people usually set long-term goals or short-term ones?
  user_model_answer: I think both. Long term goals like buying a house, becoming a manager or earning a degree give an overall sense of direction. Short term goals like finishing a presentation, completing an assignment are like small steps towards the main long-term goal. People make both.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Why is setting goals important in the workplace?
  user_model_answer: Firstly, I think goals give clarity about responsibilities and priorities to employees. It also acts as a source of motivation and finally, it helps to track progress and help finish projects on time.
