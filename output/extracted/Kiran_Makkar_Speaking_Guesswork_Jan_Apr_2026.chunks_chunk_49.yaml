- band_level: 7.0
  turn_type: standalone
  ai_line: 1. Do people in your country go to the shopping mall frequently?
  user_model_answer: Yes, a lot of people go to shopping malls frequently. However, street markets are also very popular.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. How have people’s shopping habits changed in recent decades?
  user_model_answer: As disposable incomes have increased, people’s spending habits have changed from essential items to luxuries. Moreover, more and more people are shopping online instead of going to street markets and shopping malls.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Do you think shops and shopping malls will disappear in the future?
  user_model_answer: I don’t think they will disappear completely. For me shopping is not just about buying something, it is also about spending quality with friends and family and online shopping cannot fulfill this purpose. Moreover, many people prefer to buy items like shoes and clothes only after trying them out, so there will always be a space for physical stores.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. What are the differences between shopping in street markets and big shopping malls?
  user_model_answer: The biggest difference is in the variety of products. Street markets sell handmade, local, or unique items, while shopping malls sell branded and mass-produced items. Moreover, there is a lot of bargaining in street markets, while prices in shopping malls are generally fixed.
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. What are the differences between shopping habits of different age groups?
