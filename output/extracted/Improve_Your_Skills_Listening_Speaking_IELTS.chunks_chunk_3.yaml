sample_dialogues:
- band_level: 7.5
  turn_type: standalone
  ai_line: '1. Read these two advertisements and answer questions a-d. [Image: Lost purse notice, Lost wallet notice] a. Where would you see advertisements like these?'
  user_model_answer: b. Do you think the owner will find her purse? What about the owner of the wallet? c. What do you think about the reward? Is it large enough, or too large? d. What would you do if you lost a wallet or a purse?
- band_level: 7.0
  turn_type: standalone
  ai_line: 1. **[1.10]** Listen again and match each phrase a-d from the story with the correct function 1-4. a. I should say b. How shall I put it?
  user_model_answer: c. Now, where was I? d. Let me see,
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Answer the questions a-d. a. Is it safe to shop over the Internet?
  user_model_answer: b. What do you think the main effects of Internet shopping are? c. Have you bought anything over the Internet? If not, would you? d. Have you ever bought anything which was damaged? What did you do?
- band_level: 7.0
  turn_type: standalone
  ai_line: 4. Which of the materials below can be categorized as (a) cloth, (b) metal, or (c) man-made?
  user_model_answer: fur / gold / cotton / wood / linen / polyester / aluminium / silk / brass / glass / plastic / tin / leather / steel
