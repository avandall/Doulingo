sample_dialogues:
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Do you think the location is a key factor in where people choose to live?
  user_model_answer: Yes, location plays a big role because people want convenience. If a place is close to work, schools, and markets, life becomes easier. I’ve noticed that many families in my area moved closer to the city just to save time on commuting.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. What is the role of plants in home decoration?
  user_model_answer: I believe plants make a house feel more alive and fresh. They improve the atmosphere and soften the look of the space. Some people also like them because they reduce stress and purify the air, which is a bonus.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. What are the differences between buildings in the city and in the countryside?
  user_model_answer: Well, buildings in cities are usually taller and more compact because land is expensive. You see apartments, offices, and malls everywhere. In the countryside, houses are spread out, mostly single-storey, and have more open space around them. The lifestyle feels slower there.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Do you prefer to live in the city or in the countryside?
  user_model_answer: Personally, I prefer the countryside because it’s quieter and less crowded. I like having open space and cleaner air around me. But I do understand why some people choose cities—they offer better jobs and more entertainment options.
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. What safety risks are there in residential buildings in cities?
  user_model_answer: In cities, high-rise buildings can face risks like fires, lift breakdowns, or overcrowding in emergency situations. Sometimes poor construction or lack of maintenance also becomes a concern. Older buildings especially need regular checks.
- band_level: 7.5
  turn_type: standalone
  ai_line: 6. Is it expensive to decorate a house or an apartment in the place where you live?
