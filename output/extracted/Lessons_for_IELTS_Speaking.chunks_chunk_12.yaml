sample_dialogues:
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. What is news? What is opinion? Are these all news stories? Do you agree with your partner?
  user_model_answer: a. President Obama will visit some countries in South-East Asia. b. My IELTS teacher has a terrible hairstyle. c. Chocolate is too sweet. d. Chinese astronaut walks in space. e. 10 reasons why you should buy a new computer this year f. New Zealand signs trade deal with China.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Where do you get the best news and information about your family? From your mother, your father, or from other sources? Where do you get news about your country or region and the world? Answer for yourself and put a tick (✓) in the following table.
  user_model_answer: '| News about | SOURCE 1 | SOURCE 2 | |------------|----------|----------| | Your family | grandparents? | parents? | | | parents? | friends? | | | brother/sister? | uncles/aunts? | | Your country | local newspapers? | | | | friends? | | | The world | local TV/radio? | | | | the Internet? | | | | family? | | | | others? | |'
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. Listen to the audio. Which words are stressed in the following sentence?
  user_model_answer: '*Do you get any news about your region from the Internet?* The words **news**, **region**, and **Internet** are louder than the others. This is because in English, words that carry the most important meaning are stressed, and words that carry less important meaning are not stressed. We usually stress negative words, e.g. *can''t*, *don''t*, *won''t*, *not*, *no*. E.g. *I get no news about my region from my friends.*'
