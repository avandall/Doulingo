sample_dialogues:
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Hobbies What hobbies do you have?
  user_model_answer: 'Keywords: books + music + traveling I enjoy reading books, listening to music, and traveling. These activities help me relax and learn new things at the same time. How often do you do your hobbies? Keywords: books: every day; music: free time; travelling: a few times/year I read books almost every day, and I listen to music whenever I have free time. As for traveling, I try to do it a few times a year when I have a break from work. Do you think hobbies are important? Keywords: yes -> relax + ß stress Yes, hobbies are very important because they help people relax and reduce stress. They also allow people to develop new skills and meet like-minded individuals.'
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. Food What kind of food do you like?
  user_model_answer: 'Keywords: Vietnamese food -> fresh + healthy I love Vietnamese food because it’s fresh, healthy, and full of flavor. Some of my favorites are pho, banh mi, and fresh spring rolls. Do you prefer eating at home or in restaurants? Keywords: at home -> healthier + affordable I prefer eating at home because home-cooked food is healthier and more affordable. But sometimes, I like eating out to try new dishes. What is a popular dish in your country? Keywords: Pho: beef/chicken + broth Pho is one of the most famous dishes in Vietnam. It’s a noodle soup with beef or chicken, and it has a delicious, flavorful broth.'
- band_level: 7.5
  turn_type: standalone
  ai_line: 6. Weather What’s the weather like in your country?
  user_model_answer: 'Keywords: tropical; North: 4 seasons, South: hot Vietnam has a tropical climate. The north has four seasons, while the south is hot all year round. Summers are very hot, and winters can be quite cold in some areas. What’s your favorite season? Keywords: autumn: cool + comfortable I like autumn because the weather is cool and comfortable. It’s neither too hot nor too cold, and the air feels fresh. Do you think climate change is affecting the weather? Keywords: yes; storms + floods Yes, I think so. The summers are getting hotter, and there are more unexpected storms and floods. It’s becoming more extreme than before.'
- band_level: 7.5
  turn_type: standalone
  ai_line: 7. Shopping Do you like shopping?
  user_model_answer: 'Keywords: yes, careful with $ Yes, I enjoy shopping, especially for clothes and books. It’s fun to explore different styles and find good deals. However, I try to be careful with my spending and only buy what I really need. Do you prefer shopping online or in stores? Keywords: online; convenient; shoes + clothes: stores I prefer online shopping because it’s more convenient. I can compare prices and read reviews before buying. However, for clothes and shoes, I like going to stores to try them on first. What’s the last thing you bought? Keywords: book, personal development The last thing I bought was a new book about personal development. I love reading in my free time because it helps me learn new things.'
- band_level: 7.5
  turn_type: standalone
  ai_line: 8. Technology Do you like using technology?
  user_model_answer: 'Keywords: yes; work + entertainment Yes, I use technology every day for work, study, and entertainment. It makes life easier and helps me stay connected with people. What is your favorite gadget? Keywords: smartphone - everything My smartphone is my favorite gadget because I can use it for everything—communication, learning, and entertainment. It’s very useful in daily life. Is technology changing the way we live? Keywords: yes – everything online + affect health Yes, it has changed everything. Now, we can work, study, and shop online. However, some people spend too much time on their phones, which is not good for their health.'
- band_level: 7.5
  turn_type: standalone
  ai_line: 9. Travel Do you like traveling?
  user_model_answer: 'Keywords: yes, new places/people/cultures Yes, I love traveling because it allows me to explore new places, meet new people, and experience different cultures. It’s always exciting to see something new. Where would you like to travel in the future? Keywords: Japan, scenery, history, food I’d love to visit Japan because of its beautiful scenery, rich history, and delicious food. The culture there is very interesting. Do you prefer traveling alone or with others? Keywords: family & friends - safer I prefer traveling with friends or family because it’s more fun and feels safer. However, sometimes traveling alone can be a good way to enjoy personal time.'
- band_level: 7.5
  turn_type: standalone
  ai_line: 10. Music What kind of music do you like?
  user_model_answer: 'Keywords: pop + acoustic I enjoy pop and acoustic music. Pop songs are catchy and fun, while acoustic music helps me relax. When do you usually listen to music? Keywords: free + studying + travelling I listen to music in my free time, especially when I’m studying or traveling. It helps me focus and makes me feel happy. Can music change your mood? Keywords: yes – upbeat: energetic, slow: relax Yes, definitely! Upbeat music makes me feel energetic, while slow songs help me relax after a long day.'
- band_level: 7.5
  turn_type: standalone
  ai_line: 11. Accommodation Do you live in a house or an apartment?
  user_model_answer: 'Keywords: apartment – small, comfortable I live in an apartment. It’s small but comfortable, and it has everything I need. The best thing is that it’s located near my workplace, so it’s very convenient. What do you like about your home? Keywords: cozy, safe neighborhood, nice view I like that it’s cozy and quiet. The neighborhood is safe, and my apartment has a nice view from the balcony. It’s a great place to relax after a long day. Would you like to move to a different home in the future? Keywords: yes, bigger + garden + outdoor area Yes, in the future, I’d love to live in a bigger house with a garden. I think having more space would be nice, and I’d love to have a small outdoor area to enjoy fresh air.'
- band_level: 7.5
  turn_type: standalone
  ai_line: 12. Friends Do you have many friends?
  user_model_answer: 'Keywords: small group, quality > quantity I have a small group of close friends. I prefer quality over quantity because I believe real friendship is about trust and understanding. How often do you meet your friends? Keywords: 1/week – coffee, dinner, talk I meet my friends at least once a week. We usually go out for coffee, have dinner together, or just hang out and talk. What do you usually do with your friends? Keywords: movies, trips We like to chat, watch movies, and sometimes go on short trips. Spending time with friends helps me relax and feel happy.'
- band_level: 7.5
  turn_type: standalone
  ai_line: 13. Pets Do you have a pet?
  user_model_answer: 'Keywords: no, future: dog/cat No, I don’t have a pet at the moment, but I would love to have one in the future, maybe a dog or a cat. What pet would you like to have? Keywords: dog - loyal I would like to have a dog because they are loyal and playful. I think having a dog would be great for companionship and exercise. Do you think pets are important? Keywords: happiness + reduce stress Yes, I think pets are important because they bring happiness and help reduce stress. They also teach people responsibility and care.'
- band_level: 7.5
  turn_type: standalone
  ai_line: 14. Movies Do you like watching movies?
  user_model_answer: 'Keywords: yes - relax Yes, I love watching movies, especially in my free time. It’s a great way to relax and enjoy a good story. What kind of movies do you like? Keywords: action + comedy - laugh I enjoy action and comedy movies. Action movies are exciting and full of energy, while comedies make me laugh and feel happy. Do you prefer watching movies at home or in the cinema? Keywords: home – comfortable; cinema: new releases I prefer watching movies at home because it’s more comfortable and I can pause whenever I want. But sometimes, I like going to the cinema to watch new releases.'
- band_level: 7.5
  turn_type: standalone
  ai_line: 15. Sports Do you like playing sports?
  user_model_answer: 'Keywords: yes -> fit + healthy Yes, I like playing sports because it helps me stay fit and healthy. It’s also a great way to have fun with friends. What is your favorite sport? Keywords: badminton -> easy I enjoy playing badminton because it’s easy to play and a great way to exercise. I also like watching football on TV. Do you prefer playing or watching sports? Keywords: play -> active; watch: tournaments I prefer playing because it keeps me active. But I also enjoy watching important matches, especially during big tournaments.'
- band_level: 7.5
  turn_type: standalone
  ai_line: 16. Reading Do you like reading books?
  user_model_answer: 'Keywords: new things + imagination Yes, I love reading because it helps me learn new things and improves my imagination. I usually read before bed. What kind of books do you like to read? Keywords: novels + self-help I like reading novels and self-help books. Novels are entertaining, and self-help books help me grow. Do you prefer paper books or e-books? Keywords: paper: feeling; e-book: travelling I prefer paper books because I like the feeling of holding a real book. However, e-books are more convenient when traveling.'
- band_level: 7.5
  turn_type: standalone
  ai_line: 17. Transportation What kind of transport do you usually use?
  user_model_answer: 'Keywords: motorbikes -> fast + convenient I usually use a motorbike because it’s fast and convenient in the city. It helps me avoid traffic jams. What is the most popular means of transport in your country? Keywords: motorbikes -> affordable + easy Motorbikes are the most common because they are affordable and easy to use in busy streets. Many people also use buses. Do you like public transportation? Keywords: crowded + slow – save $ + ß pollution Not really, because it’s sometimes crowded and slow. But I think it’s a good option for saving money and reducing pollution.'
- band_level: 7.5
  turn_type: standalone
  ai_line: 18. Fashion Do you like fashion?
  user_model_answer: 'Keywords: express personality Yes, I like fashion because it allows me to express my personality. I enjoy dressing well and trying different styles. What kind of clothes do you usually wear? Keywords: casual + comfortable I prefer casual and comfortable clothes, like jeans and T-shirts. But for special occasions, I like to dress more formally. Do you follow fashion trends? Keywords: suits, not trends Not really. I wear what suits me instead of following trends. But sometimes, I check fashion trends for inspiration.'
- band_level: 7.5
  turn_type: standalone
  ai_line: 19. Weekend Activities What do you usually do on weekends?
  user_model_answer: 'Keywords: friends + coffee – home + movies/books I usually relax, meet friends, or go out for coffee. Sometimes, I just stay home and watch movies or read books.'
