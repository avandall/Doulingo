sample_dialogues:
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Do you often stay up late?
  user_model_answer: Yes, I do — quite often, actually. I usually stay up past midnight, mostly to prepare for the IELTS exam. I know it’s not good for my health, but honestly, it’s a hard habit to break.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Did you stay up late when you were a child?
  user_model_answer: Not at all. When I was in primary school, I used to go to bed around 7:30 p.m. That might sound super early nowadays, but back then, most kids in my village did the same. There wasn’t much to do in the evening anyway, especially without smartphones or the internet.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. What do you usually do when you stay up late?
  user_model_answer: Like I said earlier, I usually stay up to study for the IELTS exam — reviewing materials, doing practice tests, or sometimes preparing lessons for my students. Even after I finish the exam, I think I’ll still stay up late — it’s kind of become a habit now.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. How do you feel the next morning after staying up late?
  user_model_answer: Honestly, I feel pretty drained. I usually wake up around 9 or 9:30, and I tend to avoid doing anything that requires focus in the morning. I feel sluggish and not very productive until later in the day. It definitely affects my energy levels.
