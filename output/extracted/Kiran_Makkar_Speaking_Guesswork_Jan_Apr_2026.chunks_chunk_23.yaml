sample_dialogues:
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. What kind of music is popular in your country?
  user_model_answer: Well, in my country Bollywood music is the most popular. People enjoy it because it’s used in movies and everyone can relate to the lyrics. For example, during weddings, almost all the songs played are from Bollywood.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. What kind of music do young people like?
  user_model_answer: I think young people mostly like fast and energetic songs like pop, rap or EDM. They listen to it because it matches their lifestyle and keeps them active. For instance, my friends often play rap songs while driving.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. What are the differences between young people’s and old people’s preferences in music?
  user_model_answer: According to me, young people usually go for modern beats and western styles, while older people prefer classical or old melodies. My grandfather still listens to old Punjabi folk songs, while my younger cousins listen to English pop.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. What are the benefits of children learning a musical instrument?
  user_model_answer: Oh, there are many benefits. It helps children improve concentration and creativity. For example, my cousin started learning guitar and it not only made him more confident but also gave him a new friend circle.
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. Do you know what kind of music children like today?
  user_model_answer: Hmm, from what I see, children enjoy cartoon songs or fun dance numbers. They like songs with easy words and simple beats. My little niece, for instance, always plays the same animated movie songs again and again.
