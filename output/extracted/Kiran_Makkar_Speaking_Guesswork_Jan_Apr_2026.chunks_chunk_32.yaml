sample_dialogues:
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Do you think we should use plastic products?
  user_model_answer: We should but we can’t. I know plastic is not good for the environment, but there are not many good alternatives to plastic. So, I believe we can’t stop using plastic completely. Only when we develop a good environment alternative to plastic, we can using it.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. How can we reduce our use of plastic?
  user_model_answer: Firstly, we can completely stop using single use plastic like plastic bags, plastic cutlery and so on. People can be encouraged to carry their own cloth bags when they go shopping. Some countries like India have already made laws for this. Apart from this, I think governments can encourage recycling of plastic products like bottles, so that they are not dumped indiscriminately.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. What kinds of plastic waste are often seen in your country?
  user_model_answer: The main plastic waste is of course plastic bags and bottles. There are certain cities like Delhi, which have these plastic waste mountains. However, in recent years, the government has taken steps to reduce this – like ban on use of single use plastic.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Why do people like to use plastic products?
  user_model_answer: The main reason is that they are cheaper For example, plastic bottles are a lot cheaper than glass or steel bottles. Secondly, plastic is more durable, it doesn’t break easily. So, parents don’t have to worry about children dropping plastic plates or bottles.
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. What can the government do to reduce plastic pollution?
  user_model_answer: Like I said before government can make laws on ban of single use plastics and strictly enforce laws. Moreover, government can encourage recycling of plastic waste.
- band_level: 7.5
  turn_type: standalone
  ai_line: 6. Do you think we can do without plastic altogether in the future?
