- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Complete the following dialogue with appropriate sentences or phrases. **A:** Hi there, Katie! We're going swimming. Do you want to join us?
  user_model_answer: '**B:** Sure, I''d love to. Swimming is one of my favourite things to do. **A:** I didn''t know you were so interested in swimming. What other things are you interested in? **B:** I enjoy tennis, badminton, and volleyball. And I love painting, too. **A:** Really? I enjoy that, too. Whenever I am painting, it makes me feel so relaxed and happy. **B:** Me too! I first started to paint when I was a little girl. My parents just wanted me to try some painting lessons, and I soon fell in love with painting. **A:** What else do you like to do in your spare time? **B:** I''m also very fond of cooking and reading. **A:** You have a lot of hobbies! Which one is your favourite? **B:** My favourite hobby is swimming because it helps me keep fit, and also makes me have more energy to handle anything that comes my way! How about you? What are your hobbies? **A:** I like painting, of course, and also running, reading, and surfing the Internet. **B:** And which one is your favourite
    hobby? **A:** I suppose I enjoy surfing the Internet the best because it''s a great way to learn about new things. **B:** I think hobbies are really important. If I didn''t have any of these things to do after working and studying, my life would be so boring. **A:** I couldn''t agree with you more. Whenever I am painting, I feel very peaceful and happy. **B:** Yes! That''s how I feel, too! **A:** We''d better get going to the swimming pool. Do you have everything? **B:** No. I''ll just run home first to get my swimming stuff. I''ll meet you at the pool. **A:** Okay! See you soon. **B:** I''ll see you.'
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. What do you look for in a hobby? Look at the characteristics below and identify which are the most important to you in your hobbies.
  user_model_answer: '- the chance to become an expert - a challenge - competition - expressing creativity - excitement - exercise - fun - learning a new skill - relaxation - spending time with friends'
