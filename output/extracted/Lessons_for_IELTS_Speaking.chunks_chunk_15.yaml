sample_dialogues:
- band_level: 7.5
  turn_type: standalone
  ai_line: '10. Choose your three most important technological possessions and complete the table below. | Piece of equipment | Function: What does it do? | Adjectives | Why you like it... |'
  user_model_answer: '|--------------------|---------------------------|------------|-------------------| | e.g. mobile phone | call, text, games, photos | great, convenient, cheap, tiny | Because I can text my friends and always stay in contact. | | | | | | | | | | | | | | | |'
- band_level: 7.5
  turn_type: standalone
  ai_line: 18. Look at the following Part 2 prompt card. How is the tense different to what you have just talked about?
  user_model_answer: '**Prompt Card:** *Describe a piece of technology or equipment that you would like to own.* *You should say:* - *What it is* - *What it does* - *How you would use it* - *And why you would like to own it* **TIP:** Look at the tense on the prompt card: you are being asked to speak about something you do not own, but would like to have. Because you are imagining, you can use *would* and *could* to speculate about what it would be like to own this piece of equipment.'
