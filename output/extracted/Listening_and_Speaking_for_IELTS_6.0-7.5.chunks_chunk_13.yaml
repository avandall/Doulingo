sample_dialogues:
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. With a partner, ask and answer the questions below. a. Do you think time management is important? Why/Why not?
  user_model_answer: b. How well do you manage your time? c. Have you ever been in a situation where you were late for an important event or deadline? How did you feel?
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. What is the function of each of the underlined phrases in 2? Add them to the table below.
  user_model_answer: '| Function | Examples from 2 | |----------|-----------------| | Starting | | | Adding | | | Sequencing | | | Changing topic | | | Digressing (going off the topic) | | | Returning to the topic | | | Concluding | |'
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Underline the compound adjective in the following pairs of sentences. Where do you think the stress falls?
  user_model_answer: a. Her books on time travel have been **best-selling**. b. She's written a number of **best-selling** books on time travel. c. The effects of postponing the election will be **far-reaching**. d. The postponement of the election will have **far-reaching** effects.
