  ai_line: 45. Text Messages 1 How often do you send text messages?
  user_model_answer: I send messages very often. I normally communicate using text messages. However, if I need to communicate urgently, I call instead of sending a text message. 2 Is sending messages popular in your country? Both yes and no. I think it is popular in the younger generation, but the older people still prefer calling over sending text messages. 3 Did you send more messages when you were younger? No, I think I send more messages now. I rarely sent messages when I was younger as I got a mobile phone very late. I used to communicate with my friends by borrowing my parent’s phone and then I usually called instead of texting. 4 Do you reply to messages as soon as you receive them? No, I only reply to messages immediately if it is something urgent. Otherwise, I respond only when I get free.
