  ai_line: 39. Small business 1.​ ​Do you know many small businesses where you live?
  user_model_answer: Yes, there are many small businesses where I live like clothes shops, pharmacies, grocery stores and so on. There are also a few small scale industries in my area. 2.​ ​Do you prefer buying things from big companies or small businesses? I prefer buying things from big companies because I feel the quality of products from big companies is better. 3.​ ​Have you ever thought about starting your own business? No, I have never thought of starting my own business. I want to do a job. I think businesses involve much stress and uncertainty.
