- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Do you have breakfast at home every day?
  user_model_answer: No, I don’t like breakfast. I just makes me feel bloated and heavy throughout the day. However, if I have a very light dinner, I do eat some egg whites the next morning.
