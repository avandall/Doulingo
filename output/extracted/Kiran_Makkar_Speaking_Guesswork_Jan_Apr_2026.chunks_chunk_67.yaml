  ai_line: 1. Do you do some cooking or help your family cook at home now?
  user_model_answer: Frankly, we have a maid and she does most of the cooking. I do help in minor things like washing the utensils or chopping vegetables when she is on leave.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Did you do some house cleaning when you were young?
