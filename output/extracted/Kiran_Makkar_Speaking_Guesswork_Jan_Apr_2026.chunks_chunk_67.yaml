  ai_line: 1. Do you make a list when you shop?
  user_model_answer: Yes, I am very forgetful, so I do make a list. Whenever I run out of something at home, I note it down on my mobile phone and I get it in my next visit to the supermarket.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Do you make a list for your work? Does it work?
