- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Which part of your country do you like to live in?
  user_model_answer: I like to live in Chandigarh. Chandigarh is the capital of Punjab and is a very beautiful, clean, well-planned city. I am from a small town ‘Phagwara’ in Punjab and during my summer break, I used to visit my grandparents in Chandigarh. I fell in love with this city and after I graduate, I want to find a job in Chandigarh and settle there.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. What makes you feel proud of your country?
  user_model_answer: Yes, I am very proud of my country. It’s full of diversity and has so many religions, languages, customs, and festivals. It’s a beautiful country blessed with the majestic Himalayas, sacred rivers like Ganga, Yamuna and so many ancient forts and palaces. People from all over the world come to visit The Taj Mahal.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Do you know the history of your country well?
  user_model_answer: Yes, India is one of the oldest civilizations in the world and is a fusion of various cultures and traditions. The history of India begins with the Indus Valley Civilization and the coming of the Aryans. Throughout its history, its rich land has attracted outsiders like Moguls, British, etc. India became Independent in August 1947 after the efforts of people like Mahatma Gandhi and Subhas Chandra Bose.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Will you stay in India in the future?
  user_model_answer: Yes, I plan to stay in India in the future. I will go abroad for my graduate studies but plan to come back to India after graduation. All my family and relatives are here and they are very important to me. I also feel that India is one of the fastest-growing economies in the world. I can find a good job and financially do better here.
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. What scenery can you see from the window of your room?
  user_model_answer: My room is in the front of our house and the window in my room faces our front porch. My mom has planted a lot of small shrubs and different colored roses on our front porch. Rose is my favorite flower and looking at them from my window makes me happy.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Do you like to watch the scenery from your window?
  user_model_answer: Yes, I love to watch the scenery from my window. I especially like looking out of the window while I am having my morning tea. I see our beautiful garden and many birds early in the morning. Seeing nature relaxes me and makes me happy.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Do you want to live in a house with beautiful window views?
  user_model_answer: Yes, my dream house is a house facing the ocean. I want to see and hear the beautiful ocean waves from my window every day. I am from Punjab and we are very far from the ocean. So, I am satisfied with our garden view. When I go on vacation with my family, we like to stay in a hotel room with beautiful window views of a lake, ocean, or mountains.
