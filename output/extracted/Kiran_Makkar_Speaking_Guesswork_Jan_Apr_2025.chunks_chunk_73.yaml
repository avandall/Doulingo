  ai_line: 1. Do you enjoy your current stage of life?
  user_model_answer: Yes, I am currently a student and thoroughly enjoying this stage of life. Right now, I just have to think about getting into a good college. I have some personal responsibilities but don’t have to worry about finances, getting a job, buying a house. I think life becomes busy and responsibilities become bigger when you start working.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. In what stage of your life were you the happiest?
  user_model_answer: I think early childhood was the happiest stage of my life. I was carefree, had zero responsibilities, didn’t have to worry about studying and my parents were always there to take care of me. I had a lot of neighborhood friends and I have happy memories of playing all day with them.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Which stage of your life do you think is the most important?
  user_model_answer: I think all stages of life are important but childhood is the most important stage. It is crucial for our physical, emotional, and mental development. A child's brain can be molded and whatever one learns during their childhood will determine what kind of a person they will become as adults.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. What’s your plan for your next stage of life?
  user_model_answer: I want to graduate from a good college and find a well-paying satisfactory job. I would like to help my parents financially and also pay off my student loans. I also want to achieve a work-life balance and find time for my hobbies.
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. How often do you take a rest?
  user_model_answer: I like to rest after every 2-3 hours. I have a lot of classes during the day but in between classes, whenever I get time, I like to take a break. I feel my brain is exhausted and after taking some rest I feel relaxed and rejuvenated.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. What do you usually do when you are resting?
  user_model_answer: I usually listen to music while I am resting. There is a beautiful garden in my college with a fountain in the middle and flowers all around. I like to sit on a bench there and listen to music whenever I get a break in between my classes.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Do you take a nap when you are resting?
  user_model_answer: I don’t take a nap during weekdays as I am at college but on weekends when I am home, I like to take a quick afternoon nap. I don’t need long and just a 15-20 minutes nap energizes me and keeps me going all day.
