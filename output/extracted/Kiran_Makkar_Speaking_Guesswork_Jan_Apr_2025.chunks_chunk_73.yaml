  turn_type: standalone
  ai_line: 2. Is there anyone who bought furniture for you?
  user_model_answer: Yes, all furniture in my home has been bought by my parents. My parents have bought all our furniture locally from small shops instead of big-name stores and brands. All the pieces are unique and many are hand-made by local artisans.
