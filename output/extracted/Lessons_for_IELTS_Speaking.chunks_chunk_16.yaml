sample_dialogues:
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Look at the following words in the Vocabulary Bank and check any that you don't know in your dictionary. Write the words in the table below - are they nouns, verbs, or adjectives?
  user_model_answer: '| Nouns | Adjectives | Verbs | |-------|------------|-------| | wallet | mean | pay back | | | | | | | | | | | | | | | | | | | | |'
- band_level: 7.5
  turn_type: standalone
  ai_line: 6. Ask and answer the following Part 1 questions with your partner. a. When was the last time you lent someone money?
  user_model_answer: b. When did you borrow money last time? c. Do you lend money to friends? d. Are you good at saving money? Why/Why not? e. Have you ever saved for something you really wanted? f. Do you think you are a generous person? g. Do you know any mean or selfish people? h. Do you make good decisions with money? i. Do you know anyone who makes bad decisions with money? j. Have you found any bargains recently? k. Do you receive pocket money or an allowance from your parents? l. Do you have a job and earn your own money? m. Do you have your own bank account? **/θ/ and /ð/** - Voiced *th* /ð/ as in *there* - Unvoiced *th* /θ/ as in *thank* To make these sounds, put your tongue between your teeth and release air between your top teeth and tongue. Watch your teacher. The sound /θ/ is unvoiced. Put your hand on your throat. When you make this sound, you will not feel any vibration in this area. To make the sound /ð/, use voice. You will feel the vibrations in your throat.
- band_level: 7.5
  turn_type: standalone
  ai_line: 20. Ask and answer the same questions with your partner. Use your notes from Exercise 18 and the language from the dialogue above to help you. **Q1:** Now, I'd like to move on to ask you some more general questions. Firstly, could you tell me how people express wealth and affluence in your country?
  user_model_answer: '- I think more and more people are choosing to show their status through... - For example, wealthy people might... or... to show that they have lots of money. - Some other people see... as an expression of wealth, for example,... **Q2:** And what do you see as the advantages and disadvantages of consumerism? - I believe that consumerism is positive in terms of... and... - However, the drawback of consumerism is that... - I think people become... **Q3:** Okay. So thinking about that, do you believe society nowadays is more materialistic than in previous generations?'
