sample_dialogues:
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Look at the pictures and answer the questions below. a. What role do scientists and engineers play in the situations in the pictures?
  user_model_answer: b. To which other areas of life do scientists and engineers contribute? c. What skills and qualities do you need to be a scientist or an engineer?
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Read the audio script below of part of the listening task to find the answer to 1. a. What is the correct answer?
  user_model_answer: b. Underline the distractors. What information tells you that the distractors are incorrect? **Dan:** I've been doing some research into the popularity of engineering as a university subject and in particular the number of females choosing this subject. My main research was based on UK home students but I wanted to make a comparison with international students in the UK and with students studying engineering in other countries. First, a little about my reasons for choosing this area of research. Well, a few months ago I was talking to a friend who studies chemistry and she mentioned that her tutor was concerned about falling admissions in their department. This got me thinking about student numbers in engineering. Soon after I noticed an editorial piece in Science Today which mentioned that the numbers of postgraduate engineering students had declined in recent years, although the number of female students had increased. I therefore decided to carry out my own research
    in this field.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Read the next question. Underline the key words and think of any synonyms. Who was questioned in Dan's survey?
  user_model_answer: A. academic staff in his department B. undergraduate students from other countries C. postgraduate students studying overseas
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Which word in each group does NOT collocate with the word in bold?
  user_model_answer: a. a scientific **breakthrough** / gadget / invention / innovation b. **cutting-edge** / state-of-the-art / unusual / advanced technology c. a **recent** / scientific / current / groundbreaking discovery d. a **medical** breakthrough / discovery / innovation / movement e. **pioneering** / modern / medical / scientific research f. a **scientific** / new / technological / digital revolution
