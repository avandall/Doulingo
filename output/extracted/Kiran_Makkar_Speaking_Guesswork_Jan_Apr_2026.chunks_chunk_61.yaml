- band_level: 7.5
  turn_type: standalone
  ai_line: 1. What do you think buildings will be like in the future?
  user_model_answer: In the future, buildings will likely be taller and smarter. They might have eco-friendly designs with solar panels and green spaces to help the environment. Many future buildings could be fully automated, using technology to control lights, temperature, and security. Some buildings might even be built underground or underwater to save space.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Why do some people choose to live in the city centre?
  user_model_answer: Some people prefer living in the city centre because it is close to work, shops, and entertainment. They can save time on traveling and enjoy a more active lifestyle. City centres often have better public transport, restaurants, and cultural events. It’s also convenient for people who like being in the middle of the action and want everything nearby.
- band_level: 7.5
  turn_type: standalone
