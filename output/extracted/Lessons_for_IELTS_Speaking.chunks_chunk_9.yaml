sample_dialogues:
- band_level: 7.5
  turn_type: standalone
  ai_line: 8. Listen to the following Part 1 IELTS speaking questions and mark sentence stress. The first one has been done for you. a. Where do you live? In an apartment or a house?
  user_model_answer: b. What is the area like where you live? c. Describe the town or city where you live? d. Where do people go at the weekend to enjoy some fresh air? e. How do people enjoy the outdoors where you live?
- band_level: 7.0
  turn_type: standalone
  ai_line: 11. What advice does Chloe give?
  user_model_answer: a. We ought to recycle some goods. b. We should try to reuse things instead.
- band_level: 7.5
  turn_type: standalone
  ai_line: 12. Can you exchange *should* and *ought to* in these sentences without changing the meaning?
  user_model_answer: Yes. *Should* and *ought to* have the same meaning for advice. **SHOULD - OUGHT TO** *We should not build any more roads through it.* *We ought to do things to encourage nature lovers to visit the forest.* *should* and *ought to* have the same meaning. You can always use *should* instead of *ought to*. They are used when giving advice.
- band_level: 7.5
  turn_type: standalone
  ai_line: 17. Use the box below to write notes about the environment where you live. Make as many notes as possible. Use your dictionary and the vocabulary you have learnt in this unit. - Where do you live? (city/village/countryside)
  user_model_answer: '- What is the area like? - What can you see/hear/smell? - What is the weather like? - What do people do outdoors? - What are the environmental problems?'
- band_level: 7.5
  turn_type: standalone
  ai_line: 19. Here are some more questions for you to practise with. a. Do you like spending time outdoors? Why/Why not?
  user_model_answer: b. What activities do you enjoy outside? Why? c. Are there any outdoor activities you don't enjoy? Why not? d. Do you think being outside during the day is important? Why/Why not? e. Describe a park or public garden that you enjoy visiting. f. Where is a very popular place for people to go and enjoy the outdoors on holiday? Why do they go there? g. Where do most people in your country go to relax at the weekend? h. Do you think we should protect the natural environment? Why/Why not? i. Do most people in your country care about the environment? Why/Why not? j. How do people care for the environment in your country? k. What kinds of pollution problems do you have in your country? l. What kinds of natural disasters have you heard of? Give details. m. What kinds of weather do you like best?
- band_level: 7.5
  turn_type: standalone
  ai_line: 20. Read the prompt card below. What tense do you think you can use in your answer?
  user_model_answer: '**Describe a natural place you like to visit.** *You should say:* - *Where it is and what kind of place it is* - *What you can see/hear/smell there* - *What people do there* - *And why you like it*'
- band_level: 7.5
  turn_type: standalone
  ai_line: 23. Prepare for your long turn. Make quick notes. There are some extra prompts below to help you make your turn longer than one minute. | PROMPTS | YOUR NOTES | |---------|------------| | Where is it and what kind of place is it? | |
  user_model_answer: '| How long does it take to get there? How do you get there? | | | What can you see, hear, or smell when you are there? | | | Describe anything unusual about this place. | | | Why do people go there and how often? What do people do there? Do they stay for a long time or just a few hours? | | | Why do you like it? | |'
