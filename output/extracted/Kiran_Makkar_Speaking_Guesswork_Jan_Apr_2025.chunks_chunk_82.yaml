  ai_line: 1. How do you feel about birds? (Why do you feel that way?)
  user_model_answer: I feel that birds are very special. They are beautiful creations of God. They add diversity to nature.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. How do Indian people feel about birds?
  user_model_answer: India is a diverse country. Everyone has different feelings. Some love birds, and keep them as pets. Others just admire them flying in the sky. Some even eat birds.
- band_level: 7.0
  turn_type: standalone
  ai_line: 3. Are there many birds near your home?
  user_model_answer: Yes, there are birds near my home. I can see pigeons, crows, sparrows and even the cuckoo bird occasionally.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Have you seen many different kinds of birds? (near your home)
  user_model_answer: Yes, I have seen many different birds. Apart from the birds I see routinely around my house, I have seen peacocks in my neighbouring village. I have also seen some rare birds, in the Chhattbir zoo. There were different varieties of parrots and the ostrich and emu over there.
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Do any birds have any particular significance in India? For example, does India have a national
  user_model_answer: bird? Yes, peacock is our national bird. It is a beautiful bird. The male looks very beautiful with its plumes spread out.
