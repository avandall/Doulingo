- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Do you think there are more beautiful things now than in the past? Why?
  user_model_answer: In some ways, yes. We have modern buildings, new designs, and digital art. But natural beauty like mountains and rivers hasn’t changed. So it depends on what kind of beauty we’re talking about.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. What beautiful scenery spots are there in your country?
  user_model_answer: India has many—like Kashmir, Himachal, Kerala, and the desert areas of Rajasthan. Each place offers something different, from snowy hills to sunny beaches.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Why do you think people create beautiful things?
  user_model_answer: People like to express their feelings through beauty. It makes the world more colorful and meaningful. Sometimes, it’s just for peace or happiness.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Where do you think people usually come into contact with beautiful things?
  user_model_answer: Mostly in nature, art galleries, or even social media now. A walk in the park or visiting a temple can also feel beautiful. Beauty is everywhere if we notice.
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. Do people in your country prefer listening to music to appreciating paintings and literature?
  user_model_answer: Yes, I think music is more popular these days. It’s easy to access and enjoy. But there are still people who love reading and looking at art.
