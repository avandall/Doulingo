  ai_line: 2. What are the benefits of advertising?
  user_model_answer: Advertising helps people know about new products or offers. It saves time because we don’t have to search much — we just see what’s available. Also, for businesses, it increases sales.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Are advertisements good or bad for children?
  user_model_answer: It depends. Some ads are useful and teach good habits, but many ads make children want things they don’t need. For example, too many junk food ads can affect their eating habits.
