sample_dialogues:
- band_level: 7.5
  turn_type: standalone
  ai_line: '6. Scenery Q: Do you look out the window at the scenery when travelling by bus or car?'
  user_model_answer: 'Yes, I often look outside because it relaxes me, especially during long drives. Q: Do you prefer the mountains or the sea? I prefer the sea because the sound of waves makes me feel calm. Q: Do you like to take scenery pictures? Yes, when I travel I take photos of nature so I can remember the moment later. Q: What are the most beautiful sights you have seen while travelling? The most beautiful sight for me was a sunset at a beach in Goa because the sky was full of colors.'
- band_level: 7.5
  turn_type: standalone
  ai_line: '7. Reading Q: Do you like reading?'
  user_model_answer: 'Yes, I like reading in my free time because it helps me switch off from screens. Q: Do you prefer to read on paper or on a screen? I prefer reading on paper because it feels easier on my eyes. Q: When do you need to read carefully, and when not? www.youtube.com/makkarielts www.instagram.com/makkarielts www.makkarielts.com/books 285 Jan-Apr 2026 Speaking Guesswork (FIRST VERSION) www.makkarielts.com/books Follow us on Instagram for latest updates: www.instagram.com/makkarielts I read carefully when it''s something important like instructions, but I skim when it’s just news or social media. Q: Do you prefer scanning or detailed reading? Most of the time I scan for key information, but I read in detail when I’m learning something new.'
- band_level: 7.5
  turn_type: standalone
  ai_line: '8. Sports Team Q: Have you ever been part of a sports team?'
  user_model_answer: 'Yes, I played cricket for my school team, and it was fun because we practised together after classes. Q: Are team sports popular in your culture? Yes, team sports like cricket and football are very popular, and people talk about matches almost every day. Q: Do you like watching team games? Why? Yes, I enjoy watching team games because they feel exciting and unpredictable. Q: What are the differences between team sports and individual sports? Team sports need cooperation between players, while individual sports depend mainly on one person’s performance.'
- band_level: 7.5
  turn_type: standalone
  ai_line: 9. Typing Do you prefer typing or handwriting?
  user_model_answer: I prefer typing to writing by hand because I type faster. Also, I can easily edit what I type, which makes it more convenient. Moreover, I have bad handwriting, so people sometimes find it difficult to understand. Do you type on a desktop or laptop keyboard every day? I usually type on a laptop. I wouldn’t say every day, but I do type assignments or write emails at least two or three times a week. When did you learn how to type on a keyboard? I never formally learned typing. I just started doing it on my own, and gradually I became faster. How did you improve your typing? As I mentioned, it improved naturally over time. Playing computer games also helped a lot because my mind got used to the location of the keys.
- band_level: 7.5
  turn_type: standalone
  ai_line: 10. Food What is your favourite food?
  user_model_answer: 'It changes from time to time. Right now, I love Indo-Chinese food like hakka noodles, Manchurian, chilli cheese, and spring rolls. What kind of food did you like when you were young? www.youtube.com/makkarielts www.instagram.com/makkarielts www.makkarielts.com/books 286 Jan-Apr 2026 Speaking Guesswork (FIRST VERSION) www.makkarielts.com/books Follow us on Instagram for latest updates: www.instagram.com/makkarielts When I was younger, I mainly liked pizzas and burgers. I still enjoy them occasionally, but I wouldn’t say they are my favourites now. Has your favourite food changed since you were a child? Yes, it has. As I mentioned earlier, I enjoyed pizzas and burgers when I was younger. Now, I prefer Indo-Chinese cuisine. There was also a time when I loved South Indian food like dosa, idli, and vada. I used to eat dosa almost every day. Do you eat different foods at different times of the year? No, my staple diet remains almost the same. It usually includes lentils and
    vegetables with roti. However, the type of vegetables changes according to the season. For example, in winter, I eat a lot of spinach and carrots.'
- band_level: 7.5
  turn_type: standalone
  ai_line: 11. Hobbies Do you have any hobbies?
  user_model_answer: Yes, I do. I enjoy playing sports like table tennis and badminton. Apart from that, I like playing video games and reading fantasy novels. Did you have any hobbies when you were a child? Yes, I had similar hobbies as a child. However, I played cricket more than table tennis and badminton at that time. Do you have a hobby that you’ve had since childhood? Yes, I still have the same hobbies that I had during my childhood. Do you have the same hobbies as your family members? No, not really. My parents and my sister are strictly against video games. Also, they don’t play outdoor sports like I do.
- band_level: 7.5
  turn_type: standalone
  ai_line: 12. Gifts What gift have you received recently?
  user_model_answer: 'Recently, my uncle gifted me a Parker pen on my birthday. I use it sometimes, but not very often. Have you ever sent handmade gifts to others? Yes, I used to make birthday cards for my grandparents when I was younger. In recent years, I don’t remember making any handmade gifts. Have you ever received a great gift? Yes, many times. My maternal aunt often gifts me cool things like interesting gadgets. She lives in the US, so whenever she visits, she brings something unique for me. What do you consider when choosing a gift? I mainly consider two things: my relationship with the person and their needs. These factors decide everything else, such as the budget and the type of gift.'
- band_level: 7.5
  turn_type: standalone
  ai_line: 14. Keys Do you always bring a lot of keys with you?
  user_model_answer: No, I usually carry just one key, which is my car key. Have you ever lost your keys? Yes, I’m quite careless with keys. I’ve lost them many times, but I’ve always managed to find them later. Do you often forget your keys and lock yourself out? No, that doesn’t happen often. We don’t have that kind of lock system at home. We need a key to both open and lock the door. Do you think it’s a good idea to leave your keys with a neighbour? Yes, if they are long-term neighbours and you trust them.
- band_level: 7.5
  turn_type: standalone
  ai_line: 15. Morning Time Do you like getting up early in the morning?
  user_model_answer: 'No, not really. I do wake up early these days, but I prefer sleeping late and waking up late. What do you usually do in the morning? I usually make myself a cup of coffee, watch the news, and get ready. I’ve been thinking about waking up earlier to exercise, but it’s easier said than done. What did you do in the morning when you were little? Why? I definitely didn’t watch the news. I was quite serious as a child, so I used to wake up and study for two or three hours most days. Are there any differences between your mornings now and in the past? Yes, there’s a huge difference. I’m very interested in the news now, so I read newspapers or watch the news regularly. I never did that as a child. Also, I don’t study anymore — that phase of my life is over. www.youtube.com/makkarielts www.instagram.com/makkarielts www.makkarielts.com/books 288 Jan-Apr 2026 Speaking Guesswork (FIRST VERSION) www.makkarielts.com/books Follow us on Instagram for latest updates: www.instagram.com/makkarielts
    Do you spend your mornings doing the same things on weekends and weekdays? Why? No, on weekends I wake up late and usually sit in front of the TV watching a movie or a TV series.'
- band_level: 7.5
  turn_type: standalone
  ai_line: 16. Dreams Can you remember the dreams you have?
  user_model_answer: I can remember them for a short time after waking up, but I usually forget them by the next day. Do you share your dreams with others? Sometimes, especially if the person appeared in the dream. However, most of the time I forget my dreams very quickly. Do you think dreams have special meanings? No, I don’t think so. I believe they are just manifestations of our fears and goals. Do you want to make your dreams come true? Yes, of course. I have many dreams, such as becoming very rich and owning a sports car.
- band_level: 7.5
  turn_type: standalone
  ai_line: 17. Pets and Animals What’s your favourite animal? Why?
  user_model_answer: My favourite animal is a dog. I love dogs because they are excellent companions. Where do you prefer to keep your pet, indoors or outdoors? I have two Shih Tzus, which are indoor breeds. In fact, they sleep with me on my bed. Have you ever had a pet before? Apart from dogs, no. I’ve had dogs since childhood. What is the most popular animal in India? I think cows are the most popular animals in India. They have religious significance, and especially in rural areas, people treat them like family members.
- band_level: 7.5
  turn_type: standalone
  ai_line: 18. Mobile Phone What was your first mobile phone?
  user_model_answer: 'I think it was a Nokia 3310. It was a basic keypad phone, and I mainly used it for calling. Do you often use your mobile phone for texting or calling? I prefer calling. I don’t have the patience to wait for someone to read my message and reply. Will you buy a new phone in the future? Yes, but not anytime soon. I usually buy a new phone only when my current one starts causing problems. How has your mobile phone changed your life? www.youtube.com/makkarielts www.instagram.com/makkarielts www.makkarielts.com/books 289 Jan-Apr 2026 Speaking Guesswork (FIRST VERSION) www.makkarielts.com/books Follow us on Instagram for latest updates: www.instagram.com/makkarielts It has changed my life in many ways. I honestly can’t imagine my life without it now, as there are so many things I can do using my phone.'
