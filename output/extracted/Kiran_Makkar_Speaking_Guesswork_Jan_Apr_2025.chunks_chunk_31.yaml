- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Can a hospital function effectively without nurses?
  user_model_answer: No, a hospital cannot function effectively without nurses. Nurses provide essential care to patients, monitor their conditions, and support doctors in treatment. Without them, the healthcare system would struggle to operate smoothly.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. What are the differences between the work of a doctor and a nurse?
  user_model_answer: Doctors diagnose and treat medical conditions, while nurses focus more on patient care, monitoring, and supporting recovery. Doctors make decisions about treatment plans, whereas nurses ensure those plans are carried out properly.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Do you think it is necessary to learn first aid skills?
  user_model_answer: Yes, learning first aid skills is very important. It can help save lives in emergency situations and provide immediate care before professional help arrives. Everyone should have basic first aid knowledge. 4.Do you think that doctors and nurses are not paid enough? In many cases, doctors and nurses are not paid enough, considering the amount of responsibility and stress they handle. Their work is critical to society, and they often work long hours, which should be reflected in their salaries. https://g.co/kgs/xBR5EKQ
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. Who plays a more important role, doctors or nurses?
  user_model_answer: Both doctors and nurses play equally important roles. Doctors diagnose and plan treatments, while nurses provide ongoing care and emotional support to patients. The healthcare system relies on both working together effectively.
- band_level: 7.5
  turn_type: standalone
  ai_line: 6. Do you think doctors and nurses are very important?
