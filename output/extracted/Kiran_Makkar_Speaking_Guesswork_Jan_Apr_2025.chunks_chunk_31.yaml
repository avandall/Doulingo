- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Do you think people of all ages need to read?
  user_model_answer: Yes, reading is important for people of all ages. It helps young children develop language skills and creativity, while for adults, it keeps the mind sharp and expands knowledge. Even the elderly can benefit from reading as it stimulates the brain and prevents cognitive decline.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. What are the differences between paper books and movies?
  user_model_answer: Paper books allow readers to imagine scenes in their own way, while movies present a director's interpretation of the story. Books often provide more detail and insight into characters’ thoughts, whereas movies are visually engaging and faster to consume. For example, the Harry Potter books go much deeper into the story than the movies.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. What reading topics are popular in your country?
  user_model_answer: In my country, topics like self-help, fiction, and biographies are very popular. Many people enjoy reading about famous personalities, and fiction genres like mythology-based novels, such as those by Amish Tripathi, are widely read. Exam preparation books, like those for competitive exams, are also in high demand.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Is reading for fun or for work? https://g.co/kgs/xBR5EKQ
  user_model_answer: Reading can be for both fun and work. Many people read novels and fiction for entertainment, while others read academic or professional books for their career development. For instance, students read textbooks, while professionals read industry-related articles to stay updated.
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. Do you think parents should help their children develop the reading habit from an early age?
  user_model_answer: Yes, parents should encourage reading from an early age. It helps children build vocabulary, improve comprehension, and stimulates their imagination. For example, reading bedtime stories can foster a love for books that stays with them as they grow.
