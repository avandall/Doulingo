  ai_line: 5. Do Indian parents require their children to learn to play musical instruments?
  user_model_answer: In my opinion, not all parents, but many encourage children to learn instruments like harmonium, tabla, or guitar. They believe it builds discipline and creativity. Still, some parents don’t push it because they think academics are more important.
