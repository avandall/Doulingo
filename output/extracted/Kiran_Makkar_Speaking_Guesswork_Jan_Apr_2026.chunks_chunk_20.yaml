- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Can anyone learn how to sing?
  user_model_answer: Well, I think anyone can learn the basics of singing with practice and training. Some people are naturally gifted, but even without talent, voice lessons can improve a lot. For example, one of my school friends could not sing well earlier, but after coaching he became much better.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. What should the government do to help people with musical talent?
  user_model_answer: According to me, the government should provide scholarships, music schools, and platforms for young artists. This way talented people can focus on their art instead of worrying about money. Organising cultural festivals can also give them exposure.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. What kind of music do people like at different ages?
  user_model_answer: I believe children usually enjoy simple and fun songs, teenagers prefer energetic pop or rap, and older people go for calm or classical music. For example, my grandfather still listens to old Bollywood songs every evening, while my younger cousin only plays hip-hop.
