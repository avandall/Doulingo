sample_dialogues:
- band_level: 7.0
  turn_type: standalone
  ai_line: 7. What are the benefits of eating the following types of food? What are the drawbacks? Give reasons and examples for your answers.
  user_model_answer: a. vegetarian or vegan food b. low-fat foods c. organic fruit and vegetables d. free-range meat and eggs
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Read the following opinions about food and diet. Which statements do you agree with and which do you disagree with? Why? Tell your partner.
  user_model_answer: a. Extreme diets don't work and can be dangerous. b. People who have more food choices tend to have less healthy diets. c. If you follow a healthy diet there is no need to take extra vitamins and minerals. d. A diet without meat is unnatural; we need meat to be strong and healthy. e. A rise in food allergies is due to environmental factors. f. Our modern-day eating habits are healthier than they were 100 years ago. g. There is no point in providing food aid to poor nations. h. Cooking should be a compulsory subject for all children.
