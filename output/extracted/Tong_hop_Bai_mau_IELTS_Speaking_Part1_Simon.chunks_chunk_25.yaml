  ai_line: 3. When do you think you'll next make a telephone call?
  user_model_answer: 'profession or a business: đồng My family are expecting me to phone them as soon as I finish this exam. They''ll nghiệp want to know how it went. send a text message: gửi tin nhắn'
- band_level: 7.5
