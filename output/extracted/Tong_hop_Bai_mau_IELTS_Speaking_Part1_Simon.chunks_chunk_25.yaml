  ai_line: 1. How often do you make telephone calls?
  user_model_answer: 'I probably make three or four phone calls every day, usually just to make arrangements with work colleagues or to speak to family and friends. make arrangements with...:'
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Who do you spend most time talking to on the telephone?
  user_model_answer: sắp xếp buổi hẹn/ gặp gỡ với I think it would be one of my closest work colleagues. We often call each other... rather than meeting face-to-face. colleague
- band_level: 7.5
