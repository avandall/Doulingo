  ai_line: 4. Do you sometimes prefer to send a text message instead of telephoning?
  user_model_answer: Yes. I prefer to send a text message when I'm arranging something simple, like a time to meet someone. In those situations, a phone call isn't necessary. collected by ielts-nguyenhuyen.com
