  ai_line: 1. Do you like to wear hats?
  user_model_answer: No, I don’t like to wear hats. I find them very uncomfortable. OR Yes, I wear hats when I go out in the sun, or when watching a match in the stadium.
- band_level: 7.0
  turn_type: standalone
  ai_line: 2. What kinds of hats do you have?
  user_model_answer: I have a baseball cap, woolen caps for winters, a beret and some fashion hats.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Where do you like to buy hats?
  user_model_answer: I usually buy hats at a store where such accessories are available and some such stores are there in a nearby mall. I have also bought a couple of them online.
