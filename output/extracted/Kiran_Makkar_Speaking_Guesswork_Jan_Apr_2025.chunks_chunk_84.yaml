  turn_type: standalone
  ai_line: 4. Is wearing hats popular in your country? M a kk a r IE LTS
  user_model_answer: Yes wearing hats is popular in India. In different states of India there are different types of hats that are a part of the traditional attire. These days hats are very popular among the young generation. They wear them as a fashion accessory.
