- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Why do some people like to record important things with photos?
  user_model_answer: Photos help us remember special moments clearly. One picture can bring back a lot of emotions. That’s why many people take photos at weddings, birthdays, and trips.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. What can people learn from historical photographs?
  user_model_answer: They show us how people lived in the past—their clothes, houses, or lifestyle. It’s like getting a visual lesson about history. These pictures help us connect with old times.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Is taking photos the best way to remember something?
  user_model_answer: It depends. Photos are great, but sometimes just being present in the moment creates stronger memories. Not everything has to be captured by a camera.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Which is better, taking photos or keeping a diary?
  user_model_answer: I think both are good. Photos show how things looked, but a diary shows how we felt. I prefer a mix of both, especially when I travel or have a special day.
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. When do people take photos?
  user_model_answer: People mostly take photos during happy moments—like birthdays, holidays, or when they meet friends. Some also click random things they find beautiful.
