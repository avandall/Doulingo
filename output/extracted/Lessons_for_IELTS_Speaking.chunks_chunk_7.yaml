sample_dialogues:
- band_level: 7.0
  turn_type: standalone
  ai_line: 12. Work with a partner. Look at these contractions. Do you know the long forms?
  user_model_answer: '| Contraction | Long form | |-------------|-----------| | can''t | | | isn''t | | | don''t | | | didn''t | | | she''s | |'
- band_level: 7.5
  turn_type: standalone
  ai_line: 14. Look at these long forms. Do you know the contractions?
  user_model_answer: '| Contraction | Long form | |-------------|-----------| | | does not | | | will not | | | they are | | | it is | | | are not |'
- band_level: 7.5
  turn_type: standalone
  ai_line: 19. Listen to a candidate talking on this topic. As you listen, choose the right answer. a. What was the advertisement for? toilet cleaner / toilet paper / children's toys
  user_model_answer: b. Where did the speaker see/hear the advertisement? television / radio / Internet c. What was it like? serious / informative / humorous d. Why does the speaker remember it? the elegant music / the classical music / the rock music
- band_level: 7.5
  turn_type: standalone
  ai_line: 21. Look at the following questions and circle the word that best expresses your own opinion. a. advertisements that target children and young teenagers?
  user_model_answer: I think that they're... good / okay / bad b. advertisements that use very thin models? I think that they're... good / okay / bad c. advertisements that don't show the true price of the product or service? I think that they're... good / okay / bad d. advertisements that make the product or service appear better than it actually is? I think that they're... good / okay / bad
- band_level: 7.5
  turn_type: standalone
  ai_line: 27. Look at the following questions. Note down all of the vocabulary items you will need to give your own opinion. Use the Vocabulary Bank and your dictionary to help you if necessary. a. What do you think about advertisements that target children and young teenagers?
  user_model_answer: b. What do you think about advertisements that use very thin models? c. What do you think about advertisements that don't show the true price of the product or service? d. What do you think about advertisements that make the product or service appear better than it actually is? e. Do you think that advertising can have a negative influence on children? f. Do you think that the amount some companies spend on advertising is excessive? g. Do you think television advertising is more effective than print media?
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Listen and repeat the following Part 1 questions. i. Right, let's talk about what you do. Do you work or are you a student?
  user_model_answer: ii. What subjects are you studying? iii. Is biology a difficult subject? iv. What's the most interesting aspect of biology? v. What's the least interesting aspect of biology?
- band_level: 7.5
  turn_type: standalone
  ai_line: 6. Listen to the next part of the audio where the examiner asks two rounding-off questions. **Examiner:** After you completed your MBA studies, do you think you would want to do further study?
  user_model_answer: '**Candidate:** Ah, no... I think that would be enough. I will need to make some money after that. **Examiner:** Yes. And, do you normally find it easy or difficult to learn new things? **Candidate:** Um, it depends. I think it depends on whether I am interested in what I am learning or not. How motivated I am, you know... **Examiner:** Thank you.'
