sample_dialogues:
- band_level: 7.5
  turn_type: standalone
  ai_line: 17. Listen to the script and identify the various ways the candidate gives reasons in answer to the examiner's two questions. **Examiner:** 'Can you suggest reasons why governments host international events?'
  user_model_answer: '**Candidate:** ''I think there are a number of reasons for this. As far as I can see, the main purpose is to impress other countries,... to raise their status in the world... and maybe to improve international relations... I also believe governments like to host big events so that they can attract overseas visitors who will spend a lot of money... Yes, they do it for profit as well, I think.'' **Examiner:** ''Any country which decides to hold a large international event will need to spend more money on infrastructure. Why?'' **Candidate:** ''Spending on infrastructure will be necessary to upgrade public facilities. They will need to build more hotels, of course, for accommodation. They will also need a good public transportation system so that visitors can get around the city easily.'''
- band_level: 7.5
  turn_type: standalone
  ai_line: '1. With a partner, ask and answer these questions: - How long have you had your mobile phone?'
  user_model_answer: '- How often do you use it? - What do you mostly use it for? (text messaging, talking, taking photos...) - Which do you use more often: a laptop or a desktop computer? - What do you mostly use it for? (word processing, graphics, e-mail, games...) - How much time do you spend on the Internet each day? - What do you generally use the Internet for? (playing games, e-mail, research...) - How do you prefer to stay in touch with your friends and family? (face-to-face communication, landline telephone, mobile phone, e-mail, letters...)'
- band_level: 7.5
  turn_type: standalone
  ai_line: 8. Underline the auxiliary verbs in the follow-up questions below. These are the verbs (and tenses) you will use in your answers. a. Would you recommend this site to a friend?
  user_model_answer: b. Do you enjoy surfing the net? c. Was it hard to find this site? d. Will you tell other people about this site? e. Did you learn much from it? f. Is it suitable for very young people?
