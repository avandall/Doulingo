  ai_line: 1. What kind of trees do people usually plant in your country? How about your hometown?
  user_model_answer: People plant many kinds of trees in my country and hometown. Some of the popular ones are the Neem tree, Banyan tree, and Peepal Tree and these are popular for their medicinal uses, shade, and air purifying qualities. Fruit trees like Mango, Banana, Papaya are also very popular and frequently planted.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Have you ever planted trees?
  user_model_answer: Yes, my grandfather is an avid gardener and I have planted helped him plant many trees in their backyard. I also planted a lemon tree and a Banana tree in my house.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. What kind of trees do you plant?
  user_model_answer: Trees have so many uses and I like to plant all kinds of trees but my favorite is fruit trees. I have planted mango, banana, and lemon trees in my backyard.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Do you like planting trees and why?
  user_model_answer: I like planting trees because I feel that they have so many uses. They purify the air, reduce flooding, provide us food and shade. They also enhance the beauty of our surroundings. Gardening and planting trees also relax me.
