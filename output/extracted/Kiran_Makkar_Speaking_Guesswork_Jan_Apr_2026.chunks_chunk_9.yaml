- band_level: 7.5
  turn_type: standalone
  ai_line: 1. How could leaders encourage their employees?
  user_model_answer: There are many ways by which leaders and managers can encourage employees like leading through example, incentives and appreciation. I think each individual is wired differently. So, while one method may work for some people, it may not work for another person.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. When should parents encourage their children?
  user_model_answer: I think parents should always encourage their children. But children need encouragement especially if they are afraid of failing or trying out something new. Parents should tell them that success is secondary and trying is a much bigger achievement.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. What kind of encouragement should parents give?
  user_model_answer: I think parents can encourage their children in many ways. If children are afraid of embarrassment, parents can do the same thing in front of children first. For example, once in school, one of my friends’ father encouraged him to dance by himself dancing. But I think the biggest achievement is supporting children when they are trying something new and telling them that success doesn’t matter as long as they try something.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Do you think some people are better at persuading others?
