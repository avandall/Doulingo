- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Why do so many young people spend a lot of money on concerts?
  user_model_answer: I think it is mainly because of the experience. Hearing a singer on the screen can never match the feeling of hearing them live. Also, I think it’s about spending quality time with friends.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Do you think older people like the same music as young people?
  user_model_answer: I feel young people like pop, rock music, basically any music that they can dance to. They don’t care about the lyrics; they care more about the fast beats. Old people are more into soft, slow, music. They actually pay more attention to the lyrics.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Do you think music concerts are suitable for old people to attend?
  user_model_answer: I think it might be physically taxing for the old people to stand for so long at a concert. But otherwise, I think if the old people can manage the physical exertion, the concerts are certainly suitable. Today many concerts also offer chairs, where the older people can sit and enjoy the show rather than having to stand.
- band_level: 7.5
  turn_type: standalone
