sample_dialogues:
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Now, listen and repeat these questions. a. What's your first name?
  user_model_answer: b. What's your family name? c. Where do you come from? d. Are you a student or do you have a job? e. Why are you studying English? f. Where are you studying English? g. What do you enjoy about studying English?
- band_level: 7.5
  turn_type: standalone
  ai_line: 8. Listen to the audio and underline the stressed words in each sentence below. The first one has been done for you. a. What subjects are compulsory in your school? **In my school, we have to take language and maths, but we can choose history or chemistry.**
  user_model_answer: b. What are your favourite subjects? **I really like English because it's so interesting and the teacher is so fun!** c. What subjects do you not like? **I hate maths because it's boring and it's too hard.** d. Tell me about discipline in your school. **Our school is very strict. There are lots of rules. You have to wear a uniform and you can't talk in class.** e. What exams do you take? **At the end of Senior High, everyone takes the University Entrance exam. It's really difficult, and we have to do a lot of work.** f. How much homework do you have? **Lots! I have to work every night and I get so tired!**
- band_level: 7.5
  turn_type: standalone
  ai_line: 12. With your partner, ask and answer the following questions about your school. There are some ideas given to help you with the answers. | Questions | Answers | |-----------|---------| | a. What subjects are compulsory in your school? | In my school, we have to..., but we can choose... |
  user_model_answer: '| b. What are your favourite subjects? | I really like... because it''s... and... | | c. What subjects do you dislike? | I dislike... because it''s... | | d. Tell me about discipline in your school. | Our school is... You have to... | | e. What exams do you take? | At the end of... | | f. How much homework do you have? | Lots! I have to... |'
