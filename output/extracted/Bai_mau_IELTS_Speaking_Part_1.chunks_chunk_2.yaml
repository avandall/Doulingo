sample_dialogues:
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Are there any rules for students at your school?
  user_model_answer: Yes, there are quite a few rules. For example, we weren’t allowed to use mobile phones during class so that we could stay focused. Smoking was strictly prohibited, and fighting or cheating in exams was never tolerated.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Do you think students would benefit more from more rules?
  user_model_answer: Well, I think it depends. Having some basic rules about safety and behavior is definitely beneficial because they help maintain order. But if there are too many rules, students may feel restricted and lose motivation. I believe it’s about finding a balance between discipline and freedom.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Have you ever had a really dedicated teacher?
  user_model_answer: Yeah, I had one in high school — my English teacher. He was always the first to arrive and the last to leave, and he always made time for those who needed extra support. He tried to make every lesson engaging, and that really inspired us to study harder.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Do you prefer to have more or fewer rules at school?
  user_model_answer: Honestly, I’d prefer fewer rules. I mean, it’s important to have some basic ones, like no cheating or no fighting, because without them things would get out of control. But if there are rules for every little thing, it just feels really restrictive and makes school life pretty stressful. I think school should give students a bit of freedom so they can actually enjoy learning and not feel like they’re in some kind of prison.
