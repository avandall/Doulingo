  ai_line: 3. Do you prefer watching or playing sports?
  user_model_answer: 'successful at doing it: giỏi... I don''t watch much sport on TV and I''m not a big sports fan, so I think I would enjoy A more than B: thích A probably enjoy doing sports more than watching them.'
