sample_dialogues:
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Look at the list of ways of communicating. a. Which do you use on a regular (daily) basis?
  user_model_answer: b. Which do you use regularly but not every day? c. Which did you used to use more regularly than you do now? d. Which do you think you will not use as much in the future? e. Which have you never used? - text messaging - telephone calls from a landline - telephone calls on a mobile - handwritten letters - fax - email - typed or word-processed letters - social networking - instant messaging
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. What are the benefits and drawbacks of each type of communication in 1? Use the ideas below to help you.
  user_model_answer: '**Example:** Text messaging is a convenient and immediate form of communication but it can be too informal for some situations and messages can be deleted very easily. easy to use, behind the times, convenient, interactive, public, temporary, time-consuming, confidential, personal, slow, costly, impersonal, immediate, formal, easily deleted, harmful, permanent, informal'
- band_level: 7.5
  turn_type: standalone
  ai_line: 6. Look at the notes that the candidate wrote to prepare for the same task. Did the candidate mention all the points on the card? How similar are the notes to the ones you made as you listened?
  user_model_answer: '> boss - formal letter - job offer > last April, long wait after interview, thought it was rejection > short, start date, pay, invite to HR dept > first job - pleased, wanted job, surprised, excited'
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Identify and mark the intrusive sounds in the questions below, as in the example. a. How often do you check your email inbox? Do you think this is too often?
  user_model_answer: b. Are there any minority languages in your country? Are they in danger of extinction? c. How effective are your oral communication skills? What can you do to improve them? d. Does mobile technology make it easier or more difficult to switch off from study or work? e. Is your own language difficult for other language speakers to learn? f. How are languages best learnt? Are they easier to learn when you are young?
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Look at the pictures and answer the questions. a. Which of the eating situations can you most relate to?
  user_model_answer: b. Where do you eat on an average day? Who do you eat with? c. Do you think your eating habits are generally healthy or unhealthy?
