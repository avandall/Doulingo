  ai_line: 20. Mobile Phones Do you use your phone often?
  user_model_answer: 'Keywords: every day, important Yes, I use my phone every day for work, communication, and entertainment. It’s an important part of my daily life. What do you use your phone for? Keywords: texting, videos, music, internet I use it for texting, watching videos, listening to music, and browsing the internet. It helps me stay connected with everything. Do you think people use their phones too much? Keywords: too much, health, take breaks Yes, many people spend too much time on their phones, which is not good for their health. It’s important to take breaks and use them wisely.'
