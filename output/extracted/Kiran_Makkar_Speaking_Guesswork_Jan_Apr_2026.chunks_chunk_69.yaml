sample_dialogues:
- band_level: 7.0
  turn_type: standalone
  ai_line: 1. Do you write a lot?
  user_model_answer: Yes, I write a lot as I must do a lot of writing in my work. However, I don’t write by hand, I type.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. What do you like to write? Why?
  user_model_answer: Apart from my work, I write poetry. Sometimes, I also write about experiences so that I can learn from them. It’s also a means of expressing my feelings. When I see something beautiful, I just want to express it in words.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Do you think the things you write would change in the future?
  user_model_answer: Maybe. I don’t think about it. But I believe as I grew older, I changed my habits and character so I might also change what I write about in the future.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Do you prefer typing or handwriting when you are writing?
  user_model_answer: 'I prefer typing because it is more convenient and it’s also easier to store information. Also, my typing speed is a lot faster than my writing speed. www.youtube.com/makkarielts www.instagram.com/makkarielts www.makkarielts.com/books 304 Jan-Apr 2026 Speaking Guesswork (FIRST VERSION) www.makkarielts.com/books Follow us on Instagram for latest updates: www.instagram.com/makkarielts'
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. What’s the weather like where you live?
  user_model_answer: Fortunately, I live in an area where the weather is pleasant throughout the year. The temperature ranges between 15-25C throughout the year.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Do you prefer hot or cold weather?
  user_model_answer: I like pleasant weather. I neither like hot weather nor cold weather. However, If I had to choose one, I would choose hot weather because the AC makes it comfortable inside the house in the summer and, I can wear beautiful summer dresses. However, in the winter, my feet are always cold and because of that I am always uncomfortable. My clothing choices also get very limited in the cold weather.
- band_level: 7.0
  turn_type: standalone
  ai_line: 3. Do you prefer dry or wet weather?
  user_model_answer: I prefer dry weather because in the wet weather my shoes and clothes get dirty very easily.
- band_level: 7.0
  turn_type: standalone
  ai_line: 4. Are you in the habit of checking the weather forecast? When and how often?
  user_model_answer: No, I don’t have that habit because the weather is stable where I live. It doesn’t change very suddenly.
- band_level: 7.5
  turn_type: standalone
  ai_line: 5. What do you think are the effects of climate change in recent years?
  user_model_answer: I think the biggest change has been the increase in the number of climatic disasters in recent years. It seems like every year there is a climatic disaster now. Earlier these events used to happen after many years. Secondly, in my area at least, the winters have become milder, and the summers have become much warmer. It is impossible to survive without air conditioning now.
- band_level: 7.5
  turn_type: standalone
  ai_line: 6. Would you like to visit other cities that have different climates from where you live?
  user_model_answer: Yes, of course. I especially want to go a hill station with a lot of snow. It never snows in my area, there are hailstorms sometimes but not snowfall. So, I really want to enjoy the snow.
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. When do you usually eat snacks now?
  user_model_answer: I normally have snacks with tea in the evening. I also have it during movie nights with my family or when I got out with friends or family.
- band_level: 7.0
  turn_type: standalone
  ai_line: 2. Do you think it is healthy for you to eat snacks?
  user_model_answer: No, it is not healthy. However, I think if I eat snacks in a limit, it doesn’t make a big difference.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Did you often eat snacks when you were young?
  user_model_answer: Yes, when I was younger, I preferred eating snacks over regular meals. I remember my parents used to scold me a lot about it. I used to spend all my pocket money on snacks.
- band_level: 7.0
  turn_type: standalone
  ai_line: 4. What snacks do you like to eat?
  user_model_answer: I don’t have a sweet tooth. So, I prefer savory snacks like chips and Indian snacks like pakoras and samosas.
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Are you a patient person?
  user_model_answer: 'If I was asked this question a few years back, I would have said yes definitely. However, now I would say I do lose patience sometimes. With age, I have become a little bit impatient. www.youtube.com/makkarielts www.instagram.com/makkarielts www.makkarielts.com/books 305 Jan-Apr 2026 Speaking Guesswork (FIRST VERSION) www.makkarielts.com/books Follow us on Instagram for latest updates: www.instagram.com/makkarielts'
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. What is it that makes you feel impatient?
  user_model_answer: The main thing that makes me impatient is my expectation. I normally expect something to be done in a particular period and when that doesn’t happen or it takes much longer than expected, I do get impatient.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. How do you feel when you have to do something for a long time?
  user_model_answer: I start feeling fatigued, bored and even impatient and frustrated if the progress is slower than I expected. That’s why I take breaks from time to time.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Are you more patient now than when you were a child?
  user_model_answer: On the contrary, I am less patient. I tend to lose patience quicker. I think it’s because I have more responsibilities now and when something takes longer than I expect, it disrupts my other activities too.
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. What is the favorite machine in your home?
  user_model_answer: My favorite machine in my house is my coffee machine. I just can’t survive without it and because of this one machine I save a lot of money as earlier I used to go to cafés for drinking coffee.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Do you think washing machines and sweeping machines are important?
  user_model_answer: Yes, of course. I don’t think people can do things manually nowadays. Due to long working hours and hectic lifestyles, these machines have become indispensable.
- band_level: 7.0
  turn_type: standalone
  ai_line: 3. Do you read instructions before using a machine?
  user_model_answer: I try using it on my own first. If I am not able to figure it out, only then I turn to the instructions.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Do you think it is important to read instructions?
  user_model_answer: I think it helps, and it is a good idea if we are using something for the first time or using something delicate, which might break if not used correctly.
- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Are you good at memorising things?
  user_model_answer: No, I am not very good at memorizing things. That’s why, if it is something important, I usually note it down in my phone.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Have you ever forgotten something important?
  user_model_answer: Yes, once I forgot a dental appointment and I only realized it after I got a call from the dentist office that they were waiting for me.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. What do you need to remember in your daily life?
  user_model_answer: I don’t need to remember much. I think it’s mostly passwords nowadays. I think that’s the I have become bad at memorizing things.
- band_level: 7.0
  turn_type: standalone
  ai_line: 4. How do you remember important things?
  user_model_answer: I generally type it in the Notes app in my mobile phone. I also use the Reminder app.
- band_level: 7.5
  turn_type: standalone
  ai_line: 65. Borrowing/lending How do you feel when people don't return things they borrowed from you?
  user_model_answer: It is very frustrating when people don’t return the things they borrow from you but I don’t let it bother me too much. Do you like to lend things to others? I don’t mind lending things if I trust the person. Have you ever borrowed money from others? Yes, I have borrowed money a few times from my friends and relatives. I make it a point to return the money on time. Have you borrowed books from others? Yes, I often borrow books from libraries and friends. If I really like a book I borrowed, I buy it later for myself
- band_level: 7.5
  turn_type: standalone
  ai_line: 66. Colors What color makes you uncomfortable in your room?
  user_model_answer: I don’t like black in my room as it feels too dark and intense for me. I like light colors on the walls. What colors do your friends like most? My friends like shades of blues and green the most. What is the color you dislike? Why? I don’t like fluorescent colors like fluorescent green and yellow as they are too loud for my taste. What's your favorite color? My favorite color is blue as it is very calming. It reminds of the ocean and I find it very soothing to the eyes.
- band_level: 7.5
  turn_type: standalone
  ai_line: 67. Hobby Do you have the same hobbies as your family members?
  user_model_answer: 'Yes, some hobbies I have are same as my family members like cooking and gardening. Do you have a hobby that you''ve had since childhood? Yes, I love to read and that is a hobby I have had since childhood. Did you have any hobbies when you were a child? Yes, as I mentioned before, I enjoyed reading as a child. I also loved to draw and color. Do you have any hobbies? www.youtube.com/makkarielts www.instagram.com/makkarielts www.makkarielts.com/books 307 Jan-Apr 2026 Speaking Guesswork (FIRST VERSION) www.makkarielts.com/books Follow us on Instagram for latest updates: www.instagram.com/makkarielts I like gardening, cooking, reading, hiking and travelling. Swimming. What''s the difference between swimming in the pool and swimming in the sea? Swimming in the pool is safer as you are in control. Swimming in the sea can be dangerous as there is a risk of drowning if the currents are too strong. Where do people in your country like to go swimming? People in my country like
    to go swimming in swimming pools. In villages, people swim in the ponds and rivers. Is it difficult to learn how to swim? It can be tough in the beginning but with proper technique and practice swimming can be learnt easily. It is good to learn it at a younger age than as an adult. Do you like swimming? Yes, I love to swim. It is very good, low impact aerobic exercise and tones the body.'
