- band_level: 7.5
  turn_type: standalone
  ai_line: 1. Do you often buy more than you expected?
  user_model_answer: Yes, I often buy more than I expected, but it is normally in case of small household items or grocery items. For example, I would buy 2 pairs of jeans if they are on an offer, even if I need just one. The iPhone was the first time, I spent so much more than I should have spent.
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. What do you think young people spend most of their money on?
  user_model_answer: I think young people spend their money on clothes and other fashion accessories like belts, shoes, etc. Also, I think a lot of youth spend their money on gadgets like mobile phones, laptops, and headphones.
- band_level: 7.5
  turn_type: standalone
  ai_line: 3. Do you think it is important to save money? Why?
  user_model_answer: Yes, I think it is crucial as we can never be certain about the future. The recent Corona epidemic has made it even more clear that how uncertain life is. Many people died because they couldn’t afford the costly healthcare. Also, if people didn’t have savings, it would have been impossible to tide over these difficult times.
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Do people buy things that they don’t need?
