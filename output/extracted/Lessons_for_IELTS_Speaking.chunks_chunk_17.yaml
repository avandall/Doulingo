sample_dialogues:
- band_level: 7.5
  turn_type: standalone
  ai_line: 20. Ask and answer the same questions with your partner. Use your notes from Exercise 18 and the language from the dialogue above to help you. **Q1:** Now, I'd like to move on to ask you some more general questions. Firstly, could you tell me how people express wealth and affluence in your country?
  user_model_answer: '- I think more and more people are choosing to show their status through... - For example, wealthy people might... or... to show that they have lots of money. - Some other people see... as an expression of wealth, for example,... **Q2:** And what do you see as the advantages and disadvantages of consumerism? - I believe that consumerism is positive in terms of... and... - However, the drawback of consumerism is that... - I think people become... **Q3:** Okay. So thinking about that, do you believe society nowadays is more materialistic than in previous generations? - I think so./I don''t think so. - For my grandparents'' generation, it was... - Whereas today, people might say that my generation is... - For instance, while my grandparents might have been focused on..., some young people today are more interested in... **Q4:** Okay, and finally, how do you think technology has affected purchasing behaviour? - It has/has not changed the way people buy things. - Take...
    as an example. -...so... (reason/result).'
- band_level: 7.5
  turn_type: standalone
  ai_line: 2. Now, think about each of the above jobs. What would you have to do every day if this was your job? The first two have been done for you as examples.
  user_model_answer: '| Jobs | Duties | |------|--------| | nurse | look after sick people in hospital; assist doctors; record patient information; change bandages and dressings; hand out medication | | mechanic | repair people''s cars; check cars for safety; talk to customers | | accountant | | | teacher | | | plumber | |'
- band_level: 7.5
  turn_type: standalone
  ai_line: 4. Think of three different jobs you would like to do. Brainstorm each one and write words in the correct columns below. Use the Vocabulary Bank and your dictionary to help you. | | What is the job? | What would you have to do every day? | What skills or qualifications would you need? | Why would you like to do this job? |
  user_model_answer: '|---|------------------|--------------------------------------|-----------------------------------------------|--------------------------------------| | e.g. | secretary | type letters, answer the phone, make appointments, make travel bookings, send and collect mail | typing, computer, reading, listening, speaking, foreign language | interesting, varied, meet different people | | 1 | | | | | | 2 | | | | | | 3 | | | | |'
- band_level: 7.5
  turn_type: standalone
  ai_line: 18. Now, look at the future time phrases in the box below. When do you think the things in Exercise 17 will happen? With a partner, take turns to make predictions, using the time phrases in the box.
  user_model_answer: Over the next decade, In years to come, In 2050, In the future, In the next millennium, In 20 years' time, In 50 years from now, Over the course of this century, Hundreds of years from now
- band_level: 7.5
  turn_type: standalone
  ai_line: 19. Look at the following questions. Note down all of the vocabulary items you will need to make predictions about employment in the future. Use the Vocabulary Bank and your dictionary to help you if necessary. a. What do you think the average workplace will be like in the future?
  user_model_answer: b. What do you think the situation of women employees will be like in the future? c. How do you think that jobs will be different in the future? d. What will be the role of machines in the workplace of the future? e. Do you think that the length of the working week will change in the future? f. Do you think that salaries will increase enough to cover the cost of living? g. Do you think that people will need more training and qualifications? | Useful Phrases & Collocations | |-------------------------------| | annual leave, on-the-job training, to argue a case, career advancement, pay parity, to give someone advice on / about something, employment agency, shift work, to give someone the opportunity to do something, employment contracts, sick leave, to let someone know something, employment relations, situations vacant, to solve a problem, hours of work, social club, job pressure, temp / temping agency, job security, working conditions, job title, work experience |
